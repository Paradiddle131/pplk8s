# Who reads and writes which BigQuery dataset on the lab project (#205; option A of
# docs/semantic-layer-on-bigquery.md, "Who sees what"): one service account per workload, dataset-level
# grants, BigQuery Job User on the project to run its queries. infra/bigquery.tf reads this file, and
# tests/test_access.py holds each account to the lab role it stands for (dbt/macros/agent_warehouse.sql).
# `tables:` are table-level grants in `ops` (#209), one of `table_access` below: the agent reads ops.readiness and
# ops.product_deadlines (its freshness), the audit writer inserts into ops.agent_queries.
# `dbt run-operation agent_warehouse` creates those tables, so infra/bigquery.tf grants only on the ones that exist
# (tofu.sh lists the ops dataset), and the apply after it (`make gcp-workloads-up`) adds the rest.

# What each table-level access grants on its one table: a predefined role, or the permissions of a custom role
# (free) that infra/bigquery.tf declares for the project.
table_access:
  read: {role: roles/bigquery.dataViewer}
  # Least privilege for a parameterised DML `INSERT ... VALUES`: bigquery.tables.updateData ("Update table data") to
  # write the rows, bigquery.tables.get ("Get metadata for a table") for the target's schema; no getData, since "an
  # INSERT does not require reading any of the column data"; bigquery.jobs.create comes from BigQuery Job User on
  # the project (https://docs.cloud.google.com/bigquery/docs/control-access-to-resources-iam,
  # https://docs.cloud.google.com/bigquery/docs/column-level-security-writes,
  # https://docs.cloud.google.com/bigquery/docs/running-queries). BigQuery IAM cannot express insert-only:
  # updateData still permits UPDATE, DELETE and MERGE on that table (semantic/PLAN.md SL-10); the lab's Postgres
  # role is insert-only.
  insert: {permissions: [bigquery.tables.get, bigquery.tables.updateData]}

# One per dbt layer and stage (dbt/dbt_project.yml `+schema`), plus the landing dataset dbt reads.
datasets:
  ds_source: Landed source tables; EL Factory loads them (#227), dbt reads them.
  bronze: dbt's bronze layer.
  silver: dbt's silver layer; the semantic models' tables.
  gold: dbt's gold layer.
  exposed: dbt's exposed layer, what consumers read.
  semantic: The time spine and the semantic layer's own tables.
  ops: The audit table, freshness verdicts and the readiness ledger.
  legacy: Tables built the old way, for the migration rehearsal (SL-11).
  migration: The migration rehearsal's parity report (SL-11).

service_accounts:
  dbt-runner:
    description: Builds the dbt project (the dbt Cloud Run Jobs, #209).
    lab_role: warehouse
    reads: [ds_source]
    writes: [bronze, silver, gold, exposed, semantic, ops, legacy, migration]
  semantic-agent:
    description: The semantic agent's MetricFlow reads (Cloud Run, #209).
    lab_role: agent_metrics
    reads: [silver, semantic]
    writes: []
    tables: {ops.readiness: read, ops.product_deadlines: read}
  agent-audit:
    description: Inserts the agent's audit rows into ops.agent_queries, and nothing else (SL-10).
    lab_role: agent_audit
    reads: []
    writes: []
    tables: {ops.agent_queries: insert}
