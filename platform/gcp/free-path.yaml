# The free path (semantic/PLAN.md SL-13): every API the lab project may enable and every OpenTofu
# resource type platform/gcp/infra/ may declare, each with the page that shows why it costs nothing.
# `enable: true` APIs are the ones infra/ turns on now (it reads this file); the rest wait for the issue
# that needs them and are turned on by flipping the flag in that issue's PR.
# check_free_path.py (in `make gcp-validate`) fails on an API or resource type missing here, an entry
# without a source, anything on `paid` below, and an API or resource type past its dated `until`, so a paid
# service cannot slip in by review fatigue.
# Free tiers are counted per billing account, in us-central1 and BigQuery's US multi-region.

apis:
  # Control plane: no usage charge.
  serviceusage.googleapis.com: {enable: true, source: https://cloud.google.com/service-usage/docs/overview}
  cloudresourcemanager.googleapis.com: {enable: true, source: https://cloud.google.com/resource-manager/docs/resource-manager-api}
  iam.googleapis.com: {enable: true, source: https://cloud.google.com/iam/pricing}
  cloudquotas.googleapis.com: {enable: true, source: https://cloud.google.com/docs/quotas/overview}
  billingbudgets.googleapis.com: {enable: true, source: https://cloud.google.com/billing/docs/how-to/budgets}
  cloudbilling.googleapis.com: {enable: true, source: https://cloud.google.com/billing/docs/reference/rest}
  # BigQuery: 1 TiB of queries and 10 GiB of storage a month; load jobs, DML and the Storage Write API's first 2 TiB free.
  bigquery.googleapis.com: {enable: true, source: https://cloud.google.com/bigquery/pricing#free-tier}
  bigquerystorage.googleapis.com: {enable: true, source: https://cloud.google.com/bigquery/pricing#data_ingestion_pricing}
  bigquerydatatransfer.googleapis.com: {enable: true, source: https://cloud.google.com/bigquery/pricing#data_transfer_service_pricing}
  # Observability: logs 50 GiB a month per project, Google Cloud metrics free.
  logging.googleapis.com: {enable: true, source: https://cloud.google.com/stackdriver/pricing}
  monitoring.googleapis.com: {enable: true, source: https://cloud.google.com/stackdriver/pricing}
  # Cloud Storage: 5 GB-months of Standard storage in us-central1 (the OpenTofu state bucket; landing files later, #227).
  storage.googleapis.com: {enable: true, source: https://cloud.google.com/storage/pricing}
  # The kill switch: Pub/Sub's first 10 GiB a month, Eventarc's Pub/Sub-sourced events at $0,
  # Workflows' 5,000 internal steps a month (about one per budget notification).
  pubsub.googleapis.com: {enable: true, source: https://cloud.google.com/pubsub/pricing}
  eventarc.googleapis.com: {enable: true, source: https://cloud.google.com/eventarc/pricing}
  workflows.googleapis.com: {enable: true, source: https://cloud.google.com/workflows/pricing}
  workflowexecutions.googleapis.com: {enable: true, source: https://cloud.google.com/workflows/pricing}
  # Artifact Registry: 0.5 GiB-month of storage per billing account, pulls within us-central1 free (#230).
  artifactregistry.googleapis.com: {enable: true, source: https://cloud.google.com/artifact-registry/pricing}
  # Firestore: one free database per project, 1 GiB stored, 50,000 reads and 20,000 writes a day (the agent's sessions, #205).
  firestore.googleapis.com: {enable: true, source: https://cloud.google.com/firestore/pricing}
  # Cloud Run (#209), per billing account a month in us-central1: request-billed services 180,000 vCPU-seconds,
  # 360,000 GiB-seconds and 2 million requests; Jobs, billed for each instance's whole life (at least a minute),
  # 240,000 vCPU-seconds and 450,000 GiB-seconds (platform/gcp/workloads.yaml, held by check_free_path.py).
  run.googleapis.com: {enable: true, source: https://cloud.google.com/run/pricing, issue: 209}
  # Cloud Scheduler: 3 jobs a month per billing account, not per project (`caps.cloud_scheduler_jobs`).
  cloudscheduler.googleapis.com: {enable: true, source: https://cloud.google.com/scheduler/pricing, issue: 209}
  # Secret Manager: 6 active secret versions, 10,000 access operations and 3 rotation notifications a month
  # per billing account (the agent's model key, one version).
  secretmanager.googleapis.com: {enable: true, source: https://cloud.google.com/secret-manager/pricing, issue: 209}
  # Later issues on Map #212, off until their PR turns them on.
  modelarmor.googleapis.com: {enable: false, source: https://cloud.google.com/security-command-center/pricing, issue: 229}
  # A dated exception: free until 2026-12-31, switched off by #232.
  geminidataanalytics.googleapis.com: {enable: false, source: https://cloud.google.com/gemini/docs/conversational-analytics-api/overview, issue: 207, until: 2026-12-31}

# Resource type => the API it needs; or {api, source, until} for a type free only until a date, which
# `make gcp-validate` refuses to see declared after it.
resources:
  google_project_service: serviceusage.googleapis.com
  google_service_account: iam.googleapis.com
  google_project_iam_member: cloudresourcemanager.googleapis.com
  google_project_iam_custom_role: {api: iam.googleapis.com, source: https://cloud.google.com/iam/pricing}
  google_pubsub_topic: pubsub.googleapis.com
  google_workflows_workflow: workflows.googleapis.com
  google_eventarc_trigger: eventarc.googleapis.com
  google_bigquery_dataset: bigquery.googleapis.com
  google_bigquery_dataset_iam_member: bigquery.googleapis.com
  google_bigquery_table_iam_member: bigquery.googleapis.com
  google_firestore_database: firestore.googleapis.com
  google_cloud_quotas_quota_preference: cloudquotas.googleapis.com
  google_artifact_registry_repository: artifactregistry.googleapis.com
  google_artifact_registry_repository_iam_member: artifactregistry.googleapis.com
  google_service_account_iam_member: iam.googleapis.com
  google_cloud_run_v2_service: run.googleapis.com
  google_cloud_run_v2_job: run.googleapis.com
  google_cloud_run_v2_job_iam_member: run.googleapis.com
  google_cloud_scheduler_job: cloudscheduler.googleapis.com
  google_secret_manager_secret: secretmanager.googleapis.com
  google_secret_manager_secret_iam_member: secretmanager.googleapis.com
  # The source-freshness alert (#209): a user-defined log-based metric is a chargeable custom metric, held under
  # Monitoring's free 150 MiB a month by `caps.log_metric_series`; a notification channel bills nothing; alerting
  # policies are free until Cloud Monitoring starts charging for them, "no sooner than September 1, 2027".
  google_logging_metric: {api: logging.googleapis.com, source: https://cloud.google.com/stackdriver/pricing#log-based-metrics}
  google_monitoring_notification_channel: monitoring.googleapis.com
  google_monitoring_alert_policy: {api: monitoring.googleapis.com, source: https://cloud.google.com/stackdriver/pricing#pricing-alerting, issue: 209, until: 2027-08-31}

# APIs GCP turns on by itself with the ones above (BigQuery, Storage, IAM, Firestore, Workflows): they bill
# nothing for being on, only for what is used through them, and the lab uses none of them directly.
# `make gcp-guardrails-check` fails on an enabled API that is neither above nor here.
implicit:
  analyticshub.googleapis.com: {source: https://cloud.google.com/bigquery/docs/analytics-hub-introduction#pricing}
  apptopology.googleapis.com: {source: https://cloud.google.com/app-hub/docs/overview}
  bigqueryconnection.googleapis.com: {source: https://cloud.google.com/bigquery/docs/connections-api-intro}
  bigquerydatapolicy.googleapis.com: {source: https://cloud.google.com/bigquery/docs/column-data-masking-intro}
  bigquerymigration.googleapis.com: {source: https://cloud.google.com/bigquery/docs/migration-intro#pricing}
  containerregistry.googleapis.com: {source: https://cloud.google.com/artifact-registry/pricing}  # on with run.googleapis.com; gcr.io is served by Artifact Registry, nothing stored there
  cloudtrace.googleapis.com: {source: https://cloud.google.com/stackdriver/pricing#trace-costs}
  dataform.googleapis.com: {source: https://cloud.google.com/dataform/pricing}
  firebaserules.googleapis.com: {source: https://cloud.google.com/firestore/pricing}  # Firestore's Security Rules companion, no charge of its own
  datastore.googleapis.com: {source: https://cloud.google.com/firestore/pricing}
  iamcredentials.googleapis.com: {source: https://cloud.google.com/iam/pricing}
  servicemanagement.googleapis.com: {source: https://cloud.google.com/service-infrastructure/docs/service-management/getting-started}
  storage-api.googleapis.com: {source: https://cloud.google.com/storage/pricing}
  storage-component.googleapis.com: {source: https://cloud.google.com/storage/pricing}
  telemetry.googleapis.com: {source: https://cloud.google.com/stackdriver/pricing}

# The stops, in one place: infra/ applies the query quota, and `make gcp-guardrails-check` reads them back.
caps:
  # BigQuery bytes a day, for the project and for each user, in MiB: 31 days stay under the free 1 TiB.
  bigquery_query_mib_per_day: 31457
  # Bytes one query job may bill (cloud sessions' ~/.bigqueryrc, dbt's `gcp` target): 1 GiB.
  bigquery_maximum_bytes_billed: 1073741824
  # Instances one Cloud Run service may run at once (its max_instance_count; minimum always 0).
  cloud_run_max_instances: 1
  # Cloud Scheduler jobs in the project, at most the billing account's 3 free ones: workloads.yaml's two
  # schedules and the orchestration of #228.
  cloud_scheduler_jobs: 3
  # Cloud Run's regional quotas in us-central1 (#209), by the quota's metric: a stop on how much may run at once,
  # whatever a deploy asks. The most workloads.yaml can run together (the agent's service at its cap, one task of
  # each Job: 3 vCPU, 1.5 GiB) plus one service instance for a revision rollout: 4 vCPU (in milli vCPU),
  # 4 x 512 MiB (in bytes). check_free_path.py refuses a value above that; infra/run.tf sets each as a quota
  # preference with dimension region (only lowered, never raised); `make gcp-guardrails-check` reads them back by
  # metric. Ids, metrics and units as the project's run.googleapis.com quotaInfos list them (2026-11-02):
  # us-central1 defaults 200,000 milli vCPU and 400 GiB. No instance quota: `InstancesPerProject` governs
  # "Cloud Run Instances resources, not instances of Cloud Run Services, Jobs, or Worker Pools" (its display
  # name), and its us-central1 value is 0, so a preference of 4 is an increase the API refuses without a contact
  # email; each service's max_instance_count, and the vCPU quota at 1 vCPU an instance, bound the instances.
  cloud_run_regional_quotas:
    run.googleapis.com/cpu_allocation: {quota_id: CpuAllocPerProjectRegion, unit: milli_vcpu, value: 4000}
    run.googleapis.com/mem_allocation: {quota_id: MemAllocPerProjectRegion, unit: bytes, value: 2147483648}
  # Time series across the user-defined log-based metrics (the freshness alert's: one per source table and error
  # status). Each writes at most a point a minute, 8 bytes, and Monitoring's first 150 MiB a month per billing
  # account are free: 100 x 44,640 minutes x 8 B = 34 MiB.
  log_metric_series: 100
  # Notification channel types infra/ may declare: email needs nothing else; a Pub/Sub or webhook channel hands
  # each alert to a service with its own bill, and SMS is not on the pricing page at all.
  notification_channel_types: [email]

# No Always Free tier, or a free tier the lab cannot hold: never on the list above.
paid:
  - compute.googleapis.com
  - container.googleapis.com
  - composer.googleapis.com
  - sqladmin.googleapis.com
  - redis.googleapis.com
  - alloydb.googleapis.com
  - spanner.googleapis.com
  - bigtableadmin.googleapis.com
  - file.googleapis.com
  - dataproc.googleapis.com
  - dataflow.googleapis.com
  - notebooks.googleapis.com
  - aiplatform.googleapis.com
  - bigqueryreservation.googleapis.com
  - cloudfunctions.googleapis.com
  # Artifact Analysis: enabling either turns on vulnerability scanning, billed per image scanned.
  - containerscanning.googleapis.com
  - ondemandscanning.googleapis.com
