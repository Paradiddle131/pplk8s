# kind cluster standing in for GKE: one control plane, two workers.
# The node image (Kubernetes version) is pinned in platform/kind/cluster-up.sh.
# kind node images from v0.27 on already read registry config from
# /etc/containerd/certs.d, where cluster-up.sh points localhost:5001 at the
# local registry container.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pplk8s
nodes:
  - role: control-plane
  - role: worker
  - role: worker
