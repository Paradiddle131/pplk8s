# "Managed services" that sit outside the cluster in production (PLAN.md §2).
# Ports bind to 127.0.0.1 only; containers reach each other on the pplk8s network.
name: pplk8s

services:
  warehouse: # BigQuery stand-in: one Postgres database, datasets as schemas (D8)
    image: postgres:18.6
    # Unthrottled autovacuum, so a replaced month's dead rows are reclaimed before the next load
    # needs the space. At the default cost delay autovacuum fell behind: ds_source.tlc_yellow reached
    # 21 GB for 3.5 GB of rows, and silver.tlc_trips grew 1.1 GB per same-month rebuild (4.5 GB after
    # three); now it holds at live rows plus one month (~2.3 GB). The throttle protects concurrent
    # OLTP latency, which a single-user lab warehouse does not have. BigQuery has no equivalent.
    command: ["postgres", "-c", "autovacuum_vacuum_cost_delay=0", "-c", "autovacuum_naptime=15s"]
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-warehouse}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql
      - ./warehouse-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 2s
      timeout: 3s
      retries: 30

  metadata-db: # Cloud SQL stand-in for Airflow's metadata (D6); reached in-cluster as metadata-db:5432
    image: postgres:18.6
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD:-airflow}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - metadata-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Database monitoring, as Cloud SQL provides it outside GKE (PLAN.md D21): one exporter per
  # database, scraped by the in-cluster Prometheus at <name>:9187 over the pplk8s network.
  metadata-db-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: metadata-db:5432/airflow?sslmode=disable
      DATA_SOURCE_USER: airflow
      DATA_SOURCE_PASS: ${METADATA_DB_PASSWORD:-airflow}
    depends_on: [metadata-db]
    # Stopping the database is a drill; the exporter keeps running and reports pg_up 0.
    restart: unless-stopped

  # Airflow's own view of its components from the metadata DB: live schedulers, triggerers and
  # dag-processors by heartbeat (D31), which the degraded-HA alerts compare with the desired replicas.
  metadata-db-sql-exporter:
    image: burningalchemist/sql_exporter:0.24.9
    command: ["-config.file=/etc/sql_exporter/sql_exporter.yml"]
    environment:
      SQLEXPORTER_TARGET_DSN: postgresql://airflow:${METADATA_DB_PASSWORD:-airflow}@metadata-db:5432/airflow?sslmode=disable
    volumes:
      - ./sql-exporter:/etc/sql_exporter:ro
    depends_on: [metadata-db]
    restart: unless-stopped

  warehouse-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: warehouse:5432/warehouse?sslmode=disable
      DATA_SOURCE_USER: warehouse
      DATA_SOURCE_PASS: ${WAREHOUSE_PASSWORD:-warehouse}
    depends_on: [warehouse]
    restart: unless-stopped

  # The readiness rows Airflow runs wrote, which AirflowMetadataBehindWarehouse matches against the
  # runs the metadata DB knows (D32): same image and collector files as the metadata DB's exporter.
  warehouse-sql-exporter:
    image: burningalchemist/sql_exporter:0.24.9
    command: ["-config.file=/etc/sql_exporter/warehouse.yml"]
    environment:
      SQLEXPORTER_TARGET_DSN: postgresql://warehouse:${WAREHOUSE_PASSWORD:-warehouse}@warehouse:5432/warehouse?sslmode=disable
    volumes:
      - ./sql-exporter:/etc/sql_exporter:ro
    depends_on: [warehouse]
    restart: unless-stopped

  pubsub: # Pub/Sub stand-in; in-network PUBSUB_EMULATOR_HOST=pubsub:8085, host localhost:8085
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:588.0.0-emulators
    command: [gcloud, beta, emulators, pubsub, start, --project=pplk8s, --host-port=0.0.0.0:8085]
    ports:
      - "127.0.0.1:8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085/"]
      interval: 2s
      timeout: 3s
      retries: 60
    # The emulator keeps topics and subscriptions in memory only; pubsub-init recreates them.

  pubsub-init: # one-shot: topic + subscriptions (PLAN.md D17); idempotent, re-runs on every `up`
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:588.0.0-emulators
    depends_on:
      pubsub:
        condition: service_healthy
    entrypoint: [sh, -ec]
    command:
      - |
        api=http://pubsub:8085/v1/projects/pplk8s
        put() { # path body -> 200 created, 409 already exists
          code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'Content-Type: application/json' -d "$$2" "$$api/$$1")
          case "$$code" in 200|409) echo "$$1 ready" ;; *) echo "$$1: HTTP $$code" >&2; exit 1 ;; esac
        }
        put topics/gcs-object-events '{}'
        # file-arrivals feeds the event adapter; file-arrivals-assetwatcher feeds the AssetWatcher spike.
        for sub in file-arrivals file-arrivals-assetwatcher; do
          put "subscriptions/$$sub" '{"topic":"projects/pplk8s/topics/gcs-object-events","ackDeadlineSeconds":60}'
        done

  gcs: # GCS stand-in; in-network STORAGE_EMULATOR_HOST=http://gcs:4443, host http://localhost:4480
    image: fsouza/fake-gcs-server:1.56.1
    command:
      - -scheme=http
      - -port=4443
      - -backend=filesystem
      - -filesystem-root=/storage
      # Location header for resumable uploads; must resolve from the client.
      - -external-url=http://gcs:4443
      # Object notifications (the GCS → Pub/Sub notification config): finalize events of bucket
      # `landing` only, published to the emulator found through PUBSUB_EMULATOR_HOST.
      - -event.pubsub-project-id=pplk8s
      - -event.pubsub-topic=gcs-object-events
      - -event.bucket=landing
      - -event.list=finalize
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
    depends_on:
      pubsub-init: # fake-gcs never creates the topic, and publishes fail without it
        condition: service_completed_successfully
    ports:
      # Host port 4480: on WSL2, Windows svchost holds 4443 and Docker Desktop
      # then skips the binding without an error.
      - "127.0.0.1:4480:4443"
    volumes:
      - gcs-data:/storage

  # BigQuery engine stand-in for the semantic path's dialect (semantic/PLAN.md SL-7), beside the
  # Postgres warehouse rather than in its place; profile `bigquery`, so `make services-up` skips it
  # and `make bigquery-emulator-check` starts it. In memory: a restart empties it.
  bigquery:
    profiles: [bigquery]
    image: ghcr.io/goccy/bigquery-emulator:0.8.1
    command: [--project=pplk8s-lab, --port=9050, --grpc-port=9060]

  bigquery-api: # host http://localhost:9050: the emulator behind the shim for dbt-bigquery's two gaps
    profiles: [bigquery]
    image: python:3.13-slim
    command: [python, -I, /shim/shim.py]
    environment:
      UPSTREAM: http://bigquery:9050
    depends_on: [bigquery]
    ports:
      - "127.0.0.1:9050:9050"
    volumes:
      - ./bigquery-shim:/shim:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9050/bigquery/v2/projects/pplk8s-lab/datasets', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  warehouse-data:
  gcs-data:
  metadata-db-data:

networks:
  default:
    name: pplk8s
