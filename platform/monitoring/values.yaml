# Values for prometheus-community/kube-prometheus-stack, pinned in deploy.sh (PLAN.md D21).
# The in-cluster monitoring stack is the self-managed GKE stand-in for Cloud Monitoring: Prometheus,
# Alertmanager, Grafana, kube-state-metrics, and node-exporter, trimmed for one laptop.
fullnameOverride: kps

# kind runs etcd, the controller manager, the scheduler and kube-proxy as static pods that bind to
# localhost; scraping them only adds failing targets and their alerts. GKE hides them too.
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
  # Both fire falsely on WSL2, whose monotonic clock runs ~6.5% slower than wall time: Hyper-V
  # TimeSync steps the wall clock forward ~2 s every ~32 s to catch up with the host (issue #5).
  disabled:
    # The VM's boot time is corrected with each step, so every process's process_start_time_seconds
    # creeps upward (~2.5 s per 30 s observed) and counts as a restart.
    AlertmanagerClusterCrashlooping: true
    # Prometheus ticks rule groups on the monotonic clock but counts missed slots on the wall clock,
    # so wall time gains one 15 s slot every ~4 min and every group "misses" one evaluation at once.
    # PrometheusRuleGroupOverrun (manifests/prometheus-rules.yaml) alerts on the real cause instead.
    PrometheusMissingRuleEvaluations: true

prometheus:
  prometheusSpec:
    # Short intervals so a drill's alert fires within a minute or two.
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 2d
    # The TSDB lives on a PVC, so a pod move or restart keeps the history that drills and alert
    # back-tests read (issue #9). About 3.4k samples/s is ~1 GB for 2 days plus the WAL;
    # retentionSize keeps it inside the volume.
    retentionSize: 4GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 5Gi}
    # kind's local-path PV is pinned to the node it was created on, so a drain of that node would
    # leave Prometheus Pending and blind for the drill it should observe. The control plane is
    # never drained, so Prometheus and its volume stay there (PLAN.md D21).
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
    # Select ServiceMonitors, PodMonitors, ScrapeConfigs and rules from every release and namespace,
    # not only those labelled with this release (the Airflow monitors live in platform/monitoring).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 1536Mi}

alertmanager:
  # The default config routes everything to a `null` receiver: alerts are visible in Prometheus
  # (ALERTS{alertstate="firing"}) and the Alertmanager UI, and go nowhere else (D28).
  alertmanagerSpec:
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 128Mi}

prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

kube-state-metrics:
  fullnameOverride: kube-state-metrics
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}

prometheus-node-exporter:
  fullnameOverride: node-exporter
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 64Mi}

grafana:
  fullnameOverride: grafana
  # Lab-only login, reached through `make grafana-ui` (port-forward to localhost).
  adminUser: admin
  adminPassword: admin
  defaultDashboardsTimezone: utc
  sidecar:
    dashboards:
      # Dashboards are ConfigMaps labelled grafana_dashboard=1, in any namespace (manifests/).
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  # Grafana 13 idles near 270Mi; loading the Airflow dashboard over 6 h at 384Mi
  # got it OOMKilled, so the limit leaves room for a burst of panel queries.
  resources:
    requests: {cpu: 50m, memory: 320Mi}
    limits: {memory: 768Mi}
