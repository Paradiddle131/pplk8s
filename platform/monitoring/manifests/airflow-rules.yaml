# Airflow alert rules (PLAN.md D28): every failure drill in docs/runbook.md fires one of these, and
# Grafana's "Airflow overview" dashboard shows the same signals. Alertmanager routes them to its
# null receiver; firing alerts are read from Prometheus (ALERTS{alertstate="firing"}).
# Heartbeat counters keep their last value in the statsd-exporter when a component stops, so their
# rate drops to 0; `or vector(0)` also covers the series vanishing when the exporter restarts.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: airflow
  namespace: monitoring
spec:
  groups:
    - name: airflow.components
      rules:
        - alert: AirflowSchedulerDown
          expr: (sum(rate(airflow_scheduler_heartbeat[1m])) or vector(0)) == 0
          for: 1m
          labels: {severity: critical, component: scheduler}
          annotations:
            summary: No scheduler heartbeat for over a minute; no task gets scheduled.
            runbook: docs/runbook.md#1-lose-a-scheduler
        - alert: AirflowDagProcessorDown
          expr: (sum(rate(airflow_dag_processor_heartbeat[1m])) or vector(0)) == 0
          for: 2m
          labels: {severity: warning, component: dag-processor}
          annotations:
            summary: No dag-processor heartbeat for over two minutes; DAG changes are not parsed.
        - alert: AirflowTriggererDown
          expr: (sum(rate(airflow_triggerer_heartbeat[1m])) or vector(0)) == 0
          for: 2m
          labels: {severity: warning, component: triggerer}
          annotations:
            summary: No triggerer heartbeat for over two minutes; deferred tasks do not resume.
            runbook: docs/runbook.md#9-lose-a-triggerer-while-a-readiness-wait-is-deferred
        # Degraded HA (D31): one of several schedulers or triggerers is not heartbeating, so the role
        # still works but one more loss is an outage. The heartbeat counters above are summed over
        # every replica and cannot tell one of two from two, so these count live jobs in the metadata
        # DB (sql_exporter, `airflow_jobs_alive`) against the Deployment's desired replicas. A pod that
        # runs but hangs counts as lost here, while AirflowComponentUnavailable still sees it as
        # available. `> 0` leaves a total loss to the *Down alerts. 2m outlasts a rollout's gap
        # between an old pod leaving and its replacement's first heartbeat.
        - alert: AirflowSchedulerDegraded
          expr: |
            sum(airflow_jobs_alive{job_type="SchedulerJob"})
              < on () sum(kube_deployment_spec_replicas{namespace="airflow", deployment="airflow-scheduler"})
            and on () sum(airflow_jobs_alive{job_type="SchedulerJob"}) > 0
          for: 2m
          labels: {severity: warning, component: scheduler}
          annotations:
            summary: "Only {{ $value }} scheduler(s) heartbeating, fewer than desired; one more loss stops scheduling."
            runbook: docs/runbook.md#1-lose-a-scheduler
        - alert: AirflowTriggererDegraded
          expr: |
            sum(airflow_jobs_alive{job_type="TriggererJob"})
              < on () sum(kube_deployment_spec_replicas{namespace="airflow", deployment="airflow-triggerer"})
            and on () sum(airflow_jobs_alive{job_type="TriggererJob"}) > 0
          for: 2m
          labels: {severity: warning, component: triggerer}
          annotations:
            summary: "Only {{ $value }} triggerer(s) heartbeating, fewer than desired; deferred tasks of a lost one wait for reassignment."
            runbook: docs/runbook.md#9-lose-a-triggerer-while-a-readiness-wait-is-deferred
        - alert: AirflowComponentUnavailable
          # StatefulSets too: the Celery broker (Redis) is one, and it was the only component unwatched.
          expr: |
            kube_deployment_status_replicas_available{namespace="airflow"}
              < kube_deployment_spec_replicas{namespace="airflow"}
            or
            kube_statefulset_status_replicas_ready{namespace="airflow"}
              < kube_statefulset_replicas{namespace="airflow"}
          for: 2m
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.deployment }}{{ $labels.statefulset }} has fewer available replicas than desired."
        - alert: AirflowRolloutStuck
          # A rollout whose new pods never become ready leaves the old ones serving, so availability
          # stays fine while the change silently never lands (seen on a helm rollback onto a newer
          # schema). Updated replicas cannot show it (a crash-looping new pod counts as updated);
          # a rollout that never finishes keeps more pods than the spec asks for.
          expr: |
            kube_deployment_status_replicas{namespace="airflow"}
              > kube_deployment_spec_replicas{namespace="airflow"}
          for: 3m
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.deployment }} has not finished rolling out for 3 minutes."
            runbook: docs/runbook.md#5-roll-the-chart-and-the-airflow-minor-version
        - alert: AirflowPodsPending
          expr: sum by (namespace) (kube_pod_status_phase{namespace=~"airflow|workloads", phase="Pending"}) > 0
          for: 2m
          labels: {severity: warning}
          annotations:
            summary: "Pods in {{ $labels.namespace }} have been Pending for over two minutes (no node fits, or a volume is pinned)."
        - alert: AirflowMetricsMissing
          expr: absent(up{namespace="airflow", service="airflow-statsd"} == 1)
          for: 2m
          labels: {severity: warning}
          annotations:
            summary: The Airflow statsd-exporter is not scraped; every Airflow alert is blind.
        - alert: AirflowJobsMetricsMissing
          # The sql_exporter answers but its query fails while the metadata DB is down (drill 3), so
          # this also fires then, next to MetadataDBDown.
          expr: absent(airflow_jobs_alive{job_type="SchedulerJob"})
          for: 2m
          labels: {severity: warning}
          annotations:
            summary: No live-job counts from the metadata DB (sql_exporter); the *Degraded alerts are blind.
        - alert: AirflowReadinessMetricsMissing
          expr: absent(up{instance="warehouse-sql-exporter:9399"} == 1)
          for: 2m
          labels: {severity: warning}
          annotations:
            summary: The warehouse's sql_exporter is not scraped; AirflowMetadataBehindWarehouse is blind.
    - name: airflow.platform
      rules:
        - alert: MetadataDBDown
          expr: (max(pg_up{database="metadata-db"}) or vector(0)) == 0
          for: 30s
          labels: {severity: critical}
          annotations:
            summary: The Airflow metadata DB (Cloud SQL stand-in) does not answer.
            runbook: docs/runbook.md#3-stop-the-metadata-db
        - alert: AirflowMetadataBehindWarehouse
          # A readiness row written by a DAG run the metadata DB has no record of: Airflow's history
          # is behind the warehouse, as after a metadata DB restore (D32). One alert per vanished run.
          # Guarded on the metadata DB's exporter answering (its live-job counts exist whenever its
          # queries succeed), so a metadata DB outage (drill 3) is left to MetadataDBDown; an empty
          # restored DB still fires. 2m outlasts the two exporters' scrapes of a brand-new run.
          expr: |
            count by (dag_id, run_id) (
              ops_readiness_updated_timestamp_seconds
                unless on (dag_id, run_id) airflow_dag_run_known
            )
            and on () count(airflow_jobs_alive) > 0
          for: 2m
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.dag_id }} run {{ $labels.run_id }} wrote {{ $value }} readiness row(s), but the metadata DB has no record of the run."
            runbook: docs/runbook.md#10-restore-the-metadata-db-to-an-earlier-point
        - alert: KubeNodeUnschedulable
          expr: max by (node) (kube_node_spec_unschedulable) == 1
          for: 30s
          labels: {severity: info}
          annotations:
            summary: "Node {{ $labels.node }} is cordoned (drain or maintenance)."
            runbook: docs/runbook.md#2-drain-a-node
        - alert: AirflowContainerOOMKilled
          expr: |
            max by (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{namespace="airflow", reason="OOMKilled"})
              and on (namespace, pod, container)
            increase(kube_pod_container_status_restarts_total{namespace="airflow"}[5m]) > 0
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.pod }}/{{ $labels.container }} was OOMKilled in the last 5 minutes."
            runbook: docs/runbook.md#4b-starve-a-worker-of-memory-oomkill
        - alert: AirflowMigrationJobFailed
          # The chart's migration Job uses restartPolicy OnFailure: a failing `airflow db migrate`
          # restarts in place and counts as a failed Job only after its backoff limit (minutes later),
          # so a still-active migration pod that has restarted is the early signal.
          expr: |
            (max by (pod) (kube_pod_container_status_restarts_total{namespace="airflow", pod=~".*-run-airflow-migrations-.*"}) > 0
              and on (pod) max by (pod) (kube_pod_status_phase{namespace="airflow", phase=~"Pending|Running"}) == 1)
            or on () max(kube_job_status_failed{namespace="airflow", job_name=~".*migrations.*"}) > 0
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: The Airflow DB migration Job failed; components wait for migrations forever.
            runbook: docs/runbook.md#5-roll-the-chart-and-the-airflow-minor-version
    - name: airflow.scaling
      rules:
        - alert: KedaScalerErrors
          # A failing scaler leaves the HPA on its last replica count (no scale-out, no scale-in), and
          # the HPA's ScalingActive condition flips back on every poll that succeeds, so it is a weak
          # signal. keda_scaled_object_errors_total counts every failed poll, including the ones
          # keda_scaler_detail_errors_total misses (a PgBouncer prepared-statement clash, issue #7).
          # A 1m window held for 2m ignores a one-off failure; the HPA polls every 15 s.
          expr: sum by (exported_namespace, scaledObject) (increase(keda_scaled_object_errors_total[1m])) > 0
          for: 2m
          labels: {severity: warning, component: keda}
          annotations:
            summary: "KEDA's scaler for {{ $labels.exported_namespace }}/{{ $labels.scaledObject }} keeps failing; the worker count is frozen."
            runbook: docs/runbook.md#7-break-the-keda-scaler
        - alert: KedaMetricsMissing
          expr: absent(up{namespace="keda", job="keda-operator"} == 1)
          for: 2m
          labels: {severity: warning, component: keda}
          annotations:
            summary: The KEDA operator is not scraped; a failing worker scaler would go unnoticed.
            runbook: docs/runbook.md#7-break-the-keda-scaler
    - name: airflow.work
      rules:
        - alert: AirflowPoolStarving
          expr: max by (pool_name) (airflow_pool_starving_tasks) > 0
          for: 1m
          labels: {severity: warning}
          annotations:
            summary: "Tasks are waiting for free slots in pool {{ $labels.pool_name }}."
            runbook: docs/runbook.md#4a-starve-the-workers-of-slots
        - alert: AirflowTasksQueuedTooLong
          expr: sum(airflow_executor_queued_tasks) > 0 and sum(airflow_executor_open_slots) == 0
          for: 2m
          labels: {severity: warning}
          annotations:
            summary: Tasks sit in the executor queue while no worker slot is free.
            runbook: docs/runbook.md#4a-starve-the-workers-of-slots
        - alert: AirflowTasksStuckQueued
          # A queued task instance was handed to Celery but no worker has started it. Seen when a Redis
          # restart drops the broker's messages (the scheduler requeues after task_queued_timeout, 600 s
          # plus its 120 s check) and when a worker that ran a task through that restart takes no new
          # one (runbook drill 8, issue #15);
          # also fires when demand outruns KEDA's maximum. A normal scale-out clears in under a minute.
          expr: sum(airflow_pool_queued_slots) > 0
          for: 3m
          labels: {severity: warning}
          annotations:
            summary: Task instances have sat in queued for 3 minutes; no worker is taking them.
            runbook: docs/runbook.md#8-restart-the-celery-broker
        - alert: AirflowImportErrors
          expr: max(airflow_dag_processing_import_errors) > 0
          for: 30s
          labels: {severity: warning}
          annotations:
            summary: DAG files fail to import; their DAGs are not updated (or disappear).
        - alert: AirflowTaskFailures
          expr: sum(increase(airflow_ti_failures[10m])) > 0
          labels: {severity: info}
          annotations:
            summary: Task instances failed in the last 10 minutes.
