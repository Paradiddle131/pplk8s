# What Prometheus scrapes besides the cluster itself (PLAN.md D21).
---
# Airflow's metrics: Airflow components push StatsD over UDP to the chart's statsd-exporter, which
# serves them as Prometheus metrics (InfluxDB-style tags become labels).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: airflow-statsd
  namespace: airflow
spec:
  selector:
    matchLabels: {tier: airflow, component: statsd}
  endpoints:
    - port: statsd-scrape
      interval: 15s
---
# PgBouncer's exporter sidecar: client waits and server connections in front of the metadata DB.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: airflow-pgbouncer
  namespace: airflow
spec:
  selector:
    matchLabels: {tier: airflow, component: pgbouncer}
  endpoints:
    - port: pgb-metrics
      interval: 15s
---
# git-sync's own counters (#18), from the sidecar in every pod that loads DAGs. The chart declares no
# container port for it, so Prometheus discovers one port-free target per container: keep the
# git-sync sidecar (not its init container) and address it on the chart's httpPort, 1234.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: airflow-git-sync
  namespace: airflow
spec:
  selector:
    matchExpressions:
      - {key: tier, operator: In, values: [airflow]}
      - {key: component, operator: In, values: [dag-processor, triggerer, worker]}
  podMetricsEndpoints:
    - interval: 15s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_container_name]
          regex: git-sync
          action: keep
        - sourceLabels: [__meta_kubernetes_pod_ip]
          regex: (.+)
          replacement: $1:1234
          targetLabel: __address__
        - sourceLabels: [__meta_kubernetes_pod_label_component]
          targetLabel: component
---
# The databases live in Compose, outside the cluster, like Cloud SQL and BigQuery; their exporters
# run next to them (platform/compose) and pods reach them by Compose name (D13).
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: compose-databases
  namespace: monitoring
spec:
  scrapeInterval: 15s
  staticConfigs:
    - targets: ["metadata-db-exporter:9187"]
      labels: {database: metadata-db}
    - targets: ["warehouse-exporter:9187"]
      labels: {database: warehouse}
    - targets: ["metadata-db-sql-exporter:9399"]
      labels: {database: metadata-db}
    - targets: ["warehouse-sql-exporter:9399"]
      labels: {database: warehouse}
---
# The KEDA operator's metrics: scaler errors and the value its worker query returns (D24). It lives
# here, not in the KEDA chart, so the scrape exists whichever of KEDA and this stack is deployed first.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: keda-operator
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [keda]
  selector:
    matchLabels: {app.kubernetes.io/name: keda-operator}
  endpoints:
    - port: metrics
      interval: 15s
