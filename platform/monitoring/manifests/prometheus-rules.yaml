# Replacements for kube-prometheus-stack default rules that the values disable (values.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lab-prometheus
  namespace: monitoring
spec:
  groups:
    - name: lab.prometheus
      rules:
        - alert: PrometheusRuleGroupOverrun
          # Replaces PrometheusMissingRuleEvaluations, which counts missed slots on the wall clock and
          # fires falsely on WSL2 (issue #5). A group misses slots when one evaluation runs longer
          # than its interval; durations are timed on the monotonic clock, so a clock step cannot
          # fake one.
          expr: |
            max_over_time(prometheus_rule_group_last_duration_seconds{job="kps-prometheus"}[5m])
              > prometheus_rule_group_interval_seconds{job="kps-prometheus"}
          labels: {severity: warning}
          annotations:
            summary: "Rule group {{ $labels.rule_group }} took longer than its interval; its evaluations are being skipped."
    - name: lab.kubernetes-apps
      rules:
        - alert: KubeJobFailed
          # Replaces the default KubeJobFailed, which fires for as long as a failed Job object exists.
          # A CronJob keeps its last failed Job (failedJobsHistoryLimit), so one failed run pinned the
          # alert until someone deleted the Job, even after later runs succeeded (issue #62). Here a
          # failed Job of a CronJob stops alerting once a run of that CronJob succeeds after it
          # started, including one started by hand (`kubectl create job --from=cronjob/...`).
          # Other failed Jobs alert as before.
          expr: |
            kube_job_failed{job="kube-state-metrics"} > 0
            unless on (namespace, job_name)
            (
              max by (namespace, job_name, cronjob) (
                label_replace(kube_job_owner{job="kube-state-metrics", owner_kind="CronJob"},
                              "cronjob", "$1", "owner_name", "(.+)")
              )
              * on (namespace, cronjob) group_left
              max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{job="kube-state-metrics"})
              > on (namespace, job_name)
              max by (namespace, job_name) (kube_job_status_start_time{job="kube-state-metrics"})
            )
          for: 15m
          labels: {severity: warning}
          annotations:
            description: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed to complete, and no later run of its CronJob has succeeded. Removing the failed Job after investigation clears the alert."
            summary: Job failed to complete.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubejobfailed
    - name: lab.kube-apiserver-slos
      # The chart's kube-apiserver-slos group (values.yaml) without its 3d/6h pair, which fires on
      # WSL2's virtual-disk flush stalls (issue #25). Expressions and labels as chart 92.3.0 ships them.
      rules:
        - alert: KubeAPIErrorBudgetBurn
          expr: |
            sum by (cluster) (apiserver_request:burnrate1h) > (14.40 * 0.01000)
            and on (cluster)
            sum by (cluster) (apiserver_request:burnrate5m) > (14.40 * 0.01000)
          for: 2m
          labels: {long: 1h, short: 5m, severity: critical}
          annotations: &apiserver-slo
            description: The Kube API server is burning too much error budget on cluster {{ $labels.cluster }}.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeapierrorbudgetburn
            summary: The Kube API server is burning too much error budget.
        - alert: KubeAPIErrorBudgetBurn
          expr: |
            sum by (cluster) (apiserver_request:burnrate6h) > (6.00 * 0.01000)
            and on (cluster)
            sum by (cluster) (apiserver_request:burnrate30m) > (6.00 * 0.01000)
          for: 15m
          labels: {long: 6h, short: 30m, severity: critical}
          annotations: *apiserver-slo
        - alert: KubeAPIErrorBudgetBurn
          expr: |
            sum by (cluster) (apiserver_request:burnrate1d) > (3.00 * 0.01000)
            and on (cluster)
            sum by (cluster) (apiserver_request:burnrate2h) > (3.00 * 0.01000)
          for: 1h
          labels: {long: 1d, short: 2h, severity: warning}
          annotations: *apiserver-slo
