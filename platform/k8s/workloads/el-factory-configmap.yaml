# Non-secret configuration, injected as environment variables via envFrom.
apiVersion: v1
kind: ConfigMap
metadata:
  name: el-factory-config
data:
  # fake-gcs by its Compose name (PLAN.md D13); it advertises http://gcs:4443 for resumable uploads.
  STORAGE_EMULATOR_HOST: http://gcs:4443
  GCS_BUCKET: staging
  PAGE_SIZE: "100" # ConfigMap values are strings, so numbers are quoted.
  FAIL_RATE: "0" # raise above 0 to rehearse Airflow retries
  # Seconds each /extract request works before answering next_url (PLAN.md D34); at most half the
  # hook's 120 s read timeout (airflow/tests/test_el_factory.py), since a request overruns by a page.
  MAX_RUN_TIME: "45"
