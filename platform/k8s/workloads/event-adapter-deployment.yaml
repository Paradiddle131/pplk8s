apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-adapter
  labels:
    app.kubernetes.io/name: event-adapter
spec:
  # One replica is enough: Pub/Sub holds the backlog while the pod restarts, and a second
  # subscriber would only add redeliveries, which the deterministic run id absorbs anyway (D18).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: event-adapter
  strategy:
    type: Recreate # never two subscribers during a rollout; the backlog waits in the subscription
  template:
    metadata:
      labels:
        app.kubernetes.io/name: event-adapter
    spec:
      serviceAccountName: event-adapter
      automountServiceAccountToken: false # it talks to Pub/Sub and Airflow, never to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: event-adapter
          image: event-adapter # a placeholder; workloads-up.sh sets the real reference from ADAPTER_IMAGE (D16)
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: event-adapter-config
            - secretRef:
                name: event-adapter-airflow # AIRFLOW_USERNAME, AIRFLOW_PASSWORD
          env:
            - name: ROUTES_PATH
              value: /etc/event-adapter/routes.yaml
          livenessProbe: # 503 once the streaming pull has stopped; the restart resubscribes
            httpGet: {path: /healthz, port: health}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: routes
              mountPath: /etc/event-adapter
              readOnly: true
      volumes:
        - name: routes
          configMap:
            name: event-adapter-config
            items:
              - key: routes.yaml
                path: routes.yaml
