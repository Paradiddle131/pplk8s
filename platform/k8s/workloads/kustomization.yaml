# Everything in the workloads namespace: the Cloud Run stand-ins (EL Factory, dbt, the semantic agent) and the Eventarc stand-in (event adapter).
# Apply through workloads-up.sh, never `kubectl apply -k` here: the Deployments and the CronJob name placeholder images
# (el-factory, event-adapter, semantic-agent, dbt) that its overlay maps to ELF_IMAGE, ADAPTER_IMAGE, AGENT_IMAGE and
# DBT_IMAGE from the Makefile (D16).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Sets metadata.namespace on every namespaced object below, so the manifests stay namespace-free.
namespace: workloads

resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - el-factory-configmap.yaml
  - el-factory-deployment.yaml
  - el-factory-service.yaml
  - event-adapter-configmap.yaml
  - event-adapter-deployment.yaml
  - semantic-agent-configmap.yaml
  - semantic-agent-deployment.yaml
  - semantic-agent-service.yaml
  - source-freshness-cronjob.yaml

secretGenerator:
  - name: warehouse-credentials
    # KEY=value lines; written by workloads-up.sh from WAREHOUSE_PASSWORD (default: the Compose default) and git-ignored.
    envs:
      - warehouse.secret.env
  - name: event-adapter-airflow
    # The Airflow API login the adapter triggers runs with; written by workloads-up.sh and git-ignored.
    envs:
      - airflow-api.secret.env
  - name: semantic-agent-credentials
    # The agents' read-only warehouse roles, the session store and the model key; written by workloads-up.sh and git-ignored.
    envs:
      - semantic-agent.secret.env

generatorOptions:
  # Keep the name fixed: Phase 4's KubernetesPodOperator references `warehouse-credentials` literally.
  # The trade-off: editing the Secret does not roll pods by itself; restart the Deployment after a change.
  disableNameSuffixHash: true
