# One identity per workload, so RBAC can be granted to each separately later (Workload Identity on GKE).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: el-factory
# No workload calls the Kubernetes API, so do not mount a token they could leak.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dbt
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-adapter
automountServiceAccountToken: false
