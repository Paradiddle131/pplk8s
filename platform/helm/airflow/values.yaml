# Values for the official apache-airflow/airflow chart, pinned to 1.22.0 in deploy.sh (PLAN.md D2).
# Secrets are not here: deploy.sh generates them once into Kubernetes Secrets
# (airflow-metadata, airflow-fernet-key, airflow-api-secret, airflow-jwt-secret,
# airflow-connections) and the values below only reference them by name.

# The chart 1.22 ships appVersion 3.2.2; render Airflow 3 resources for our 3.3.1 image (D1).
airflowVersion: 3.3.1

# Our custom image from airflow/Dockerfile (providers + include/), pulled from the
# local registry that kind nodes reach at localhost:5001 (D4). deploy.sh overrides
# the tag with --set images.airflow.tag so the Makefile's AIRFLOW_IMAGE stays the one source.
images:
  airflow:
    repository: localhost:5001/airflow
    tag: 3.3.1-pplk8s.9 # keep in step with AIRFLOW_IMAGE in the Makefile; bump on every image change, nodes cache by tag
    pullPolicy: IfNotPresent

# CeleryExecutor with the chart's bundled Redis as broker (D5).
executor: CeleryExecutor

# Pods find Services by DNS; skip the legacy per-Service env vars (chart 2.0 default).
enableServiceLinks: false

# Metadata DB (D6): an external Postgres in Compose, never the chart's subchart.
postgresql:
  enabled: false
data:
  # Secret `airflow-metadata` (key `connection`) is created by deploy.sh. Because PgBouncer is on,
  # its URL points at the PgBouncer service (airflow-pgbouncer:6543, database `airflow-metadata`),
  # not at Postgres; the chart would build that URL itself only when it owns the secret.
  metadataSecretName: airflow-metadata
  # What PgBouncer itself connects to. The password is passed by deploy.sh (--set), not stored here.
  metadataConnection:
    user: airflow
    protocol: postgresql
    host: metadata-db # Compose service name, resolvable from pods because kind nodes join the network (D13)
    port: 5432
    db: airflow
    sslmode: disable # the Compose Postgres has no TLS

pgbouncer:
  enabled: true
  # The Compose Postgres is not TLS-enabled; the chart default `prefer` falls back anyway,
  # `disable` skips the failed TLS probe on every connection.
  sslmode: disable
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}

# Keys from Kubernetes Secrets so `helm upgrade` never rotates them (a rotating JWT secret
# breaks running tasks during component rollouts).
fernetKeySecretName: airflow-fernet-key
apiSecretKeySecretName: airflow-api-secret
jwtSecretName: airflow-jwt-secret

# Airflow connections for Phase 4, injected as AIRFLOW_CONN_* env vars into every component.
extraEnvFrom: |
  - secretRef:
      name: airflow-connections

# DAG delivery (D10): the repo's airflow/dags, mounted into the kind workers at
# /mnt/pplk8s/dags and exposed as a hostPath PV + PVC (airflow-dags, created by deploy.sh).
dags:
  persistence:
    enabled: true
    existingClaim: airflow-dags
  gitSync:
    enabled: false # git-sync arrives in Phase 6
    recommendedProbeSetting: true # silences the chart's deprecation of the old probe behaviour

# Task logs (D22): written locally while a task runs (the api-server streams them from the worker's
# log server), then uploaded to gs://airflow-logs on fake-gcs, where the api-server reads finished
# logs. Composer keeps task logs in its environment bucket the same way. No log volumes anywhere.
logs:
  persistence:
    enabled: false

config:
  logging:
    remote_logging: "True"
    remote_base_log_folder: gs://airflow-logs
    # Connection AIRFLOW_CONN_GCS_LOGS (deploy.sh): anonymous credentials for the emulator.
    remote_log_conn_id: gcs_logs
    # Emulator-only shim: fake-gcs words a missing object differently from GCS, which made the
    # provider refuse every first upload (see the module's docstring). Drop this line on real GCS.
    logging_config_class: pplk8s.emulator_logging.LOGGING_CONFIG
  metrics:
    # D21: Airflow 3.3 emits pool, ti.<state> and task.duration metrics with tags only; the InfluxDB
    # form (`name,tag=value`) carries them to the statsd-exporter, which turns them into labels.
    # job_id and run_id stay blocked (statsd_disabled_tags default) to bound label cardinality.
    statsd_influxdb_enabled: "True"

# Every Airflow container talks to fake-gcs for the task logs above; the google-cloud-storage
# client switches to the emulator (and anonymous access) when this is set. Never in real manifests.
env:
  - name: STORAGE_EMULATOR_HOST
    value: http://gcs:4443

# Airflow 3 splits the old webserver into api-server (UI + REST + execution API) and a standalone
# dag-processor; both are first-class chart components.
apiServer:
  replicas: 1
  resources:
    requests: {cpu: 200m, memory: 768Mi}
    limits: {memory: 1536Mi}
dagProcessor:
  enabled: true
  replicas: 1
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {memory: 1Gi}
scheduler:
  replicas: 1
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {memory: 1Gi}
triggerer:
  enabled: true
  replicas: 1
  # The AssetWatcher spike (D17) pulls from the Pub/Sub emulator inside the triggerer; the client
  # library switches to the emulator when this is set.
  env:
    - name: PUBSUB_EMULATOR_HOST
      value: pubsub:8085
  persistence:
    enabled: false # triggerer logs are not needed on disk
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 768Mi}
workers:
  # No log volume (D22): workers are a Deployment that reschedules onto any node and can be scaled in
  # without losing logs. A Deployment pod's name does not resolve in DNS, so workers report their pod
  # IP as hostname; the api-server reaches a running task's live log at <hostname>:8793.
  persistence:
    enabled: false
  env:
    - name: AIRFLOW__CORE__HOSTNAME_CALLABLE
      value: airflow.utils.net.get_host_ip_address
  celery:
    # The chart default of 600 s lets a stuck pod stall a rollout for 10 minutes; tasks here are short.
    terminationGracePeriodSeconds: 60
    replicas: 2
    resources:
      requests: {cpu: 300m, memory: 768Mi}
      limits: {memory: 1536Mi}
redis:
  persistence:
    enabled: false # the broker holds only in-flight task messages; losing it on restart is acceptable for the lab
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}

# Metrics (D21): Airflow components push StatsD to this exporter, which Prometheus scrapes
# (ServiceMonitor in platform/monitoring/manifests). The chart's built-in mappings target Airflow 2's
# dotted names and do not match 3.3's tagged metrics, so they are replaced: everything keeps the
# exporter's default name (dots -> underscores, tags -> labels); only timers get explicit histograms
# so dashboards can aggregate quantiles across tasks.
# The exporter keeps every series until it expires: without a TTL a replaced pod's gauges (one
# triggers_running series per triggerer pod name) are summed forever. 5 minutes outlives any normal
# emit interval; the duration histograms keep an hour so dashboard quantile windows stay filled.
statsd:
  enabled: true
  cache:
    ttl: 5m
  overrideMappings:
    - match: airflow.task.duration
      name: airflow_task_duration_seconds
      ttl: 1h
      observer_type: histogram
      histogram_options:
        buckets: [0.5, 1, 2, 5, 10, 20, 30, 60, 120, 300, 600, 1800]
    - match: airflow.dagrun.duration.*
      name: airflow_dagrun_duration_seconds
      ttl: 1h
      observer_type: histogram
      histogram_options:
        buckets: [5, 10, 30, 60, 120, 300, 600, 1200, 1800, 3600]
      labels:
        state: "$1"
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 128Mi}
flower:
  enabled: false

# The chart's one-shot Jobs. Helm hooks are off: with `--wait`, Helm waits for the pods to be
# Ready before it runs post-install hooks, while the pods' wait-for-airflow-migrations init
# container waits for the migration hook, which is a deadlock (observed). As plain resources the
# Jobs run alongside the Deployments, which wait for `airflow db migrate` to finish.
# Jobs are immutable, so deploy.sh deletes finished ones before each upgrade.
migrateDatabaseJob:
  enabled: true
  useHelmHooks: false
  resources:
    requests: {cpu: 100m, memory: 256Mi}
createUserJob:
  # Creates the FAB auth-manager user admin/admin (chart default auth_manager is FabAuthManager).
  # Lab-only credentials; change before exposing anything beyond the localhost port-forward.
  useHelmHooks: false
  defaultUser:
    username: admin
    password: admin
    role: Admin
    email: admin@example.com
    firstName: admin
    lastName: user
