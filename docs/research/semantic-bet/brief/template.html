<title>Approaches</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
<style>
/* Enamel signage: a midnight band carries the title and the set switch; below it the approaches sit on one
   line, most native to most custom, each station showing its 100 answers. Every word is set in full ink. */
:root {
  --paper: #f4f6fa; --ink: #0d1b3e; --band: #0d1b3e; --band-ink: #f4f6fa; --band-line: rgba(244, 246, 250, .34);
  --rule: rgba(13, 27, 62, .16); --row: rgba(36, 71, 201, .05); --line: #2447c9;
  --ok: #0b7d4b; --warn: #b56f00; --bad: #cf2a1f;
  --tip: #0d1b3e; --tip-ink: #f4f6fa; --shadow: 0 6px 18px rgba(13, 27, 62, .22);
  --f: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px)); --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --route: 40px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0a1430; --ink: #edf1f8; --band: #1b3373; --band-ink: #f3f6fb; --band-line: rgba(243, 246, 251, .34);
  --rule: rgba(237, 241, 248, .2); --row: rgba(134, 164, 255, .08); --line: #86a4ff;
  --ok: #3fcf8e; --warn: #f2b23e; --bad: #ff6a5c;
  --tip: #edf1f8; --tip-ink: #0a1430; --shadow: 0 6px 18px rgba(0, 0, 0, .5); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0a1430; --ink: #edf1f8; --band: #1b3373; --band-ink: #f3f6fb; --band-line: rgba(243, 246, 251, .34);
  --rule: rgba(237, 241, 248, .2); --row: rgba(134, 164, 255, .08); --line: #86a4ff;
  --ok: #3fcf8e; --warn: #f2b23e; --bad: #ff6a5c;
  --tip: #edf1f8; --tip-ink: #0a1430; --shadow: 0 6px 18px rgba(0, 0, 0, .5); color-scheme: dark }

* { box-sizing: border-box }
html { scrollbar-color: var(--line) var(--paper); -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1rem/1.45 var(--f); font-variant-numeric: tabular-nums }
::selection { background: var(--line); color: var(--paper) }
:focus-visible { outline: 2.5px solid var(--line); outline-offset: 3px; border-radius: 6px }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }
.wrap { max-width: 80rem; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r) }

/* The band: the page's sign. Title left, the question-set switch right; the chosen set is a reversed plate. */
.band { background: var(--band); color: var(--band-ink) }
.band .wrap { display: flex; flex-wrap: wrap; gap: var(--s3) var(--s5); align-items: center; justify-content: space-between; padding-block: 20px }
.band :focus-visible { outline-color: var(--band-ink) }
h1 { margin: 0; font-size: 2rem; line-height: 1.1; font-weight: 700; letter-spacing: -0.015em }
.sets { display: inline-flex; padding: 3px; gap: 3px; border: 1px solid var(--band-line); border-radius: 10px }
.sets button { font: 600 1rem/1 var(--f); color: var(--band-ink); background: transparent; border: 0; border-radius: 7px;
  min-height: 40px; padding: 0 var(--s4); cursor: pointer; display: inline-flex; gap: var(--s2); align-items: center;
  transition: background-color .15s ease-out, color .15s ease-out }
.sets button b { font-weight: 700 }
.sets button:hover { background: var(--band-line) }
.sets button[aria-pressed="true"] { background: var(--band-ink); color: var(--band); cursor: default }

main { padding-block: var(--s5) var(--s7) }

/* The table. Two data sizes only: words at 1rem, numbers at 1.375rem; rank is carried by weight. */
table.approaches { width: 100%; border-collapse: collapse; table-layout: fixed }
table[hidden] { display: none !important }
thead th { font: 700 1rem/1.2 var(--f); text-align: left; padding: 0 0 var(--s2); border-bottom: 2px solid var(--ink); white-space: nowrap; vertical-align: bottom }
thead th.name-head { padding-left: var(--route) }
thead th.dots-head { width: 17.5rem; padding-left: var(--s4); padding-bottom: calc(var(--s2) + 6px) }
thead th.num { text-align: right; padding-left: var(--s5); white-space: normal; width: 7.5rem }
thead th.num button { display: inline-block; max-width: 7.25rem; text-align: right; line-height: 1.25; text-wrap: balance }
thead th.num button i { display: inline-block; margin-right: 6px; vertical-align: 0 }
thead th.num .sort { display: inline-block; margin-left: 6px; vertical-align: -1px }
thead button { font: inherit; color: inherit; background: none; border: 0; padding: 6px 0; min-height: 32px; cursor: pointer;
  display: inline-flex; gap: 7px; align-items: center; border-radius: 6px }
thead th.num button { margin-left: auto }
thead button:hover .label, thead button:hover { text-decoration: underline 2px; text-underline-offset: 5px }
.sort { width: 9px; height: 13px; flex: none }
th[aria-sort="descending"] .sort .up, th[aria-sort="ascending"] .sort .dn { display: none }
th[aria-sort="descending"] .sort, th[aria-sort="ascending"] .sort { stroke-width: 2.4 }
thead button i { width: 10px; height: 10px; flex: none }

tbody tr { border-bottom: 1px solid var(--rule) }
tbody tr:hover { background: var(--row) }
tbody th, tbody td { padding: 10px 0; vertical-align: middle }
tbody th { position: relative; text-align: left; font-weight: 600; padding-left: var(--route); padding-right: var(--s5) }
.cell { display: flex; gap: var(--s3); align-items: center; border-radius: 6px; cursor: help }
.icons { display: inline-flex; gap: 6px; flex: 0 0 4.75rem }
.logo { width: 20px; height: 20px; flex: none }
td.dots-cell { padding-left: var(--s4); padding-right: var(--s4); width: 1% }
td.num { text-align: right; font-size: 1.375rem; line-height: 1; font-weight: 700; padding-left: var(--s5); white-space: nowrap }

/* The route: a line threads every station in the native-to-custom order. Sorting by a number lifts it away. */
.stop { position: absolute; top: -1px; bottom: -1px; left: 12px; width: 14px }
.stop::before { content: ""; position: absolute; left: 5px; width: 4px; top: 0; bottom: 0; background: var(--line);
  transform-origin: 50% 0; transition: transform .24s cubic-bezier(.2, .8, .2, 1), opacity .24s ease-out }
.stop::after { content: ""; position: absolute; left: 0; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%;
  background: var(--paper); box-shadow: inset 0 0 0 3.5px var(--line) }
tbody tr:first-child .stop::before { top: 50% }
tbody tr:last-child .stop::before { bottom: 50% }
table[data-route="off"] .stop::before { transform: scaleY(0); opacity: 0 }

/* 100 answers, one mark each: filled circle right, ring couldn't answer, amber wrong, red diamond wrong and sure. */
.dots { display: grid; grid-template-columns: repeat(20, 9px); gap: 3px }
.dots i, thead i, td.num::before { display: block; width: 9px; height: 9px; border-radius: 50%; transition: opacity .2s ease-out }
.d-ok { background: var(--ok) }
.d-no { box-shadow: inset 0 0 0 1.6px var(--ink) }
.d-warn { background: var(--warn) }
.d-bad { background: var(--bad); border-radius: 1px !important; transform: rotate(45deg) scale(.84) }
/* Pointing at or sorting by an outcome lights its marks in every row and steps the others back. */
table[data-lit="right"] .dots i:not(.d-ok),
table[data-lit="declined"] .dots i:not(.d-no),
table[data-lit="wrong"] .dots i:not(.d-warn),
table[data-lit="sure_wrong"] .dots i:not(.d-bad) { opacity: .14 }

/* The definition bubble: one reversed plate, placed by script inside the viewport. */
.tipbox { position: fixed; z-index: 10; max-width: min(20rem, calc(100vw - 32px)); padding: 10px 12px; border-radius: 8px;
  background: var(--tip); color: var(--tip-ink); font: 400 .9375rem/1.4 var(--f); box-shadow: var(--shadow); pointer-events: auto }
.tipbox[hidden] { display: none }

/* Narrow: each approach stacks; the header becomes the sort bar and each number wears its outcome's mark. */
@media (max-width: 75rem) {
  table.approaches, thead, tbody, thead tr, th, td { display: block }
  table.approaches { max-width: 40rem }
  thead tr { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--s4); padding-bottom: var(--s1); border-bottom: 2px solid var(--ink) }
  thead th { border: 0; padding: 0 } thead th.name-head { grid-column: 1 / -1; padding-left: 0 } thead th.dots-head { display: none }
  thead th.num { padding-left: 0; text-align: left; width: auto } thead th.num button { max-width: none; text-align: left; padding-block: 12px }
  thead th.num button { margin-left: 0 }
  thead button { min-height: 44px }
  tbody tr { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s3) var(--s3);
    padding: var(--s4) 0 var(--s4) var(--route) }
  tbody th { position: static; grid-column: 1 / -1; min-width: 0; padding: 0 }
  tbody th, tbody td { padding: 0 }
  .icons { flex-basis: auto }
  td.dots-cell { grid-column: 1 / -1; width: auto; padding: 0 }
  .dots { grid-template-columns: repeat(20, minmax(0, 11px)) } .dots i { width: 100%; height: auto; aspect-ratio: 1 }
  td.num { width: auto; text-align: left; padding: 0; display: flex; gap: var(--s2); align-items: center }
  td.num::before { content: ""; flex: none }
  td.k-right::before { background: var(--ok) } td.k-declined::before { box-shadow: inset 0 0 0 1.6px var(--ink) }
  td.k-wrong::before { background: var(--warn) } td.k-sure_wrong::before { background: var(--bad); border-radius: 1px; transform: rotate(45deg) scale(.84) }
  .stop::after { top: calc(var(--s4) + 12px) }
  tbody tr:first-child .stop::before { top: calc(var(--s4) + 12px) }
  tbody tr:last-child .stop::before { bottom: auto; height: calc(var(--s4) + 13px) }
}
@media (prefers-reduced-motion: reduce) { .dots i, .stop::before, .sets button { transition: none } }
</style>

<header class="band">
  <div class="wrap">
    <h1>Approaches</h1>
    <div class="sets" role="group" aria-label="Question set">@@TOGGLE@@</div>
  </div>
</header>
<main class="wrap">@@TABLES@@</main>
<div class="tipbox" id="tipbox" aria-hidden="true" hidden></div>

<script>
(() => {
  const tables = [...document.querySelectorAll("table.approaches")];
  const motion = !matchMedia("(prefers-reduced-motion: reduce)").matches;
  let sortKey = "rank", sortDir = "ascending", lit = null;

  const value = (tr, key) => Number(tr.dataset[key === "sure_wrong" ? "sureWrong" : key]);
  function apply(animate) {
    for (const table of tables) {
      const body = table.tBodies[0];
      const rows = [...body.rows];
      const before = animate && motion && !table.hidden ? new Map(rows.map(r => [r, r.getBoundingClientRect().top])) : null;
      rows.sort((a, b) => {
        const d = sortDir === "ascending" ? value(a, sortKey) - value(b, sortKey) : value(b, sortKey) - value(a, sortKey);
        return d || value(a, "rank") - value(b, "rank");
      }).forEach(r => body.appendChild(r));
      for (const th of table.tHead.rows[0].cells) {
        if (th.dataset.key) th.setAttribute("aria-sort", th.dataset.key === sortKey ? sortDir : "none");
      }
      table.dataset.route = sortKey === "rank" ? "on" : "off";
      table.dataset.lit = lit || (sortKey === "rank" ? "" : sortKey);
      if (before) {
        const after = rows.map(r => r.getBoundingClientRect().top);
        rows.forEach((r, i) => {
          const dy = before.get(r) - after[i];
          if (dy) r.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 240, easing: "cubic-bezier(.2,.8,.2,1)" });
        });
      }
    }
  }

  for (const btn of document.querySelectorAll("thead button")) {
    const k = btn.dataset.key;
    btn.addEventListener("click", () => {
      if (k === "rank") { sortKey = "rank"; sortDir = "ascending"; }
      else if (sortKey === k) sortDir = sortDir === "descending" ? "ascending" : "descending";
      else { sortKey = k; sortDir = "descending"; }
      apply(true);
    });
    if (k !== "rank") {
      const on = () => { lit = k; apply(false); };
      const off = () => { lit = null; apply(false); };
      btn.addEventListener("pointerenter", on); btn.addEventListener("pointerleave", off);
      btn.addEventListener("focus", on); btn.addEventListener("blur", off);
    }
  }

  const sets = [...document.querySelectorAll(".sets button")];
  for (const btn of sets) {
    btn.addEventListener("click", () => {
      for (const b of sets) b.setAttribute("aria-pressed", String(b === btn));
      for (const t of tables) {
        const show = t.dataset.set === btn.dataset.set;
        if (show && t.hidden && motion) requestAnimationFrame(() => t.tBodies[0].animate([{ opacity: .35 }, { opacity: 1 }], { duration: 180, easing: "ease-out" }));
        t.hidden = !show;
      }
      apply(false);
    });
  }

  // Definitions on hover or focus: one bubble, kept inside the viewport, hoverable, dismissed with Escape.
  const box = document.getElementById("tipbox");
  let owner = null, hideTimer = 0, touched = false;
  addEventListener("pointerdown", e => { touched = e.pointerType === "touch"; }, { capture: true, passive: true });
  function show(el) {
    clearTimeout(hideTimer);
    owner = el; box.textContent = el.dataset.tip; box.hidden = false;
    const r = el.getBoundingClientRect(), b = box.getBoundingClientRect(), vw = document.documentElement.clientWidth;
    const left = Math.min(Math.max(16, r.left), vw - 16 - b.width);
    const below = r.bottom + 8 + b.height <= innerHeight - 8;
    box.style.left = left + "px";
    box.style.top = (below ? r.bottom + 8 : Math.max(8, r.top - 8 - b.height)) + "px";
  }
  function hide(now) {
    clearTimeout(hideTimer);
    const go = () => { box.hidden = true; owner = null; };
    if (now) go(); else hideTimer = setTimeout(go, 120);
  }
  for (const el of document.querySelectorAll("[data-tip]")) {
    el.addEventListener("pointerenter", e => { if (e.pointerType !== "touch") show(el); });
    el.addEventListener("pointerleave", () => hide(false));
    // A tap gives no hover: show the definition for a moment, then let the content underneath back.
    el.addEventListener("focus", () => { show(el); if (touched) hideTimer = setTimeout(() => hide(true), 2600); });
    el.addEventListener("blur", () => hide(true));
  }
  box.addEventListener("pointerenter", () => clearTimeout(hideTimer));
  box.addEventListener("pointerleave", () => hide(false));
  addEventListener("keydown", e => { if (e.key === "Escape" && owner) hide(true); });
  addEventListener("scroll", () => { if (owner) hide(true); }, { passive: true });
})();
</script>
