<style>
/* ---------- the Question sets tab on report-kit ----------
   Two kit sections: the sets, one part each (its name, its count in the number size, what it holds, its questions per
   group on the kit's bars as shares of the set), then the guide, the kit's split: the kinds of question in a side
   column on the raised surface (folding behind the kit's fold on a phone) beside a stage that steps through one real
   question at a time (the kit's step row, then the question as a part). Every word in the kit's family at 1rem in full
   ink; numbers bold; outcomes as the kit's status marks, as the Every run tab draws them. The tab maps the report's
   paler inks and rules onto the kit's (.qs beside .mfa, .er and .st in the template). */
.qs .rk-head h2 { line-height: 1.4 }
.qs .qs-lede { max-width: 40rem; margin: 0 0 var(--s5); text-wrap: pretty }
.qs button { font: inherit; color: inherit }
.qs .id { font-family: var(--code); font-size: .9375rem; font-weight: 600; color: var(--ink) }
.qs :is(button, .term, [tabindex]):focus-visible { outline: 2.5px solid var(--line); outline-offset: 2px; border-radius: 4px }

/* the sets: one part each, side by side; wide, their rows line up across the parts */
.qs .qs-set h3 { margin: 0 0 6px }
.qs .qs-n { margin: 0 0 var(--s2); font-variant-numeric: tabular-nums }
.qs .qs-n b { font: 700 var(--t-num)/1.1 var(--sans); margin-right: 4px }
.qs .qs-about { margin: 0 0 var(--s4); text-wrap: pretty }
.qs .qs-mix { display: grid; grid-template-columns: max-content minmax(4rem, 1fr); gap: var(--s1) var(--s3); align-items: center; align-content: start; margin: 0 }
.qs .qs-mix dd { margin: 0; min-width: 0 }
.qs .qs-mix .rk-bar { margin: 0; grid-template-columns: minmax(0, 1fr) 2.25rem }
.qs .qs-mix .rk-bar b { font-size: var(--t-word); font-variant-numeric: tabular-nums }
.qs .qs-mix .rk-track { height: 8px }
@media (min-width: 60rem) {
  .qs .qs-sets { grid-template-columns: repeat(auto-fit, minmax(0, 1fr)) }
  @supports (grid-template-rows: subgrid) { .qs .qs-set { display: grid; grid-row: span 4; grid-template-rows: subgrid; row-gap: 0; align-content: start } }
}

/* the guide: the kinds in the side column, rows of it; the chosen kind a reversed plate */
.qs .qs-nav { --aside: 16rem }
.qs .qs-list + .qs-list { margin-top: var(--s4) }
.qs .qs-list h3 { margin: 0 0 var(--s1); padding: 0 var(--s2) }
.qs .qs-list ul { list-style: none; margin: 0; padding: 0 }
.qs :is(.qs-cat, .qb-kind) { appearance: none; display: flex; justify-content: space-between; align-items: center; gap: var(--s3); width: 100%;
  min-height: 36px; padding: var(--s1) var(--s2); border: 0; border-radius: 4px; background: transparent; color: var(--ink);
  font: 400 var(--t-word)/1.3 var(--sans); text-align: left; cursor: pointer }
.qs :is(.qs-cat, .qb-kind) .c { font-weight: 700; font-variant-numeric: tabular-nums }
.qs :is(.qs-cat, .qb-kind):hover { background: var(--row) }
.qs .qs-cat[aria-pressed="true"], .qs .qb-kind[aria-current="true"] { background: var(--ink); color: var(--paper); font-weight: 700 }

.qs .qs-head h3 { margin: 0 }
.qs .qs-head h3:focus { outline: none }
.qs .qs-head h3:focus-visible { outline: 2.5px solid var(--line); outline-offset: 2px }
.qs .qs-head h3 .n { margin-left: var(--s3); font: 400 var(--t-word)/1.3 var(--sans); font-variant-numeric: tabular-nums; white-space: nowrap }
.qs .qs-def { margin: 6px 0 0; max-width: 40rem; text-wrap: pretty }
.qs .qs-step { margin: var(--s4) 0 var(--s4) }
.qs .rk-step-pos { font-variant-numeric: tabular-nums }
.qs .rk-step .qs-seeall:not([data-current]) { display: none }
.qs .qs-step + .qs-card { margin-top: 0 }

/* one question: its name, where it is asked, then its fields on hairlines; it takes its own height */
.qs .qs-card { container-type: inline-size }
.qs .qs-title { margin: 0 0 var(--s3) }
/* the question's name heads its part: a size step and two weight steps over its field labels (1rem, 600) */
.qs .qs-title .qs-name { margin: 0; font: var(--w-head) var(--t-find)/1.3 var(--sans) }
.qs .qs-name:focus { outline: none }
.qs .qs-in { margin: 2px 0 0 }
.qs .qs-dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0 var(--s5); margin: 0 }
.qs .qs-f { display: contents }
.qs .qs-dl dt { font-weight: 600; padding: var(--s3) 0 0; border-top: 1px solid var(--hair) }
.qs .qs-dl dd { margin: 0; min-width: 0; padding: var(--s3) 0; border-top: 1px solid var(--hair) }
@container (max-width: 34rem) {
  .qs .qs-dl { grid-template-columns: minmax(0, 1fr) }
  .qs .qs-dl dd { border-top: 0; padding-top: var(--s1) }
}
.qs .qs-turns { list-style: none; margin: 0; padding: 0 }
.qs .qs-turns > li + li { margin-top: var(--s3) }
.qs .qs-turns.conv > li { display: grid; grid-template-columns: 1.5rem minmax(0, 1fr) }
.qs .qs-turns.conv > li > .k { font-weight: 700; font-variant-numeric: tabular-nums }
.qs .qs-q { margin: 0; text-wrap: pretty }
.qs .qs-exp { margin: 2px 0 0 }
.qs .qs-exp b { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap }
.qs .qs-chips { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin: 0 }
.qs .qs-chips + .qs-chips { margin-top: var(--s2) }
.qs .qs-chips .by { margin: 0 var(--s3) 0 0 }
.qs .qs-chip { appearance: none; background: transparent; border: 1px solid var(--hair); border-radius: 6px; padding: 2px var(--s2); min-height: 32px;
  cursor: pointer; font: 400 var(--t-word)/1.3 var(--sans); color: var(--ink) }
.qs .qs-chip:hover { background: var(--row) }
.qs .qs-chip[aria-current="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 700 }
.qs .qs-note { margin: var(--s2) 0 0; max-width: 40rem }
.qs :is(.qs-plain, .qs-none) { margin: 0 }

/* how each setup did: one table, a row per setup on the model the figures read it on, its three runs the kit's marks */
.qs .qs-sum { margin: 0; font-variant-numeric: tabular-nums }
.qs .qs-sum b { font-weight: 700 }
.qs .qs-key { margin: var(--s2) 0 var(--s3) }
.qs .qs-key li > span { display: inline-flex; gap: var(--s2); align-items: center }
.qs .qs-rt { width: auto; min-width: min(100%, 30rem) }
.qs .qs-rt thead th { padding-right: var(--s5) }
.qs .qs-rt tbody :is(th, td) { padding: 6px var(--s5) 6px 0; line-height: 1.3 }
.qs .qs-rt tbody th { font-weight: 400 }
.qs .qs-rt .id { overflow-wrap: anywhere }
.qs .qs-rt .fam { display: inline-block; width: 3px; height: 14px; border-radius: 1px; margin-right: var(--s2); vertical-align: -2px }

/* ---------- the question browser: "See all N" opens the kit's dialog ----------
   A native <dialog class="qs qb rk-dialog"> inside the tab (so the kit's scope reaches it): the kit's head (the kind
   over the 2px ink rule, a close button beside it), then the kit's split: the list on the raised surface, with the
   switch of scope, a find box and its count, beside the chosen question under the kit's step row; a full-screen sheet
   with a list step and a question step on a phone. Its markup is made by the script below. */
html.qb-open { overflow: hidden }
.qs.qb.rk-dialog { width: min(76rem, calc(100vw - 48px)); height: min(54rem, calc(100dvh - 48px)); max-width: none; max-height: none;
  padding: var(--s4) var(--s5) 0; overflow: hidden }
.qb[open] { display: grid; grid-template-rows: auto auto minmax(0, 1fr) }
.qb .rk-dialog-top { margin-bottom: var(--s2) }
.qb .qb-def { margin: 0 0 var(--s4); max-width: 46rem; text-wrap: pretty }
/* the page's one tooltip moves in here while the dialog is open (the rest of the page is inert);
   the host sits at the page's origin, so a pinned tooltip's page coordinates land where they should */
.qb-tiphost { position: fixed; left: 0; top: 0; width: 100vw; height: 0; overflow: visible; z-index: 30; pointer-events: none }
.qb .qb-body { display: grid; grid-template-columns: 22rem minmax(0, 1fr); gap: 0 var(--s6); min-height: 0 }
.qb .qb-side.rk-aside { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; padding: 0; border-radius: 4px 4px 0 0 }
.qb .qb-main { min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 4px var(--s5) }
.qb .qb-tools { padding: var(--s3) var(--s3) var(--s2) }
.qb .qb-scope { display: flex; width: 100% }
.qb .qb-scope button { flex: 1 1 0; flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; padding: 4px var(--s3); line-height: 1.25; text-align: left }
.qb .qb-scope button .c { font-weight: 400; font-variant-numeric: tabular-nums }
.qb .qb-findl { display: block; margin: var(--s3) 0 var(--s1); font-weight: 600 }
.qb .qb-row { display: flex; align-items: stretch; gap: var(--s2) }
.qb .qb-find { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: var(--s2); border: 1px solid var(--ink); border-radius: 8px;
  background: var(--paper); padding: 0 var(--s2); min-height: 44px; color: var(--ink) }
.qb .qb-find:focus-within { outline: 2.5px solid var(--line); outline-offset: 2px }
.qb .qb-find input { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 400 var(--t-word)/1.3 var(--sans); padding: 8px 0; outline: none }
.qb .qb-find svg { flex: none }
.qb :is(.qb-kbtn, .qb-empty button) { appearance: none; flex: none; border: 1px solid var(--hair); border-radius: 10px; background: transparent; color: var(--ink);
  font: 600 var(--t-word)/1.1 var(--sans); min-height: 44px; padding: 0 var(--s3); display: inline-flex; align-items: center; gap: var(--s2); cursor: pointer }
.qb :is(.qb-kbtn, .qb-empty button):hover { background: var(--row) }
.qb .qb-kbtn[aria-expanded="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink) }
.qb .qb-kbtn svg { transition: transform var(--t-fast) ease-out }
.qb .qb-kbtn[aria-expanded="true"] svg { transform: rotate(180deg) }
.qb .qb-count { margin: var(--s2) 0 0; font-variant-numeric: tabular-nums; min-height: 1.45em }
.qb .qb-count b { font-weight: 700 }

/* the list: scrolls inside its column, one row per question, its name and how it is first asked; the chosen one reversed */
.qb .qb-scroll { min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--s2) var(--s4) }
.qb .qb-list { list-style: none; margin: 0; padding: 0 }
.qb .qb-opt { padding: var(--s2); border-radius: 4px; cursor: pointer }
.qb .qb-opt + .qb-opt { margin-top: 2px }
.qb .qb-opt:hover { background: var(--row) }
.qb .qb-opt[aria-selected="true"] { background: var(--ink); color: var(--paper) }
.qb .qb-opt:focus { outline: none }
.qb .qb-opt:focus-visible { outline: 2.5px solid var(--line); outline-offset: 1px }
.qb .qb-on { display: block; font-weight: 700; line-height: 1.3 }
.qb .qb-ot { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; margin-top: 2px; line-height: 1.35 }
.qb .qb-opt mark { background: var(--row); color: inherit; font-weight: 700; text-decoration: underline 2px var(--line); text-underline-offset: 3px }
.qb .qb-opt[aria-selected="true"] mark { background: transparent; text-decoration-color: currentColor }
.qb .qb-empty { padding: var(--s3) var(--s2) }
.qb .qb-empty p { margin: 0 0 var(--s3) }
.qb .qb-empty .qb-acts { display: flex; flex-wrap: wrap; gap: var(--s2) }

/* another kind: the guide's three lists at once, in place of the list until one is picked */
.qb .qb-kinds { padding: 0 0 var(--s4) }
.qb .qb-kinds[hidden] { display: none }
.qb .qb-kinds h3 { margin: var(--s3) 0 var(--s1); padding: 0 var(--s2); font-size: var(--t-word); line-height: 1.3 }
.qb .qb-kinds ul { list-style: none; margin: 0; padding: 0 }
.qb .qb-side[data-kinds] .qb-scroll > .qb-list, .qb .qb-side[data-kinds] .qb-scroll > .qb-empty { display: none }

/* the chosen question: the kit's step row above it, then the guide's own card */
.qb .qb-step { position: sticky; top: 0; z-index: 1; background: var(--paper); margin: 0; padding: 0 0 var(--s3) }
.qs.qb .rk-step button.qb-back { display: none }
.qb .qs-card { margin: 0 }

@media (max-width: 900px) { .qb .qb-body { grid-template-columns: 18rem minmax(0, 1fr); gap: 0 var(--s5) } }

/* a phone: a full-screen sheet in two steps, the list, then the question with a way back to the list */
@media (max-width: 640px) {
  .qs.qb.rk-dialog { width: 100vw; height: 100dvh; border: 0; border-radius: 0; padding: var(--s3) var(--s4) 0 }
  .qb .qb-def { margin-bottom: var(--s3) }
  .qb .qb-body { grid-template-columns: minmax(0, 1fr) }
  .qb[data-pane="list"] .qb-main, .qb[data-pane="card"] .qb-side { display: none }
  .qs.qb .rk-step button.qb-back { display: inline-flex }
  .qb .qb-step .rk-step-pos { flex-basis: 100% }
}
@media (prefers-reduced-motion: reduce) { .qb .qb-kbtn svg { transition: none } }
</style>
<script>
/* ---------- the question sets part ---------- */
// One question at a time under the kit's step row: Previous and Next sit above it, so neither moves however tall the
// question is, and the question takes its own height (the kit's step standard: no field reserves the tallest content).
window.reportReady(function () {
  "use strict";
  const D = window.REPORT, G = D && D.questionGuide, root = document.getElementById("question-guide");
  if (!G || !root) return;
  const $ = (s) => root.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const TERM = {}; (D.terms || []).forEach((t) => (TERM[t.key] = t));
  const CAT = {}; G.cats.forEach((c) => (CAT[c.key] = c));
  Object.keys(G.q).forEach((id) => (G.q[id].id = id));
  const TK = (k) => { const t = (D.termAlias || {})[k] || String(k).replace(/_/g, "-"); return TERM[t] ? t : null; };
  const lowerSet = (s) => (G.setLabel[s] || s).replace(/^./, (c) => c.toLowerCase());
  const term = (key, text) => (TERM[key] ? `<span class="term" data-term="${esc(key)}" tabindex="0">${esc(text == null ? TERM[key].label : text)}</span>` : esc(text == null ? key : text));

  /* ---------- numbers ---------- */
  const fmt = (v) => { const d = Math.abs(v) >= 1 ? 2 : 3; return Number(v.toFixed(d)).toLocaleString("en-GB", { maximumFractionDigits: d }); };
  const RATE = /\b(share|rate|percent|percentage|grow|growth|abandonment|pacing|up on)\b|%/i;
  function forms(f, text) { // the accepted forms of one number: a rate's fraction and percentage read as one percentage
    if (f.length === 2 && Math.abs(f[1] - f[0] * 100) <= 1e-6 * Math.max(1, Math.abs(f[1])) && RATE.test(text)) return `<b>${fmt(f[1])}%</b>`;
    return f.map((x) => `<b>${fmt(x)}</b>`).join(" or ");
  }
  const and = (xs) => (xs.length < 2 ? xs.join("") : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1]);
  function expected(meanings, text) {
    if (!meanings || !meanings.length) return "No number expected for this turn";
    const parts = meanings.map((f) => forms(f, text));
    return (parts.length === 1 ? "Expected " : "Must carry ") + and(parts);
  }

  /* ---------- runs as the kit's status marks, as the Every run tab draws them ---------- */
  // right a green circle, declined an ink ring, wrong an amber square, confident-wrong a scarlet diamond, not run a dot
  const OUT = { "0": "right", "1": "declined", "2": "wrong", "4": "confident-wrong", ".": "not run" };
  const KIND = { "0": "ok", "1": "no", "2": "warn", "4": "bad", ".": "" };
  const mark = (ch) => `<i class="rk-mark"${KIND[ch] ? ` data-k="${KIND[ch]}"` : ""} aria-hidden="true"></i>`;
  const KEY = `<ul class="rk-key qs-key">${["0", "1", "2", "4", "."].map((ch) => `<li><span>${mark(ch)}${term(OUT[ch], OUT[ch].replace(/^./, (c) => c.toUpperCase()))}</span></li>`).join("")}</ul>`;
  const famC = (f) => `var(--${["da", "gt", "mf", "ref"].includes(f) ? f : "other"})`;
  // each setup once, on the row the figures read it on, in the cost ladder's order (cheapest first)
  const ladder = {}; (D.ladder || []).forEach((L, i) => L.arms.forEach((a, j) => (ladder[a] = i * 100 + j)));
  const rowsCache = {}, caseIx = {};
  function rowsOf(st) {
    if (!rowsCache[st]) {
      rowsCache[st] = (D.sets[st].rows || []).filter((r) => r.primary).sort((a, b) => (ladder[a.arm] ?? 9e3) - (ladder[b.arm] ?? 9e3) || a.arm.localeCompare(b.arm));
      caseIx[st] = new Map((D.sets[st].cases || []).map((c, i) => [c.id, i]));
    }
    return rowsCache[st];
  }
  function runsHTML(q) {
    if (!q.runs || !D.sets[q.runs]) {
      return `<p class="qs-plain">Asked in the ${esc(lowerSet(q.sets[0]))} only; <a href="#map-set-${esc(q.sets[0])}">its setups' numbers are in the decision map</a>.</p>`;
    }
    const rows = rowsOf(q.runs), ci = caseIx[q.runs].get(q.id);
    const cells = rows.map((r) => ({ r, u: (r.units || "").slice(ci * 3, ci * 3 + 3).padEnd(3, ".") }));
    const ran = cells.filter((c) => c.u !== "...");
    const allRight = ran.filter((c) => /^0+\.*$/.test(c.u.replace(/\./g, "")) && c.u.replace(/\./g, "").length).length;
    const cw = ran.filter((c) => c.u.includes("4")).length;
    // one table, never split side by side (the kit's long-table standard); columns take their width from their content
    const table = `<div class="rk-table-wrap"><table class="rk-table qs-rt"><caption class="rk-sr">Each setup's three runs on this question</caption>` +
      `<thead><tr><th scope="col">Setup</th><th scope="col">Model</th><th scope="col">Runs</th></tr></thead><tbody>${cells.map((c) =>
      `<tr><th scope="row"><span class="fam" style="background:${famC(c.r.family)}" aria-hidden="true"></span><span class="id" data-setup="${esc(c.r.arm)}">${esc(c.r.arm)}</span></th><td>${esc(c.r.modelLabel)}</td>` +
      `<td><span class="rk-marks" role="img" aria-label="${esc([...c.u].map((ch) => OUT[ch]).join(", "))}">${[...c.u].map(mark).join("")}</span></td></tr>`).join("")}</tbody></table></div>`;
    return `<p class="qs-sum">Right on every run: <b>${allRight}</b> of ${ran.length} setups · ${term("confident-wrong", "Confidently wrong")} at least once: <b>${cw}</b></p>` +
      KEY + table;
  }

  /* ---------- one question in the card ---------- */
  const chip = (key, cur) => `<button type="button" class="qs-chip" data-open="${esc(key)}" data-term="${esc(key)}"${key === cur ? ' aria-current="true"' : ""}>${esc(TERM[key] ? TERM[key].label : key)}</button>`;
  const chips = (keys, cur, by) => `<p class="qs-chips">${by ? `<span class="by">${esc(by)}</span>` : ""}${keys.map((k) => TK(k)).filter((k) => k && CAT[k]).map((k) => chip(k, cur)).join("")}</p>`;
  function groupsHTML(q, cur) {
    const sig = (st) => (q.groups[st] || []).slice().sort().join(",");
    if (q.sets.every((st) => sig(st) === sig(q.sets[0]))) return chips(q.groups[q.sets[0]] || [], cur);
    const by = `<p class="qs-chips">${q.sets.map((st) => (q.groups[st] || []).map((g) => TK(g)).filter((k) => k && CAT[k]).map((k) => chip(k, cur)).join("") + `<span class="by">in the ${esc(lowerSet(st))}</span>`).join("")}</p>`;
    const gs = q.sets.map((st) => q.groups[st] || []);
    const composable = gs.some((g) => g.includes("composable")) && gs.some((g) => g.includes("uncovered") && !g.includes("composable"));
    return by + `<p class="qs-note">${composable
      ? "Arithmetic over a few metric results answers it: a group the extended hard set has and the hard set does not."
      : "The two sets group this question differently."}</p>`;
  }
  const RENDER = {
    // the name carries the id its card is labelled by (the guide's card or the browser's), at its card's heading level
    // (data-hl: an h4 under the guide's kind, an h3 under the browser's h2), so the outline steps down one at a time
    title: (q, cur, card) => { const h = "h" + ((card && card.dataset.hl) || 4); return `<${h} class="qs-name"${card && card.id ? ` id="${esc(card.getAttribute("aria-labelledby"))}"` : ""}>${esc(q.name)}</${h}><p class="qs-in">In ${and(q.sets.map((s) => "the " + esc(lowerSet(s))))}</p>`; },
    asked: (q) => {
      const conv = q.turns.length > 1;
      return `<ol class="qs-turns${conv ? " conv" : ""}">${q.turns.map((t, i) => `<li>${conv ? `<span class="k" aria-hidden="true">${i + 1}</span>` : ""}<div><p class="qs-q">${esc(t)}</p><p class="qs-exp">${expected(q.expected[i], t + " " + q.turns[0])}</p></div></li>`).join("")}</ol>`;
    },
    groups: (q, cur) => groupsHTML(q, cur),
    hard: (q, cur) => (q.kinds.length || q.rubric.length) ? chips(q.kinds.concat(q.rubric), cur) : `<span class="qs-none">None listed</span>`,
    sql: (q) => q.naive ? `<p class="qs-plain">Gives another number than the right one</p>` : `<span class="qs-none">No known trap</span>`,
    runs: (q) => runsHTML(q),
  };
  const FIELDS = Object.keys(RENDER);
  function fill(card, q, cur) { FIELDS.forEach((f) => { const el = card.querySelector(`[data-field="${f}"]`); if (el) el.innerHTML = RENDER[f](q, cur, card); }); }
  /* ---------- state: the open kind and its example ---------- */
  const card = $("#qs-card"), head = $("#qs-cat-h"), def = $("#qs-def"), pos = $("#qs-pos"), cats = [...root.querySelectorAll(".qs-cat")];
  const prev = $('[data-step="-1"]'), next = $('[data-step="1"]');
