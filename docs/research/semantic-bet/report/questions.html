<style>
/* ---------- the question sets part (#390): set profiles, then a guide by kind of question ---------- */
.qs .qs-lede { max-width: 36rem; margin: 0 0 18px; text-wrap: pretty; }
.qs h3 { font-family: var(--serif); font-size: 1.12rem; font-weight: 600; line-height: 1.3; margin: 0 0 4px; }
.qs button { font: inherit; color: inherit; }
.qs .id { font-family: var(--code); font-size: 12.5px; letter-spacing: -.01em; color: var(--ink); }

/* the set profiles */
.qs .qs-sets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 32px; }
.qs .qs-set { border-top: 2px solid var(--ink); padding-top: 10px; min-width: 0; display: flex; flex-direction: column; }
/* the profiles share rows, so each set's count, groups and note line up across the three */
@supports (grid-template-rows: subgrid) { .qs .qs-set { display: grid; grid-row: span 6; grid-template-rows: subgrid; row-gap: 0; align-content: start; } }
.qs .qs-about { font-size: 14.5px; line-height: 1.45; color: var(--ink-2); margin: 0 0 10px; text-wrap: pretty; }
.qs .qs-n { font-family: var(--label); font-size: 14px; color: var(--ink-3); margin: 0 0 6px; padding-top: 8px; border-top: 1px solid var(--rule); }
.qs .qs-n b { font-size: 1.65rem; font-weight: 600; line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums; margin-right: 4px; }
.qs .qs-mix { align-content: start; display: grid; grid-template-columns: max-content minmax(48px, 1fr); gap: 3px 10px; align-items: center; font-family: var(--label); font-size: 13.5px; margin: 0; }
.qs .qs-mix dt { color: var(--ink); }
.qs .qs-mix dd { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr) 2.2em; gap: 8px; align-items: center; }
.qs .qs-mix .bar { height: 6px; background: var(--grid-major); border-radius: 1px; position: relative; }
.qs .qs-mix .bar i { position: absolute; inset: 0 auto 0 0; background: var(--ink-3); border-radius: 1px; }
.qs .qs-mix .c { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.qs .qs-mixnote { font-family: var(--label); font-size: 13px; color: var(--ink-3); margin: 4px 0 0; }
.qs .qs-where { font-family: var(--label); font-size: 13.5px; color: var(--ink-2); margin: 8px 0 0; padding-top: 6px; border-top: 1px solid var(--rule); }
.qs .qs-where a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--ink-3); text-underline-offset: 3px; }

/* the guide: three lists on the left, the chosen kind and one example on the right */
.qs .qs-gh { font-size: 1.3rem; margin: 44px 0 4px; }
.qs .qs-sub { font-size: 15.5px; color: var(--ink-2); max-width: 38rem; margin: 0 0 14px; text-wrap: pretty; }
.qs .qs-guide { display: grid; grid-template-columns: 14.5rem minmax(0, 1fr); gap: 0 32px; border-top: 1px solid var(--ink); padding-top: 12px; }
.qs .qs-nav { font-family: var(--label); min-width: 0; }
.qs .qs-list + .qs-list { margin-top: 16px; }
.qs .qs-list h4 { font-family: var(--label); font-size: 15px; font-weight: 600; color: var(--ink); margin: 0 0 4px; line-height: 1.3; }
.qs .qs-list ul { list-style: none; margin: 0; padding: 0; }
.qs .qs-cat { appearance: none; border: 0; background: transparent; display: flex; justify-content: space-between; align-items: center; gap: 10px; width: calc(100% + 12px); margin: 0 -6px; padding: 3px 6px; min-height: 30px; text-align: left; cursor: pointer; border-radius: 2px; font-family: var(--label); font-size: 14.5px; color: var(--ink); }
.qs .qs-cat .c { color: var(--ink-3); font-size: 13px; font-variant-numeric: tabular-nums; }
.qs .qs-cat:hover { background: var(--row-band); }
.qs .qs-cat[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.qs .qs-cat[aria-pressed="true"] .c { color: var(--paper); }
.qs .qs-cat:focus-visible { outline-offset: 1px; }
.qs .qs-panel { min-width: 0; }
.qs .qs-head h4 { display: inline-block; font-family: var(--serif); font-size: 1.16rem; font-weight: 600; line-height: 1.25; margin: 0; }
.qs .qs-head h4:focus { outline: none; }
.qs .qs-head h4:focus-visible { outline: 2px solid var(--mf); outline-offset: 2px; }
.qs .qs-head h4 .n { font-family: var(--label); font-size: 14px; font-weight: 400; color: var(--ink-3); margin-left: 10px; font-variant-numeric: tabular-nums; }
.qs .qs-def { font-size: 16px; line-height: 1.5; margin: 4px 0 0; max-width: 38rem; text-wrap: pretty; }
.qs .qs-step { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 12px 0 0; font-family: var(--label); font-size: 14px; color: var(--ink-2); }
.qs .qs-pos { font-variant-numeric: tabular-nums; min-width: 7.6em; text-align: center; }
.qs .qs-btn { appearance: none; border: 1px solid var(--ink-2); background: transparent; color: var(--ink); font-family: var(--label); font-size: 14px; padding: 3px 10px; border-radius: 3px; cursor: pointer; min-height: 32px; display: inline-flex; align-items: center; gap: 4px; }
.qs .qs-btn:hover { background: var(--row-band); }
.qs .qs-seeall-set { margin-left: auto; }
.qs .qs-seeall { appearance: none; border: 0; background: none; padding: 2px 0; min-height: 28px; cursor: pointer; font-family: var(--label); font-size: 14px; color: var(--ink); text-decoration: underline; text-decoration-color: var(--ink-3); text-underline-offset: 3px; }
.qs .qs-seeall[hidden] { display: none; }

/* one example: the same fields in the same places for every question; a field a question lacks stays empty */
.qs .qs-card { container-type: inline-size; border-top: 1px solid var(--ink-2); border-bottom: 1px solid var(--rule); background: var(--paper-2); padding: 12px 14px 14px; margin: 10px 0 0; }
.qs .qs-title { margin: 0 0 10px; }
.qs .qs-name { font-family: var(--serif); font-size: 1.04rem; font-weight: 600; line-height: 1.3; margin: 0; }
.qs .qs-in { font-family: var(--label); font-size: 13.5px; color: var(--ink-2); margin: 1px 0 0; }
.qs .qs-dl { display: grid; grid-template-columns: 7.6rem minmax(0, 1fr); gap: 0 16px; margin: 0; }
.qs .qs-dl > dt { font-family: var(--label); font-size: 13.5px; color: var(--ink-2); padding: 9px 0 0; border-top: 1px solid var(--rule); }
.qs .qs-dl > dd { margin: 0; min-width: 0; padding: 8px 0 8px; border-top: 1px solid var(--rule); }
.qs .qs-turns { list-style: none; margin: 0; padding: 0; }
.qs .qs-turns > li + li { margin-top: 8px; }
.qs .qs-turns.conv > li { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr); }
.qs .qs-turns.conv > li > .k { font-family: var(--label); font-size: 13px; color: var(--ink-3); padding-top: 2px; }
.qs .qs-q { font-family: var(--serif); font-size: 16px; line-height: 1.45; margin: 0; color: var(--ink); text-wrap: pretty; }
.qs .qs-exp { font-family: var(--label); font-size: 14px; color: var(--ink-2); margin: 2px 0 0; }
.qs .qs-exp b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.qs .qs-chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-family: var(--label); font-size: 13.5px; margin: 0; }
.qs .qs-chips + .qs-chips { margin-top: 5px; }
.qs .qs-chips .by { color: var(--ink-2); margin: 0 10px 0 1px; }
.qs .qs-chip { appearance: none; background: var(--paper); border: 1px solid var(--rule); border-radius: 2px; padding: 0 7px; line-height: 1.5; min-height: 26px; cursor: pointer; font-family: var(--label); font-size: 13.5px; color: var(--ink); }
.qs .qs-chip:hover { border-color: var(--ink-3); }
.qs .qs-chip[aria-current="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.qs .qs-note { font-family: var(--label); font-size: 13.5px; line-height: 1.45; color: var(--ink-2); margin: 6px 0 0; max-width: 40rem; }
.qs .qs-plain { font-family: var(--label); font-size: 14px; color: var(--ink); margin: 0; padding-top: 1px; }
.qs .qs-none { font-family: var(--label); font-size: 14px; color: var(--ink-3); }

/* how each setup did: one row per setup on the model the figures read it on, its three runs as the plate's squares */
.qs .qs-key { display: flex; flex-wrap: wrap; gap: 2px 14px; font-family: var(--label); font-size: 13px; color: var(--ink-2); margin: 0 0 6px; }
.qs .qs-key .k { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.qs .qs-sum { font-family: var(--label); font-size: 14px; color: var(--ink); margin: 0 0 6px; font-variant-numeric: tabular-nums; }
.qs .qs-sum b { font-weight: 600; }
.qs .qs-rts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 24px; }
@container (min-width: 600px) { .qs .qs-rts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.qs .qs-rt { border-collapse: collapse; width: 100%; table-layout: fixed; font-family: var(--label); font-size: 13.5px; }
.qs .qs-rt col.m { width: 8.6em; }
.qs .qs-rt col.r { width: 3.4em; }
/* one column of rows on a narrow card: the second table continues the first, under the same head */
@container (max-width: 599.98px) { .qs .qs-rt + .qs-rt thead { display: none; } }
.qs .qs-rt th { font-weight: 500; color: var(--ink-2); text-align: left; padding: 2px 6px 3px 0; border-bottom: 1px solid var(--rule); font-size: 13px; }
.qs .qs-rt td { padding: 2px 6px 2px 0; border-bottom: 1px dotted var(--grid-major); vertical-align: middle; line-height: 1.3; }
.qs .qs-rt td.s .id { font-size: 12px; overflow-wrap: anywhere; }
.qs .qs-rt td.m { color: var(--ink-2); }
.qs .qs-rt td.r, .qs .qs-rt th.r { padding-right: 0; white-space: nowrap; }
.qs .qs-rt .fam { display: inline-block; width: 9px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: 3px; }
.qs .qs-runs { display: inline-flex; gap: 1px; vertical-align: -2px; }
.qs .qs-runs svg, .qs .qs-key svg { display: block; }

@media (max-width: 760px) {
  .qs .qs-sets { grid-template-columns: minmax(0, 1fr); }
  .qs .qs-set { display: flex; }
  .qs .qs-guide { grid-template-columns: minmax(0, 1fr); }
  .qs .qs-list ul { display: flex; flex-wrap: wrap; gap: 5px; }
  .qs .qs-cat { width: auto; margin: 0; border: 1px solid var(--rule); padding: 2px 8px; gap: 6px; min-height: 32px; }
  .qs .qs-cat[aria-pressed="true"] { border-color: var(--ink); }
  .qs .qs-panel { margin-top: 18px; border-top: 1px solid var(--rule); padding-top: 12px; }
}
@media (max-width: 560px) {
  .qs .qs-dl { grid-template-columns: minmax(0, 1fr); }
  .qs .qs-dl > dt { padding: 8px 0 0; }
  .qs .qs-dl > dd { border-top: 0; padding-top: 3px; }
  .qs .qs-card { padding: 10px 12px 12px; }
  .qs .qs-step .qs-btn { flex: 1 1 0; justify-content: center; }
  .qs .qs-pos { flex: 1 1 auto; }
  .qs .qs-seeall-set { margin-left: 0; flex-basis: 100%; }
}
</style>
<script>
/* ---------- the question sets part (#390) ---------- */
// Every example renders into one card whose fields keep the same places and heights: the tallest content each
// field takes over every question is measured once per card width, and each field reserves that height.
window.reportReady(function () {
  "use strict";
  const D = window.REPORT, G = D && D.questionGuide, root = document.getElementById("question-guide");
  if (!G || !root) return;
  const $ = (s) => root.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const TERM = {}; (D.terms || []).forEach((t) => (TERM[t.key] = t));
  const CAT = {}; G.cats.forEach((c) => (CAT[c.key] = c));
  Object.keys(G.q).forEach((id) => (G.q[id].id = id));
  const TK = (k) => { const t = (D.termAlias || {})[k] || String(k).replace(/_/g, "-"); return TERM[t] ? t : null; };
  const lowerSet = (s) => (G.setLabel[s] || s).replace(/^./, (c) => c.toLowerCase());
  const term = (key, text) => (TERM[key] ? `<span class="term" data-term="${esc(key)}" tabindex="0">${esc(text == null ? TERM[key].label : text)}</span>` : esc(text == null ? key : text));

  /* ---------- numbers ---------- */
  const fmt = (v) => { const d = Math.abs(v) >= 1 ? 2 : 3; return Number(v.toFixed(d)).toLocaleString("en-GB", { maximumFractionDigits: d }); };
  const RATE = /\b(share|rate|percent|percentage|grow|growth|abandonment|pacing|up on)\b|%/i;
  function forms(f, text) { // the accepted forms of one number: a rate's fraction and percentage read as one percentage
    if (f.length === 2 && Math.abs(f[1] - f[0] * 100) <= 1e-6 * Math.max(1, Math.abs(f[1])) && RATE.test(text)) return `<b>${fmt(f[1])}%</b>`;
    return f.map((x) => `<b>${fmt(x)}</b>`).join(" or ");
  }
  const and = (xs) => (xs.length < 2 ? xs.join("") : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1]);
  function expected(meanings, text) {
    if (!meanings || !meanings.length) return "No number expected for this turn";
    const parts = meanings.map((f) => forms(f, text));
    return (parts.length === 1 ? "Expected " : "Must carry ") + and(parts);
  }

  /* ---------- the plate's run squares ---------- */
  const OUT = { "0": "right", "1": "declined", "2": "wrong", "3": "unclear", "4": "confident-wrong", ".": "not run" };
  function swatch(ch) {
    const b = ch === "." ? `<rect x="5" y="5" width="2" height="2" fill="var(--o-none)"/>` : ch === "0" ? `<rect x="2" y="2" width="8" height="8" fill="var(--o-right)"/>`
      : ch === "1" ? `<rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="var(--o-decl)"/>`
      : ch === "2" ? `<rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="var(--o-wrong)"/><rect x="2" y="6" width="8" height="4" fill="var(--o-wrong)"/>`
      : ch === "3" ? `<rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="var(--o-decl)"/><rect x="5.25" y="5.25" width="1.5" height="1.5" fill="var(--o-decl)"/>`
      : `<rect x="1.5" y="1.5" width="9" height="9" fill="var(--o-cw)"/>`;
    return `<svg width="14" height="14" viewBox="0 0 12 12" aria-hidden="true">${b}</svg>`;
  }
  const KEY = `<p class="qs-key">${["0", "1", "2", "3", "4", "."].map((ch) => `<span class="k">${swatch(ch)}${term(OUT[ch], OUT[ch])}</span>`).join("")}</p>`;
  const famC = (f) => `var(--${["da", "gt", "mf", "ref"].includes(f) ? f : "other"})`;
  // each setup once, on the row the figures read it on, in the cost ladder's order (cheapest first)
  const ladder = {}; (D.ladder || []).forEach((L, i) => L.arms.forEach((a, j) => (ladder[a] = i * 100 + j)));
  const rowsCache = {}, caseIx = {};
  function rowsOf(st) {
    if (!rowsCache[st]) {
      rowsCache[st] = (D.sets[st].rows || []).filter((r) => r.primary).sort((a, b) => (ladder[a.arm] ?? 9e3) - (ladder[b.arm] ?? 9e3) || a.arm.localeCompare(b.arm));
      caseIx[st] = new Map((D.sets[st].cases || []).map((c, i) => [c.id, i]));
    }
    return rowsCache[st];
  }
  function runsHTML(q) {
    if (!q.runs || !D.sets[q.runs]) {
      return `<p class="qs-plain">Asked in the ${esc(lowerSet(q.sets[0]))} only, which the figures do not draw; that set's totals per setup are in the appendix.</p>`;
    }
    const rows = rowsOf(q.runs), ci = caseIx[q.runs].get(q.id);
    const cells = rows.map((r) => ({ r, u: (r.units || "").slice(ci * 3, ci * 3 + 3).padEnd(3, ".") }));
    const ran = cells.filter((c) => c.u !== "...");
    const allRight = ran.filter((c) => /^0+\.*$/.test(c.u.replace(/\./g, "")) && c.u.replace(/\./g, "").length).length;
    const cw = ran.filter((c) => c.u.includes("4")).length;
    const half = Math.ceil(cells.length / 2);
    const table = (part) => `<table class="qs-rt"><colgroup><col><col class="m"><col class="r"></colgroup><thead><tr><th scope="col">Setup</th><th scope="col">Model</th><th scope="col" class="r">Runs</th></tr></thead><tbody>${part.map((c) =>
      `<tr><td class="s"><span class="fam" style="background:${famC(c.r.family)}" aria-hidden="true"></span><span class="id" data-setup="${esc(c.r.arm)}">${esc(c.r.arm)}</span></td><td class="m">${esc(c.r.modelLabel)}</td>` +
      `<td class="r"><span class="qs-runs" role="img" aria-label="${esc([...c.u].map((ch) => OUT[ch]).join(", "))}">${[...c.u].map(swatch).join("")}</span></td></tr>`).join("")}</tbody></table>`;
    return `<p class="qs-sum">Right on every run: <b>${allRight}</b> of ${ran.length} setups · ${term("confident-wrong", "Confidently wrong")} at least once: <b>${cw}</b></p>` +
      KEY + `<div class="qs-rts">${table(cells.slice(0, half))}${cells.length > half ? table(cells.slice(half)) : ""}</div>`;
  }

  /* ---------- one question in the card ---------- */
  const chip = (key, cur) => `<button type="button" class="qs-chip" data-open="${esc(key)}" data-term="${esc(key)}"${key === cur ? ' aria-current="true"' : ""}>${esc(TERM[key] ? TERM[key].label : key)}</button>`;
  const chips = (keys, cur, by) => `<p class="qs-chips">${by ? `<span class="by">${esc(by)}</span>` : ""}${keys.map((k) => TK(k)).filter((k) => k && CAT[k]).map((k) => chip(k, cur)).join("")}</p>`;
  function groupsHTML(q, cur) {
    const sig = (st) => (q.groups[st] || []).slice().sort().join(",");
    if (q.sets.every((st) => sig(st) === sig(q.sets[0]))) return chips(q.groups[q.sets[0]] || [], cur);
    const by = `<p class="qs-chips">${q.sets.map((st) => (q.groups[st] || []).map((g) => TK(g)).filter((k) => k && CAT[k]).map((k) => chip(k, cur)).join("") + `<span class="by">in the ${esc(lowerSet(st))}</span>`).join("")}</p>`;
    const gs = q.sets.map((st) => q.groups[st] || []);
    const composable = gs.some((g) => g.includes("composable")) && gs.some((g) => g.includes("uncovered") && !g.includes("composable"));
    return by + `<p class="qs-note">${composable
      ? "Arithmetic over a few metric results answers it: a group the extended hard set has and the hard set does not."
      : "The two sets group this question differently."}</p>`;
  }
  const RENDER = {
    title: (q) => `<h5 class="qs-name">${esc(q.name)}</h5><p class="qs-in">In ${and(q.sets.map((s) => "the " + esc(lowerSet(s))))}</p>`,
    asked: (q) => {
      const conv = q.turns.length > 1;
      return `<ol class="qs-turns${conv ? " conv" : ""}">${q.turns.map((t, i) => `<li>${conv ? `<span class="k" aria-hidden="true">${i + 1}</span>` : ""}<div><p class="qs-q">${esc(t)}</p><p class="qs-exp">${expected(q.expected[i], t + " " + q.turns[0])}</p></div></li>`).join("")}</ol>`;
    },
    groups: (q, cur) => groupsHTML(q, cur),
    hard: (q, cur) => (q.kinds.length || q.rubric.length) ? chips(q.kinds.concat(q.rubric), cur) : `<span class="qs-none">None listed</span>`,
    sql: (q) => q.naive ? `<p class="qs-plain">Gives another number than the right one</p>` : `<span class="qs-none">No known trap</span>`,
    runs: (q) => runsHTML(q),
  };
  const FIELDS = Object.keys(RENDER);
  function fill(card, q, cur) { FIELDS.forEach((f) => { const el = card.querySelector(`[data-field="${f}"]`); if (el) el.innerHTML = RENDER[f](q, cur); }); }

  /* ---------- state: the open kind and its example ---------- */
  const card = $("#qs-card"), head = $("#qs-cat-h"), def = $("#qs-def"), pos = $("#qs-pos"), cats = [...root.querySelectorAll(".qs-cat")];
  const st = { cat: G.cats[0].key, i: 0 };
  function render(focusHead) {
    const c = CAT[st.cat], q = G.q[c.ids[st.i]];
    cats.forEach((b) => { const on = b.dataset.cat === st.cat; b.setAttribute("aria-pressed", String(on)); b.tabIndex = on ? 0 : -1; });
    head.innerHTML = `${term(st.cat, c.label)}<span class="n">${c.ids.length} question${c.ids.length === 1 ? "" : "s"}</span>`;
    def.textContent = TERM[st.cat] ? TERM[st.cat].text : "";
    pos.textContent = `Example ${st.i + 1} of ${c.ids.length}`;
    root.querySelectorAll(".qs-seeall").forEach((b) => b.toggleAttribute("data-current", b.dataset.category === st.cat));
    fill(card, q, st.cat);
    if (focusHead) {
      head.focus({ preventScroll: true });
      const r = head.getBoundingClientRect(), top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--tabh")) || 0;
      if (r.top < top || r.top > window.innerHeight - 120) head.scrollIntoView({ block: "start" });
    }
  }
  function choose(key, focusHead) { if (!CAT[key]) return; st.cat = key; st.i = 0; render(focusHead); }
  function step(d) { const n = CAT[st.cat].ids.length; st.i = (st.i + d + n) % n; render(false); }
  // a hover tooltip left over a control that the render replaced goes with it
  const dropTip = () => document.dispatchEvent(new FocusEvent("focusout"));

  root.addEventListener("click", (e) => {
    const t = e.target.closest ? e.target : null; if (!t) return;
    const open = t.closest(".qs-chip[data-open]");
    if (open) { e.stopPropagation(); dropTip(); choose(open.dataset.open, true); return; }
    const cat = t.closest(".qs-cat");
    if (cat) { choose(cat.dataset.cat, false); if (matchMedia("(max-width: 760px)").matches) { const r = $("#qs-panel").getBoundingClientRect(); if (r.top > window.innerHeight * .6) $("#qs-panel").scrollIntoView({ block: "start" }); } return; }
    const b = t.closest("[data-step]");
    if (b) { step(+b.dataset.step); return; }
    const all = t.closest(".qs-seeall");
    if (all) document.dispatchEvent(new CustomEvent("qs:see-all", { detail: { category: all.dataset.category } }));
  });
  root.addEventListener("keydown", (e) => {
    // Enter and Space on a chip open its kind; the page's tooltip pinning must not take them first
    if ((e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest(".qs-chip")) { e.stopPropagation(); return; }
    const cat = e.target.closest && e.target.closest(".qs-cat");
    if (cat) {
      const i = cats.indexOf(cat); let j = null;
      if (e.key === "ArrowDown" || e.key === "ArrowRight") j = (i + 1) % cats.length;
      else if (e.key === "ArrowUp" || e.key === "ArrowLeft") j = (i - 1 + cats.length) % cats.length;
      else if (e.key === "Home") j = 0; else if (e.key === "End") j = cats.length - 1;
      if (j == null) return;
      e.preventDefault(); choose(cats[j].dataset.cat, false); cats[j].focus();
      return;
    }
    if (e.target.closest && e.target.closest("[data-step]") && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
      e.preventDefault(); step(e.key === "ArrowLeft" ? -1 : 1);
    }
  });

  /* ---------- the fixed layout: each field reserves the height its tallest content takes ---------- */
  const heads = [head.parentElement];
  let lastW = 0;
  function reserve() {
    const w = card.getBoundingClientRect().width;
    if (!w || Math.abs(w - lastW) < 1) return;
    lastW = w;
    const probe = card.cloneNode(true);
    probe.removeAttribute("id"); probe.querySelectorAll("[id]").forEach((x) => x.removeAttribute("id"));
    probe.setAttribute("aria-hidden", "true"); probe.inert = true;
    Object.assign(probe.style, { position: "absolute", visibility: "hidden", left: "0", top: "0", width: w + "px", pointerEvents: "none" });
    const fields = [...probe.querySelectorAll("[data-field]")];
    fields.forEach((f) => (f.style.minHeight = ""));
    card.parentElement.appendChild(probe);
    const max = {};
    Object.values(G.q).forEach((q) => {
      fill(probe, q, null);
      fields.forEach((f) => { const k = f.dataset.field; max[k] = Math.max(max[k] || 0, f.getBoundingClientRect().height); });
    });
    probe.remove();
    card.querySelectorAll("[data-field]").forEach((f) => (f.style.minHeight = Math.ceil(max[f.dataset.field] || 0) + "px"));
    // the kind's heading and definition too, so the card starts at the same place for every kind
    const h = heads[0], keepH = head.innerHTML, keepD = def.textContent; let hmax = 0;
    h.style.minHeight = "";
    G.cats.forEach((c) => {
      head.innerHTML = `${esc(c.label)}<span class="n">${c.ids.length} questions</span>`;
      def.textContent = TERM[c.key] ? TERM[c.key].text : "";
      hmax = Math.max(hmax, h.getBoundingClientRect().height);
    });
    head.innerHTML = keepH; def.textContent = keepD; h.style.minHeight = Math.ceil(hmax) + "px";
  }
  render(false);
  const again = () => { lastW = 0; reserve(); };
  if (window.ResizeObserver) new ResizeObserver(() => reserve()).observe(card);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(again);
  document.addEventListener("report-view", (e) => { if (e.detail === "question-sets") requestAnimationFrame(reserve); });
  reserve();
});
</script>
