<style>
/* ---------- the question browser (#397, variant A): "See all N" opens a centred modal ----------
   A native <dialog class="qs qb">: the list of a kind's questions on the left, the guide's own card on the right;
   a full-screen sheet with a list step and a card step on a phone. Its markup is made by the script below. */
.qs .qs-seeall:not([data-current]) { display: none; }

html.qb-open { overflow: hidden; }
.qb { padding: 0; border: 1px solid var(--ink-2); border-top: 2px solid var(--ink); border-radius: 3px; background: var(--paper); color: var(--ink);
  font-family: var(--serif); font-size: 17px; line-height: 1.5; box-shadow: var(--tip-shadow);
  width: min(76rem, calc(100vw - 64px)); height: min(54rem, calc(100dvh - 64px)); max-width: none; max-height: none; overflow: hidden; }
.qb[open] { display: grid; grid-template-rows: auto minmax(0, 1fr); }
.qb::backdrop { background: color-mix(in srgb, var(--paper) 62%, transparent); backdrop-filter: blur(2px) saturate(.6); }
@media (prefers-reduced-motion: no-preference) {
  .qb[open] { animation: qb-in .16s ease-out; }
  .qb[open]::backdrop { animation: qb-fade .16s ease-out; }
}
@keyframes qb-in { from { opacity: 0; } }
@keyframes qb-fade { from { opacity: 0; } }
.qb :focus-visible { outline: 2px solid var(--mf); outline-offset: 2px; }
/* the page's one tooltip moves in here while the dialog is open (the rest of the page is inert);
   the host sits at the page's origin, so a pinned tooltip's page coordinates land where they should */
.qb-tiphost { position: fixed; left: 0; top: 0; width: 100vw; height: 0; overflow: visible; z-index: 30; pointer-events: none; }

/* the head: what is listed, what it means, and the way out */
.qb-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 16px; align-items: start; padding: 14px 18px 12px 22px; border-bottom: 1px solid var(--ink-2); }
.qb-kick { margin: 0 0 1px; font-family: var(--label); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.qb-h { margin: 0; font-family: var(--serif); font-size: 1.42rem; font-weight: 600; line-height: 1.2; }
.qb-h:focus { outline: none; }
.qb-def { margin: 4px 0 0; font-size: 15.5px; line-height: 1.45; color: var(--ink-2); max-width: 46rem; text-wrap: pretty; }
.qb-x { appearance: none; border: 1px solid transparent; background: transparent; color: var(--ink); width: 40px; height: 40px; border-radius: 3px; cursor: pointer; display: grid; place-items: center; margin: -4px -6px 0 0; }
.qb-x:hover { background: var(--row-band); border-color: var(--rule); }

.qb-body { display: grid; grid-template-columns: 22.5rem minmax(0, 1fr); min-height: 0; }
.qb-side { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; border-right: 1px solid var(--rule); background: var(--paper); }
.qb-main { min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 22px 22px; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }

/* the tools: this kind or every kind, another kind, and a find box */
.qb-tools { padding: 12px 14px 10px 22px; border-bottom: 1px solid var(--rule); font-family: var(--label); }
.qb-scope { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--ink-2); border-radius: 3px; overflow: hidden; }
.qb-scope button { appearance: none; border: 0; background: transparent; color: var(--ink); font-family: var(--label); text-align: left; padding: 5px 10px 6px; cursor: pointer; min-height: 44px; display: flex; flex-direction: column; justify-content: center; line-height: 1.2; }
.qb-scope button + button { border-left: 1px solid var(--ink-2); }
.qb-scope button .l { font-size: 14.5px; font-weight: 600; }
.qb-scope button .c { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.qb-scope button:hover { background: var(--row-band); }
.qb-scope button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.qb-scope button[aria-pressed="true"] .c { color: var(--paper); opacity: .82; }
.qb-scope button:focus-visible { outline-offset: -4px; outline-color: var(--paper); }
.qb-scope button[aria-pressed="false"]:focus-visible { outline-color: var(--mf); }
.qb-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.qb-find { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 6px; border: 1px solid var(--rule); border-radius: 3px; background: var(--paper-2); padding: 0 8px; min-height: 36px; color: var(--ink-3); }
.qb-find:focus-within { border-color: var(--ink-2); }
.qb-find input { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; color: var(--ink); font-family: var(--label); font-size: 15px; padding: 6px 0; outline: none; }
.qb-find input:focus-visible { outline: none; }
.qb-find input::placeholder { color: var(--ink-3); }
.qb-find:has(input:focus-visible) { outline: 2px solid var(--mf); outline-offset: 1px; }
.qb-kbtn { appearance: none; flex: none; border: 1px solid var(--ink-2); background: transparent; color: var(--ink); font-family: var(--label); font-size: 14px; border-radius: 3px; min-height: 36px; padding: 0 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.qb-kbtn:hover { background: var(--row-band); }
.qb-kbtn[aria-expanded="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.qb-kbtn svg { transition: transform .12s; }
.qb-kbtn[aria-expanded="true"] svg { transform: rotate(180deg); }
.qb-count { margin: 7px 0 0; font-size: 13.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; min-height: 1.3em; }
.qb-count b { color: var(--ink); font-weight: 600; }

/* the list: scrolls inside its pane, one row per question, its name and how it is first asked */
.qb-scroll { min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
.qb-list { list-style: none; margin: 0; padding: 4px 0 18px; }
.qb-list:focus { outline: none; }
.qb-opt { position: relative; padding: 8px 14px 9px 22px; cursor: pointer; border-bottom: 1px solid var(--grid-major); }
.qb-opt:hover { background: var(--row-band); }
.qb-opt[aria-selected="true"] { background: var(--paper-2); }
.qb-opt[aria-selected="true"]::before { content: ""; position: absolute; left: 0; top: -1px; bottom: -1px; width: 4px; background: var(--ink); }
.qb-opt:focus { outline: none; }
.qb-opt:focus-visible { outline: 2px solid var(--mf); outline-offset: -2px; }
.qb-on { display: block; font-family: var(--serif); font-size: 15.5px; font-weight: 600; line-height: 1.3; color: var(--ink); }
.qb-ot { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; margin-top: 2px; font-family: var(--label); font-size: 13.5px; line-height: 1.35; color: var(--ink-2); }
.qb-ot .more { color: var(--ink-3); }
.qb-opt mark { background: var(--sel); color: inherit; border-radius: 1px; padding: 0 1px; }
.qb-empty { padding: 18px 14px 18px 22px; font-family: var(--label); font-size: 14.5px; color: var(--ink-2); }
.qb-empty button { appearance: none; border: 0; background: none; padding: 0; margin-top: 6px; display: block; font: inherit; color: var(--ink); text-decoration: underline; text-decoration-color: var(--ink-3); text-underline-offset: 3px; cursor: pointer; min-height: 28px; }

/* another kind: the guide's three lists at once, in place of the list until one is picked */
.qb-kinds { padding: 12px 14px 18px 22px; font-family: var(--label); }
.qb-kinds[hidden] { display: none; }
.qb-kinds > p { margin: 0 0 10px; font-size: 13.5px; color: var(--ink-3); }
.qb-kinds h3 { font-family: var(--label); font-size: 14.5px; font-weight: 600; margin: 0 0 5px; line-height: 1.3; }
.qb-kinds ul { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
.qb-kind { appearance: none; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 2px; font-family: var(--label); font-size: 14px; min-height: 32px; padding: 2px 8px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.qb-kind .c { color: var(--ink-3); font-size: 13px; font-variant-numeric: tabular-nums; }
.qb-kind:hover { border-color: var(--ink-3); }
.qb-kind[aria-current="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.qb-kind[aria-current="true"] .c { color: var(--paper); }
.qb-side[data-kinds] .qb-scroll > .qb-list, .qb-side[data-kinds] .qb-scroll > .qb-empty { display: none; }

/* the chosen question: where it sits in the list, and the guide's own card */
.qb-step { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px 10px; padding: 12px 0 10px; background: var(--paper); font-family: var(--label); font-size: 14px; color: var(--ink-2); }
.qb-step .qb-pos { font-variant-numeric: tabular-nums; margin-right: auto; }
.qb-step .qs-btn { min-height: 36px; }
.qb-step .qs-btn[disabled] { opacity: .45; cursor: default; }
.qb-step .qs-btn[disabled]:hover { background: transparent; }
.qb.qs .qb-back { display: none; }
.qb .qs-card { margin: 0; }
.qb .qs-name:focus { outline: none; }

@media (max-width: 900px) { .qb-body { grid-template-columns: 18rem minmax(0, 1fr); } }

/* a phone: a full-screen sheet in two steps, the list, then the card with a way back to it */
@media (max-width: 640px) {
  .qb { width: 100vw; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
  .qb-top { padding: 10px 8px 10px 16px; }
  .qb-h { font-size: 1.24rem; }
  .qb-def { font-size: 14.5px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
  .qb-x { margin: -2px 0 0; }
  .qb-body { grid-template-columns: minmax(0, 1fr); }
  .qb-side { border-right: 0; }
  .qb-tools { padding: 10px 16px 8px; }
  .qb-opt { padding: 10px 16px 11px; }
  .qb-kinds, .qb-empty { padding-left: 16px; padding-right: 16px; }
  .qb-main { padding: 0 16px 24px; }
  .qb[data-pane="list"] .qb-main, .qb[data-pane="card"] .qb-side { display: none; }
  .qb.qs .qb-back { display: inline-flex; }
  .qb-step { flex-wrap: wrap; }
  .qb-step .qb-pos { order: 3; flex-basis: 100%; margin: 0; }
  .qb-step .qb-back { margin-right: auto; }
}
</style>
<script>
/* ---------- the question browser (#397, variant A) ----------
   Needs from the guide's script (questions.html) its card filler, exposed once there as
   window.__qsCard = { fill }; the card's markup is the guide's own #qs-card, cloned. */
window.reportReady(function () {
  "use strict";
  const D = window.REPORT, G = D && D.questionGuide, guide = document.getElementById("question-guide"), C = window.__qsCard;
  const proto = document.getElementById("qs-card");
  if (!G || !guide || !C || !proto) return;
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const TERM = {}; (D.terms || []).forEach((t) => (TERM[t.key] = t));
  const CAT = {}; G.cats.forEach((c) => (CAT[c.key] = c));
  const ALL = Object.keys(G.q), BYNAME = new Map(ALL.map((id) => [G.q[id].name, id]));
  const term = (key, text) => (TERM[key] ? `<span class="term" data-term="${esc(key)}" tabindex="0">${esc(text == null ? TERM[key].label : text)}</span>` : esc(text == null ? key : text));
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const and = (xs) => (xs.length < 2 ? xs.join("") : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1]);
  const setNames = Object.keys(G.setLabel);
  const hay = {}; ALL.forEach((id) => (hay[id] = (G.q[id].name + " " + G.q[id].turns.join(" ")).toLowerCase()));
  const chev = (d) => `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  /* ---------- the markup ---------- */
  const dlg = document.createElement("dialog");
  dlg.className = "qs qb"; dlg.id = "qb"; dlg.setAttribute("aria-labelledby", "qb-h"); dlg.setAttribute("aria-describedby", "qb-def"); dlg.dataset.pane = "list";
  const lists = G.lists.map((L, li) => `<h3>${term(L.key, L.label)}</h3><ul>${G.cats.filter((c) => c.list === li).map((c) =>
    `<li><button type="button" class="qb-kind" data-kind="${esc(c.key)}"${TERM[c.key] ? ` data-term="${esc(c.key)}"` : ""}><span>${esc(c.label)}</span><span class="c">${c.ids.length}</span></button></li>`).join("")}</ul>`).join("");
  dlg.innerHTML =
    `<div class="qb-tiphost"></div>` +
    `<header class="qb-top"><div><p class="qb-kick">The questions</p><h2 class="qb-h" id="qb-h" tabindex="-1"></h2><p class="qb-def" id="qb-def"></p></div>` +
    `<button type="button" class="qb-x" aria-label="Close the question list"><svg viewBox="0 0 14 14" width="16" height="16" aria-hidden="true"><path d="M2 2L12 12M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></header>` +
    `<div class="qb-body">` +
      `<section class="qb-side" aria-label="The list">` +
        `<div class="qb-tools"><div class="qb-scope" role="group" aria-label="Which questions to list">` +
          `<button type="button" data-scope="kind" aria-pressed="true"><span class="l">This kind</span><span class="c"></span></button>` +
          `<button type="button" data-scope="all" aria-pressed="false"><span class="l">Every kind</span><span class="c">${plural(ALL.length, "question")}</span></button></div>` +
          `<div class="qb-row"><label class="qb-find">${`<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9.2 9.2L12.5 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`}` +
            `<input type="search" placeholder="Find by name or wording" aria-label="Find a question in this list" autocomplete="off" spellcheck="false"></label>` +
            `<button type="button" class="qb-kbtn" aria-expanded="false" aria-controls="qb-kinds">Another kind${chev("M2.5 4.5L6 8l3.5-3.5")}</button></div>` +
          `<p class="qb-count" aria-live="polite"></p></div>` +
        `<div class="qb-scroll"><div class="qb-kinds" id="qb-kinds" hidden><p>Each kind with its number of questions</p>${lists}</div>` +
          `<ul class="qb-list" role="listbox" aria-label="Questions"></ul><div class="qb-empty" hidden></div></div>` +
      `</section>` +
      `<section class="qb-main" aria-label="The chosen question">` +
        `<div class="qb-step"><button type="button" class="qs-btn qb-back">${chev("M7.5 2.5L4 6l3.5 3.5")}The list</button>` +
          `<span class="qb-pos" aria-live="polite"></span>` +
          `<button type="button" class="qs-btn" data-go="-1" aria-label="Previous question">${chev("M7.5 2.5L4 6l3.5 3.5")}Previous</button>` +
          `<button type="button" class="qs-btn" data-go="1" aria-label="Next question">Next${chev("M4.5 2.5L8 6 4.5 9.5")}</button></div>` +
      `</section>` +
    `</div>`;
  // the guide's own card, cloned: the same fields in the same places, filled by the guide's own renderers
  const card = proto.cloneNode(true);
  card.id = "qb-card"; card.querySelectorAll("[id]").forEach((x) => (x.id = "qb-" + x.id.replace(/^qs-/, "")));
  card.setAttribute("aria-labelledby", "qb-name"); card.querySelectorAll("[data-field]").forEach((f) => (f.style.minHeight = ""));
  dlg.querySelector(".qb-main").appendChild(card);
  document.body.appendChild(dlg);

  const $ = (s) => dlg.querySelector(s);
  const head = $("#qb-h"), def = $("#qb-def"), listEl = $(".qb-list"), empty = $(".qb-empty"), count = $(".qb-count"), pos = $(".qb-pos");
  const side = $(".qb-side"), scroller = $(".qb-scroll"), kinds = $("#qb-kinds"), kbtn = $(".qb-kbtn"), find = $(".qb-find input"), host = $(".qb-tiphost");
  const scopeBtns = [...dlg.querySelectorAll("[data-scope]")], phone = matchMedia("(max-width: 640px)");

  /* ---------- state ---------- */
  const st = { kind: null, all: false, q: "", ids: [], sel: null, opener: null };
  const scopeIds = () => (st.all ? ALL : CAT[st.kind].ids);
  const dropTip = () => document.dispatchEvent(new FocusEvent("focusout")); // a hover tooltip over a replaced control goes with it

  function mark(text, q) {
    if (!q) return esc(text);
    const i = text.toLowerCase().indexOf(q); if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
  }
  function renderHead() {
    const c = CAT[st.kind];
    if (st.all) {
      head.textContent = "Every question";
      def.innerHTML = `All ${ALL.length} questions of the ${and(setNames.map((s) => term(s, G.setLabel[s].replace(/^./, (x) => x.toLowerCase()))))}, in the sets' own order.`;
    } else {
      head.innerHTML = term(st.kind, c.label);
      def.textContent = TERM[st.kind] ? TERM[st.kind].text : "";
    }
    scopeBtns[0].querySelector(".l").textContent = st.all ? `Only ${c.label.toLowerCase()}` : "This kind";
    scopeBtns[0].querySelector(".c").textContent = plural(c.ids.length, "question");
    scopeBtns.forEach((b) => b.setAttribute("aria-pressed", String((b.dataset.scope === "all") === st.all)));
    dlg.querySelectorAll(".qb-kind").forEach((b) => { if (!st.all && b.dataset.kind === st.kind) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current"); });
  }
  function renderList() {
    const q = st.q.trim().toLowerCase(), base = scopeIds();
    st.ids = q ? base.filter((id) => hay[id].includes(q)) : base.slice();
    const where = st.all ? "every kind" : CAT[st.kind].label.toLowerCase();
    count.innerHTML = q ? `<b>${st.ids.length}</b> of ${plural(base.length, "question")} match` : `${plural(base.length, "question")} listed`;
    if (!st.ids.includes(st.sel)) st.sel = st.ids[0] || null;
    listEl.innerHTML = st.ids.map((id) => {
      const Q = G.q[id], more = Q.turns.length - 1;
      return `<li class="qb-opt" role="option" id="qb-o-${esc(id)}" data-id="${esc(id)}" aria-selected="${id === st.sel}" tabindex="${id === st.sel ? 0 : -1}">` +
        `<span class="qb-on">${mark(Q.name, q)}</span><span class="qb-ot">${mark(Q.turns[0], q)}${more ? ` <span class="more">then ${plural(more, "follow-up question")}</span>` : ""}</span></li>`;
    }).join("");
    listEl.hidden = !st.ids.length;
    empty.hidden = !!st.ids.length;
    if (!st.ids.length) empty.innerHTML = `No question in ${esc(where)} has “${esc(st.q.trim())}” in its name or wording.` + (st.all ? "" : `<button type="button" data-widen="1">Look in every kind</button>`);
  }
  function renderCard() {
    const n = st.ids.length, i = st.ids.indexOf(st.sel);
    dlg.querySelector('[data-go="-1"]').disabled = i <= 0;
    dlg.querySelector('[data-go="1"]').disabled = i < 0 || i >= n - 1;
    if (!st.sel) { pos.textContent = "No question chosen"; card.hidden = true; return; }
    card.hidden = false;
    pos.textContent = `Question ${i + 1} of ${n}`;
    C.fill(card, G.q[st.sel], st.all ? null : st.kind);
  }
  function select(id, how) { // how: {focus, reveal, open}
    if (!id) return;
    st.sel = id;
    listEl.querySelectorAll(".qb-opt").forEach((o) => { const on = o.dataset.id === id; o.setAttribute("aria-selected", String(on)); o.tabIndex = on ? 0 : -1; });
    const o = listEl.querySelector(`[data-id="${CSS.escape(id)}"]`);
    if (o && how && how.reveal !== false) o.scrollIntoView({ block: "nearest" });
    if (o && how && how.focus) o.focus({ preventScroll: true });
    dropTip(); renderCard();
    if (how && how.open && phone.matches) { dlg.dataset.pane = "card"; $(".qb-main").scrollTop = 0; card.querySelector(".qs-name").tabIndex = -1; card.querySelector(".qs-name").focus({ preventScroll: true }); }
  }
  function rescope(kind, all, focusEl) {
    if (kind) st.kind = kind;
    st.all = all;
    closeKinds(false);
    renderHead(); renderList(); renderCard();
    scroller.scrollTop = 0;
    const o = listEl.querySelector('[aria-selected="true"]'); if (o) o.scrollIntoView({ block: "nearest" });
    if (focusEl) focusEl.focus({ preventScroll: true });
  }
  function openKinds() { side.dataset.kinds = ""; kinds.hidden = false; kbtn.setAttribute("aria-expanded", "true"); scroller.scrollTop = 0; const cur = kinds.querySelector('[aria-current="true"]') || kinds.querySelector(".qb-kind"); cur.focus(); }
  function closeKinds(refocus) { if (kinds.hidden) return; delete side.dataset.kinds; kinds.hidden = true; kbtn.setAttribute("aria-expanded", "false"); if (refocus) kbtn.focus(); }

  /* ---------- opening and closing ---------- */
  let tipHome = null;
  function adoptTip(into) { // the page's tooltip lives in the dialog while it is open, and goes home after
    const tip = document.getElementById("tip"); if (!tip) return;
    if (window.__reportUnpin) window.__reportUnpin(false);
    dropTip();
    if (into) { tipHome = [tip.parentNode, tip.nextSibling]; host.style.left = -window.scrollX + "px"; host.style.top = -window.scrollY + "px"; host.appendChild(tip); }
    else if (tipHome) { tipHome[0].insertBefore(tip, tipHome[1]); tipHome = null; }
  }
  function open(kind, opener) {
    if (!CAT[kind]) return;
    st.opener = opener || document.activeElement;
    st.kind = kind; st.all = false; st.q = ""; find.value = "";
    // open on the example the guide was showing, when it is of this kind
    const shown = BYNAME.get((document.querySelector("#qs-card .qs-name") || {}).textContent);
    st.sel = CAT[kind].ids.includes(shown) ? shown : CAT[kind].ids[0];
    closeKinds(false); renderHead(); renderList(); renderCard();
    dlg.dataset.pane = "list";
    adoptTip(true);
    document.documentElement.classList.add("qb-open");
    dlg.showModal();
    reserve();
    scroller.scrollTop = 0;
    const o = listEl.querySelector('[aria-selected="true"]');
    if (o) { o.scrollIntoView({ block: "center" }); o.focus({ preventScroll: true }); }
  }
  let quiet = false; // closed by a tooltip's jump into the page: the jump places focus itself
  dlg.addEventListener("close", () => {
    document.documentElement.classList.remove("qb-open");
    adoptTip(false);
    const back = st.opener; st.opener = null;
    if (!quiet && back && back.isConnected && back.offsetParent !== null) back.focus({ preventScroll: true });
    quiet = false;
  });
  document.addEventListener("qs:see-all", (e) => {
    const k = e.detail && e.detail.category;
    open(k, guide.querySelector(`.qs-seeall[data-category="${CSS.escape(k || "")}"]`));
  });
  // a pinned tooltip's "More in the glossary" leaves the dialog for the page
  document.addEventListener("click", (e) => {
    if (dlg.open && e.target.closest && e.target.closest(".tip [data-jump]")) { quiet = true; dlg.close(); }
  }, true);

  /* ---------- pointer ---------- */
  dlg.addEventListener("click", (e) => {
    if (e.target === dlg) { // a click on the backdrop
      const r = dlg.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dlg.close();
      return;
    }
    const t = e.target.closest ? e.target : null; if (!t) return;
    if (t.closest(".qb-x")) { dlg.close(); return; }
    // a kind's chip in the card lists that kind, keeping the question
    const chip = t.closest(".qs-chip[data-open]");
    if (chip) { e.stopPropagation(); dropTip(); if (CAT[chip.dataset.open]) rescope(chip.dataset.open, false, null); const f = card.querySelector(`.qs-chip[data-open="${CSS.escape(chip.dataset.open)}"]`); if (f) f.focus({ preventScroll: true }); return; }
    const sc = t.closest("[data-scope]");
    if (sc) { rescope(null, sc.dataset.scope === "all", sc); return; }
    if (t.closest("[data-widen]")) { rescope(null, true, find); return; }
    if (t.closest(".qb-kbtn")) { if (kinds.hidden) openKinds(); else closeKinds(true); return; }
    const kd = t.closest(".qb-kind");
    if (kd) { e.stopPropagation(); dropTip(); rescope(kd.dataset.kind, false, null); const o = listEl.querySelector('[aria-selected="true"]'); (o || kbtn).focus({ preventScroll: true }); return; }
    const o = t.closest(".qb-opt");
    if (o) { select(o.dataset.id, { focus: true, reveal: true, open: true }); return; }
    const go = t.closest("[data-go]");
    if (go) { step(+go.dataset.go); return; }
    if (t.closest(".qb-back")) { dlg.dataset.pane = "list"; const s = listEl.querySelector('[aria-selected="true"]'); if (s) { s.scrollIntoView({ block: "center" }); s.focus({ preventScroll: true }); } }
  });
  function step(d) { const i = st.ids.indexOf(st.sel) + d; if (i >= 0 && i < st.ids.length) select(st.ids[i], { reveal: true }); $(".qb-main").scrollTop = 0; }
  find.addEventListener("input", () => { st.q = find.value; renderList(); renderCard(); scroller.scrollTop = 0; });
  // scrolling a pane leaves no tooltip floating over the wrong row
  [scroller, $(".qb-main")].forEach((el) => el.addEventListener("scroll", () => { if (!document.querySelector("#tip.pinned")) dropTip(); }, { passive: true }));

  /* ---------- keys ---------- */
  const focusables = () => [...dlg.querySelectorAll('button, input, [tabindex="0"], .term')].filter((el) => !el.disabled && el.tabIndex >= 0 && el.getClientRects().length && !el.closest("[hidden]") && !el.closest(".tip"));
  dlg.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      // a pinned tooltip closes first (the page's own handler); then the kinds panel; then the dialog
      if (document.querySelector("#tip.pinned")) { e.preventDefault(); return; }
      if (!kinds.hidden) { e.preventDefault(); e.stopPropagation(); closeKinds(true); return; }
      return; // the dialog's own cancel closes it
    }
    if (e.key === "Tab") { // keep focus in the dialog, also past the browser's own controls
      const f = focusables(); if (!f.length) return;
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && (i === f.length - 1 || i < 0)) { e.preventDefault(); f[0].focus(); }
      return;
    }
    // Enter and Space on a chip or a kind list that kind; the page's tooltip pinning must not take them first
    if ((e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest(".qs-chip[data-open], .qb-kind")) { e.preventDefault(); e.stopPropagation(); e.target.click(); return; }
    const o = e.target.closest && e.target.closest(".qb-opt");
    if (o) {
      const i = st.ids.indexOf(o.dataset.id), page = Math.max(1, Math.floor(scroller.clientHeight / o.offsetHeight) - 1);
      let j = null;
      if (e.key === "ArrowDown") j = i + 1; else if (e.key === "ArrowUp") j = i - 1;
      else if (e.key === "Home") j = 0; else if (e.key === "End") j = st.ids.length - 1;
      else if (e.key === "PageDown") j = i + page; else if (e.key === "PageUp") j = i - page;
      else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(o.dataset.id, { open: true }); if (!phone.matches) { const f = card.querySelector(".qs-chip, .term"); if (f) f.focus(); } return; }
      if (j == null) return;
      e.preventDefault(); select(st.ids[Math.max(0, Math.min(st.ids.length - 1, j))], { focus: true, reveal: true });
      return;
    }
    if (e.target === find && e.key === "ArrowDown") { e.preventDefault(); const s = listEl.querySelector('[aria-selected="true"]'); if (s) s.focus(); }
  });
  dlg.addEventListener("cancel", (e) => { if (document.querySelector("#tip.pinned")) e.preventDefault(); });

  /* ---------- the fixed layout, as in the guide: each field reserves the height its tallest content takes ---------- */
  let lastW = 0;
  function reserve() {
    const w = card.getBoundingClientRect().width;
    if (!w || Math.abs(w - lastW) < 1) return;
    lastW = w;
    const probe = card.cloneNode(true);
    probe.removeAttribute("id"); probe.querySelectorAll("[id]").forEach((x) => x.removeAttribute("id"));
    probe.setAttribute("aria-hidden", "true"); probe.inert = true; probe.hidden = false;
    Object.assign(probe.style, { position: "absolute", visibility: "hidden", left: "0", top: "0", width: w + "px", pointerEvents: "none" });
    const fields = [...probe.querySelectorAll("[data-field]")];
    fields.forEach((f) => (f.style.minHeight = ""));
    card.parentElement.appendChild(probe);
    const max = {};
    ALL.forEach((id) => { C.fill(probe, G.q[id], null); fields.forEach((f) => { const k = f.dataset.field; max[k] = Math.max(max[k] || 0, f.getBoundingClientRect().height); }); });
    probe.remove();
    card.querySelectorAll("[data-field]").forEach((f) => (f.style.minHeight = Math.ceil(max[f.dataset.field] || 0) + "px"));
  }
  if (window.ResizeObserver) new ResizeObserver(() => { if (dlg.open) reserve(); }).observe(card);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { lastW = 0; if (dlg.open) reserve(); });
});
</script>
