# Off (PLAN.md D26): nothing here runs on its own; the gate is local, `make check` on every change and
# `make verify` before a merge. The jobs stay defined so DAG CI for Composer can be rehearsed on demand.
# test: lint, unit and DagBag tests against the Compose warehouse; images: every image build
# (the dbt image build runs `dbt parse`). Images are never pushed.
# Actions are pinned by commit SHA; the tag is in the comment.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Lint shell scripts
        run: make lint
      # The warehouse-backed readiness tests need the Compose warehouse (issue #50). The schema is
      # re-applied after the healthcheck, as platform/compose/up.sh does, since pg_isready can
      # answer while the init scripts still run.
      - name: Start the warehouse stand-in
        run: |
          docker compose -f platform/compose/compose.yaml up -d --wait warehouse
          docker compose -f platform/compose/compose.yaml exec -T -e PGOPTIONS="-c client_min_messages=warning" warehouse \
            psql -q -U warehouse -d warehouse -v ON_ERROR_STOP=1 -f /docker-entrypoint-initdb.d/01-schemas.sql
      - name: Lint and test the Python packages (DagBag import test included)
        env:
          PPLK8S_REQUIRE_WAREHOUSE: "1" # fail, not skip, the tests that need the warehouse
        run: make test

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: airflow, context: airflow}
          - {name: el-factory, context: services/el-factory}
          - {name: event-adapter, context: services/event-adapter}
          - {name: dbt, context: dbt}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: false
          tags: pplk8s/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
