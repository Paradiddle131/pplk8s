[project]
name = "el-factory"
version = "0.1.0"
description = "EL Factory lite: a Flask service that stages source pages in GCS and loads them into the warehouse"
requires-python = ">=3.13"
dependencies = [
    "flask==3.1.3",
    "gunicorn==26.2.0",
    "google-cloud-storage==3.17.0",
    "requests==2.34.2",
    "pyyaml",
]

[project.optional-dependencies]
# The warehouse EL Factory loads (el_factory/warehouse.py, ELF_WAREHOUSE; semantic/PLAN.md SL-19): an
# image installs one extra (the Dockerfile's WAREHOUSE), so it carries only that warehouse's driver.
# postgres: the lab's Compose warehouse.
postgres = [
    "psycopg[binary]==3.3.6",
]
# bigquery: the lab project's BigQuery (el_factory/warehouse_bigquery.py, #227), loaded by load
# jobs; the version the semantic agent pins (services/semantic-agent/pyproject.toml).
bigquery = [
    "google-cloud-bigquery==3.47.0",
]
# The file sources (el_factory/tlc, the Airflow lab's TLC pipeline, PLAN.md D34-D35): Parquet by
# pyarrow. Served only on a warehouse that keeps their ledger (Postgres), so only the postgres image
# installs it (the Dockerfile's builder-postgres); the GCP build carries neither it nor el_factory/tlc.
files = [
    "pyarrow==21.0.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

# No group is installed in any image (`uv sync --no-dev` in the Dockerfile).
# dev: the test and lint tools and every extra, so the tests cover both seams and the file sources.
[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "el-factory[postgres,bigquery,files]",
]

[tool.uv.build-backend]
module-name = "el_factory"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
