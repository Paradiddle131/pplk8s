[project]
name = "el-factory"
version = "0.1.0"
description = "EL Factory lite: a Flask service that stages source pages in GCS and loads them into the warehouse"
requires-python = ">=3.13"
dependencies = [
    "flask==3.1.3",
    "gunicorn==26.2.0",
    "google-cloud-storage==3.17.0",
    "psycopg[binary]==3.3.6",
    "requests==2.34.2",
    "pyyaml",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv.build-backend]
module-name = "el_factory"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
