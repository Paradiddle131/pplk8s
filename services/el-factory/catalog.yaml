# Pipelines and the (source, entity) pairs each one extracts; DAGs fetch this via GET /catalog.
# An entry with `enabled: false` stays in the file but is left out of the catalog.
pipelines:
  sales:
    - {source: synthetic, entity: customers}
    - {source: synthetic, entity: orders}
  # Synthetic marketing (PLAN.md D38): campaigns, daily ad spend, CRM leads and their bookings.
  marketing:
    - {source: synthetic, entity: campaigns}
    - {source: synthetic, entity: ad_spend}
    - {source: synthetic, entity: leads}
    - {source: synthetic, entity: bookings}
  # Synthetic call transcripts (semantic/PLAN.md SL-18): text only; dbt labels it (docs/text-signals.md).
  call_transcripts:
    - {source: synthetic, entity: call_transcripts}
  weather:
    - {source: open_meteo, entity: hourly_weather}
  # NYC TLC trip files, one data month per run (D35); FHVHV is kept for the big-file drill only.
  tlc:
    - {source: tlc, entity: yellow}
    - {source: tlc, entity: green}
    - {source: tlc, entity: fhvhv, enabled: false}
