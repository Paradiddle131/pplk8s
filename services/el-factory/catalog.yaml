# Pipelines and the (source, entity) pairs each one extracts; DAGs fetch this via GET /catalog.
# An entry with `enabled: false` stays in the file but is left out of the catalog.
pipelines:
  sales:
    - {source: synthetic, entity: customers}
    - {source: synthetic, entity: orders}
  weather:
    - {source: open_meteo, entity: hourly_weather}
