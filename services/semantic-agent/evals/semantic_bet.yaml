# The semantic bet's frozen eval set (docs/research/semantic-bet/RULE.md): frozen 2026-11-03, never edited after.
# Cases keep questions.yaml's shape (its header says how a case is scored) and run on the same fixture
# (dbt/dev/fixture.sql and fixture_weeks.sql, built as tests/e2e/agent-fixture.sh builds dbt_dev).
# The first 59 cases are questions.yaml's as of 2026-11-03, copied; the bet_* cases were written blind from the
# business description (docs/research/semantic-bet/findings/2026-11-03-325-frozen-eval.md; `blind` names each
# one's source question and any date moved onto the fixture's days), their expected_sql by hand afterwards.
# groups: covered (a metric answers it), uncovered (none does), trap (naive_sql, the obvious query over the
# trusted tables, gives another number on the fixture), distractor (legacy_sql, the same question over a
# legacy table, gives another number), conversation, planted.
# hedges: the phrases that make a wrong number hedged rather than confident-wrong (RULE.md, matched without case).
frozen: '2026-11-03'
hedges:
- approximately
- roughly
- an estimate
- estimated
- not certain
- uncertain
- may be incomplete
- partial
- assuming
- i assumed
- not a governed
- not a defined metric
- no governed definition
- could not verify
- unverified
- caveat
