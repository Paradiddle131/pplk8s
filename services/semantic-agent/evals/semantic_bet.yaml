naive_sql:
  revenue_total: select sum(amount) from silver.orders where order_date between '2026-10-01' and '2026-10-02'
  average_order_value: select avg(amount) from silver.orders where order_date = '2026-10-01'
  revenue_fiscal_q3: select sum(revenue_eur) from gold.daily_sales where order_date between '2026-07-01' and '2026-09-30'
  budget_left_end_of_september: >-
    select sum(remaining_eur) from silver.campaign_budgets where snapshot_date between '2026-09-01' and '2026-09-30'
  cost_per_booking_total: >-
    select avg(cost_per_booking_eur) from exposed.channel_performance_daily where activity_date between '2026-10-01'
    and '2026-10-02'
  cost_per_lead_search: >-
    select avg(cost_per_lead_eur) from exposed.channel_performance_daily where channel = 'search' and activity_date
    >= '2026-10-01'
  return_rate_september: >-
    select (select count(*) from silver.returns where return_date between '2026-09-01' and '2026-09-30')::numeric
    / (select count(*) from silver.orders where order_date between '2026-09-01' and '2026-09-30')
  view_to_cart_rate: >-
    select count(*) filter (where action_type = 'add_to_cart')::numeric / count(*) filter (where action_type = 'page_view')
    from silver.customer_actions where event_date = '2026-10-01'
  bet_cancellation_rate_period: >-
    select avg(orders_cancelled::numeric / orders_total) from gold.daily_sales where order_date between '2026-08-17'
    and '2026-10-02'
  bet_customers_september: select sum(customers_distinct) from gold.daily_sales where order_date between '2026-09-01'
    and '2026-09-30'
  bet_channel_lowest_cpl: >-
    select min(c) from (select channel, avg(cost_per_lead_eur) as c from exposed.channel_performance_daily where
    activity_date between '2026-08-17' and '2026-10-02' group by 1) x
legacy_sql:
  cost_per_booking_total: select avg(cost_per_booking) from legacy.channel_daily where day between '2026-10-01'
    and '2026-10-02'
  cost_per_lead_search: select avg(cost_per_lead) from legacy.channel_daily where channel = 'search' and day >=
    '2026-10-01'
  bet_top_country_september: >-
    select max(r) from (select country, sum(revenue) as r from legacy.country_sales where sales_date between '2026-09-01'
    and '2026-09-30' group by 1) c
