# The semantic bet's second, harder eval set (docs/research/semantic-bet/RULE.md § The set, #356): frozen 2026-11-03,
# before any arm runs on it, never edited after. It sits beside semantic_bet.yaml, is scored under the same rule, and
# adds the questions business users find hard: jargon, relative and fiscal periods, several metrics or a metric of a
# metric, segment comparisons and rankings, multi-step questions, implicit definitions, ambiguous terms and follow-ups.
# Cases keep questions.yaml's shape (its header says how a case is scored) and run on the same fixture
# (dbt/dev/fixture.sql and fixture_weeks.sql, built as tests/e2e/agent-fixture.sh builds dbt_dev).
# The questions were drafted blind from #325's business description before reading the semantic layer
# (docs/research/semantic-bet/findings/2026-11-03-356-hard-set.md); `blind` names each one's draft question and what
# moved onto the fixture's days, `post` the four written after reading it; expected_sql by hand afterwards.
# groups: as semantic_bet.yaml's (covered, uncovered, trap with its naive_sql, distractor with its legacy_sql,
# conversation, planted); kinds: the hard kinds each case belongs to (a case may sit in several).
# hedges: semantic_bet.yaml's list, unchanged.
frozen: '2026-11-03'
hedges:
- approximately
- roughly
- an estimate
- estimated
- not certain
- uncertain
- may be incomplete
- partial
- assuming
- i assumed
- not a governed
- not a defined metric
- no governed definition
- could not verify
- unverified
- caveat
