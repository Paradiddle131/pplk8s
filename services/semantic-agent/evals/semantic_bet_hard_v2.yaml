# The semantic bet's hard set, version 2 (docs/research/semantic-bet/RULE.md § Set versions, #377 under epic #375):
# frozen 2026-11-06, before any arm runs on it, never edited after; it supersedes `hard` (semantic_bet_hard.yaml,
# untouched), which was hard on business language but whose uncovered cases were mostly arithmetic over metric results.
# It holds v1's 43 cases with their questions, expected SQL and metrics unchanged (their scoring inputs hash to v1's,
# so v1's runs are carried), relabelled under this set's groups, plus 15 new cases drafted blind by a separate
# subagent from #325's business description and RULE.md's SQL-difficulty rubric (the finding,
# docs/research/semantic-bet/findings/2026-11-06-377-hard-set-v2.md, holds its four rounds verbatim).
# Cases keep questions.yaml's shape and run on the same fixture as v1 (dbt/dev/fixture.sql and fixture_weeks.sql).
# groups: covered (one metric query answers it), composable (no single metric does, arithmetic over at most three
# metric query results does), uncovered (needs row-level SQL no metric composition gives), trap (covered, the obvious
# SQL gives another number), conversation; RULE.md's "uncovered case" reads here as composable or uncovered.
# kinds: v1's hard kinds, plus sql_hard (the obvious SQL gives another number for a reason in the rubric).
# rubric: each sql_hard case's rubric kinds (fan_out_join, distinct_across_join, ratio_of_sums, window,
# median_percentile, sessions_gaps_islands, cohort_retention, anti_join, date_spine, fiscal_timezone).
# naive_sql: each trap's and each new case's obvious query, whose number misses the expected one (probes/325_check_set.py).
# new: the cases v2 adds; every other case is v1's, carried. hedges: semantic_bet.yaml's list, unchanged.
frozen: '2026-11-06'
supersedes: hard
supersedes_why: >-
  v1's uncovered cases were mostly a ratio or difference of two measures, arithmetic over metric results, so the set
  never tested writing SQL; v2 splits them into composable and uncovered and adds cases hard in SQL by a rubric fixed
  before drafting.
hedges:
- approximately
- roughly
- an estimate
- estimated
- not certain
- uncertain
- may be incomplete
- partial
- assuming
- i assumed
- not a governed
- not a defined metric
- no governed definition
- could not verify
- unverified
- caveat
