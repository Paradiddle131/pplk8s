naive_sql:
  hard_aov_last_month: select avg(amount) from silver.orders where order_date between '2026-09-01' and '2026-09-30'
  hard_basket_size_week: select avg(amount) from silver.orders where order_date between '2026-09-21' and '2026-09-27'
  hard_cpa_search_september: select avg(cost_per_booking_eur) from exposed.channel_performance_daily where channel = 'search'
    and activity_date between '2026-09-01' and '2026-09-30'
  hard_orders_last_fiscal_quarter: select sum(orders_total) from gold.daily_sales where order_date between '2026-07-01' and
    '2026-09-30'
  hard_turkish_vs_dutch_per_order: select max(a) from (select c.country, avg(o.amount) as a from silver.orders o join silver.customers
    c using (customer_id) where c.country in ('TR', 'NL') and o.order_date between '2026-09-01' and '2026-09-30' group by 1)
    x
  hard_followup_cheapest_leads: select min(c) from (select channel, avg(cost_per_lead_eur) as c from exposed.channel_performance_daily
    where activity_date between '2026-09-01' and '2026-09-30' group by 1) x
  hv2_net_revenue_on_september_orders: select sum(net_revenue_eur) from exposed.net_sales_daily where order_date between '2026-09-01'
    and '2026-09-30'
  hv2_signups_never_ordered: select count(*) from silver.customers c where c.signup_date >= '2026-01-01' and c.customer_id not
    in (select customer_id from silver.orders)
  hv2_calls_per_day_september: select avg(n) from (select call_date, count(*) as n from silver.call_signals where call_date
    between '2026-09-01' and '2026-09-30' group by 1) x
  hv2_avg_daily_revenue_fiscal_quarter: select avg(revenue_eur) from gold.daily_sales where order_date between '2026-08-01'
    and '2026-10-05'
  hv2_september_revenue_amsterdam_days: select sum(revenue_eur) from gold.daily_sales where order_date between '2026-09-01'
    and '2026-09-30'
  hv2_median_gap_between_orders: select avg(h) from (select extract(epoch from order_ts - lag(order_ts) over (partition by customer_id
    order by order_ts)) / 3600 as h from silver.orders where order_date between '2026-09-01' and '2026-09-30') x
  hv2_net_revenue_week_returns_credited: select sum(o.amount) - coalesce(sum(r.amount), 0) from silver.orders o left join silver.returns
    r using (order_id) where o.status <> 'cancelled' and o.order_date between '2026-10-05' and '2026-10-11'
  hv2_country_lowest_daily_revenue: select min(r) from (select country, avg(revenue_eur) as r from exposed.sales_by_country_daily
    where order_date between '2026-08-17' and '2026-10-02' group by 1) x
  hv2_cancellation_rate_by_value_august: select avg(r) from (select order_date, sum(amount) filter (where status = 'cancelled')
    / sum(amount) as r from silver.orders where order_date between '2026-08-01' and '2026-08-31' group by 1) x
  hv2_revenue_share_unreturned_orders: select 1 - (select sum(amount) from silver.returns) / sum(amount) from silver.orders
    where status <> 'cancelled' and order_date between '2026-08-17' and '2026-10-02'
  hv2_median_customer_spend: select avg(s) from (select customer_id, sum(amount) as s from silver.orders where status <> 'cancelled'
    and order_date between '2026-08-17' and '2026-10-02' group by 1) x
  hv2_top_three_customers_share: select (select sum(s) from (select sum(amount) as s from silver.orders where order_date between
    '2026-08-17' and '2026-10-02' group by customer_id order by s desc limit 3) t) / sum(amount) from silver.orders where order_date
    between '2026-08-17' and '2026-10-02'
  hv2_first_order_value_october: select avg(amount) from silver.orders where order_date between '2026-10-01' and '2026-10-07'
  hv2_spend_on_days_without_email_booking: select sum(a.spend) from silver.ad_spend a join silver.bookings b on b.booked_date
    = a.spend_date join silver.campaigns c on c.campaign_id = b.campaign_id where c.channel <> 'email' and a.spend_date between
    '2026-08-17' and '2026-10-02'
  hv2_search_budget_left_drop: select abs(sum(remaining_eur) filter (where snapshot_date between '2026-09-01' and '2026-09-30')
    - sum(remaining_eur) filter (where snapshot_date between '2026-08-01' and '2026-08-31')) from silver.campaign_budgets b
    join silver.campaigns c using (campaign_id) where c.channel = 'search'
