<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Semantic track</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap">
<style>
/* The semantic track on one sheet, in the drawing language of assets/semantic-agent.html, which goes one
   level down into the agent's code: black ink on paper, frames without fill whose title sits in the top
   line, and two coloured pencils, each with one meaning: cobalt for what the agent reads as agent_metrics,
   vermilion for what the text-to-SQL baseline reads as agent_sql. A chain (dash-dot) line marks what the
   work platform replaces or adds; a Lab / On GCP switch above the sheet relabels every stand-in with its
   GCP counterpart. A card's title is the only bold text; its second line is sans for what runs it and mono
   for an identifier; an arrow carries a word only where the arrow alone would not say it. Text is never
   smaller than 11 px. */
:root {
  --paper: #fbfbf9;
  --card: #ffffff;
  --ink: #1b1b1d;
  --rule: #85858b;
  --hair: #cfcec9;
  --muted: #5d5d65;
  --gov: #2f4bc4;
  --raw: #c3421a;
  --sans: "Atkinson Hyperlegible Next", "Segoe UI", sans-serif;
  --mono: "Atkinson Hyperlegible Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141517; --card: #1c1d20; --ink: #ecebe7; --rule: #7b7b82; --hair: #3a3b40;
    --muted: #a6a6ae; --gov: #93a5ff; --raw: #ff8f6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141517; --card: #1c1d20; --ink: #ecebe7; --rule: #7b7b82; --hair: #3a3b40;
  --muted: #a6a6ae; --gov: #93a5ff; --raw: #ff8f6b;
  color-scheme: dark;
}
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
.stage { max-width: 1200px; margin: 0 auto; display: grid; gap: 12px; }
.bar { display: flex; justify-content: flex-end; }
.bar[hidden] { display: none; }
.seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 2px; overflow: hidden; }
.seg button {
  font: 400 13px/1 var(--sans); color: var(--muted); background: var(--card); border: 0;
  padding: 8px 16px; cursor: pointer; min-height: 32px;
}
.seg button + button { border-left: 1px solid var(--ink); }
.seg button[aria-pressed="true"] { color: var(--paper); background: var(--ink); font-weight: 700; }
.seg button:hover:not([aria-pressed="true"]) { color: var(--ink); }
.seg button:focus-visible { outline: 2px solid var(--gov); outline-offset: 2px; }
figure { margin: 0; overflow-x: auto; }
svg { display: block; width: 100%; height: auto; min-width: 720px; font-family: var(--sans); }
.frame { fill: none; stroke: var(--rule); stroke-width: 1; }
.knock { fill: var(--paper); }
.card { fill: var(--card); stroke: var(--ink); stroke-width: 1; }
.card.behind { stroke: var(--rule); }
.phantom { fill: none; stroke: var(--ink); stroke-width: 1; stroke-dasharray: 14 3 2 3; }
.card.phantom { fill: var(--card); }
.role { fill: none; stroke-width: 1.2; }
.role.gov { stroke: var(--gov); }
.role.raw { stroke: var(--raw); }
.ftitle { font-size: 13px; font-weight: 700; fill: var(--ink); }
.title { font-size: 13px; font-weight: 700; fill: var(--ink); }
.title.gov { fill: var(--gov); }
.title.raw { fill: var(--raw); }
.sub { font-size: 11px; fill: var(--muted); }
.mono { font-family: var(--mono); font-size: 11px; fill: var(--ink); }
.mono.dim { fill: var(--muted); }
.mono.gov { fill: var(--gov); }
.mono.raw { fill: var(--raw); }
.edge { fill: none; stroke: var(--ink); stroke-width: 1.2; }
.edge.thin { stroke: var(--rule); stroke-width: 1; }
.edge.reads { stroke-dasharray: 4 3; }
.edge.gov { stroke: var(--gov); }
.edge.raw { stroke: var(--raw); }
.elabel { font-size: 11px; fill: var(--muted); }
.mark { fill: var(--card); stroke: var(--ink); stroke-width: 1; }
.mark-ink { fill: none; stroke: var(--ink); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="stage">
  <div class="bar" id="bar">
    <div class="seg" role="group" aria-label="Which names to show">
      <button type="button" id="here" aria-pressed="true">Lab</button>
      <button type="button" id="gcp" aria-pressed="false">On GCP</button>
    </div>
  </div>
  <figure>
    <svg id="d" viewBox="0 0 1200 572" role="img" aria-label="The semantic track: domains land through the Airflow lab into a warehouse whose layers dbt builds; the dbt project's semantic YAML defines every metric once, and build_catalog.py generates the agent catalog and, for work, a BigQuery data agent's context. The ADK semantic agent answers an analyst through MetricFlow over the semantic layer, read as agent_metrics, quoting freshness from the ops ledger, where it also writes its audit. In the eval, run in-process, a text-to-SQL baseline reads the public tier as agent_sql and adk eval scores both."></svg>
  </figure>
</div>
<script>
document.fonts.ready.then(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('d');
  const el = (tag, attrs = {}, parent = svg) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) if (v !== undefined && v !== null) n.setAttribute(k, v);
    parent.appendChild(n); return n;
  };
  // A string, or {here, gcp}: the Lab / On GCP switch swaps the text.
  const txt = (parent, x, y, s, cls, attrs = {}) => {
    const t = el('text', { x, y, class: cls, ...attrs }, parent);
    if (typeof s === 'string') t.textContent = s; else { t.textContent = s.here; t.dataset.here = s.here; t.dataset.gcp = s.gcp; }
    return t;
  };

  const defs = el('defs');
  for (const [id, cls] of [['arrow', 'ink'], ['arrowGov', 'gov'], ['arrowRaw', 'raw'], ['arrowRule', 'rule']]) {
    const m = el('marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs);
    el('path', { d: 'M1,1.5 L9,5 L1,8.5 z' }, m).style.fill = `var(--${cls})`;
  }

  // A frame: no fill, its title knocked into the top line, then an optional note. fit() places the note
  // and sizes the knockout to the current labels; the switch calls it again.
  const fits = [];
  const frame = (x, y, w, h, title, note) => {
    el('rect', { x, y, width: w, height: h, rx: 2, class: 'frame' });
    const knock = el('rect', { x: x + 10, y: y - 8, height: 16, class: 'knock' });
    const t = txt(svg, x + 16, y + 4.5, title, 'ftitle');
    const n = note ? txt(svg, 0, y + 4, note, 'sub') : null;
    const fit = () => {
      let end = x + 16 + t.getComputedTextLength();
      if (n) { n.setAttribute('x', end + 10); end += 10 + n.getComputedTextLength(); }
      knock.setAttribute('width', end - x - 4);
    };
    fit(); fits.push(fit);
  };
  // A warehouse role's region: a coloured outline, its name and role knocked into the top line.
  const region = (x, y, w, h, tone, title, role) => {
    el('rect', { x, y, width: w, height: h, rx: 2, class: `role ${tone}` });
    const g = el('g');
    const t = txt(g, x + 12, y + 4.5, title, `title ${tone}`);
    const r = txt(g, x + w - 12, y + 4, role, `mono ${tone}`, { 'text-anchor': 'end' });
    svg.insertBefore(el('rect', { x: x + 6, y: y - 8, width: t.getComputedTextLength() + 12, height: 16, class: 'knock' }), g);
    svg.insertBefore(el('rect', { x: x + w - 18 - r.getComputedTextLength(), y: y - 8, width: r.getComputedTextLength() + 12, height: 16, class: 'knock' }), g);
  };
  // A card: a title and an optional second line (sans unless o.mono).
  const card = (x, y, w, h, title, sub, o = {}) => {
    const g = el('g');
    const r = el('rect', { x, y, width: w, height: h, rx: 2, class: `card ${o.cls ?? ''}` }, g);
    const ty = sub ? y + 19 : y + h / 2 + 4.5;
    txt(g, x + 12, ty, title, o.tcls ?? 'title');
    if (sub) txt(g, x + 12, y + 35, sub, o.mono ? 'mono dim' : 'sub');
    return r;
  };
  const edge = (d, o = {}) => {
    const cls = o.cls ?? '';
    const marker = cls.includes('gov') ? 'arrowGov' : cls.includes('raw') ? 'arrowRaw' : cls.includes('thin') ? 'arrowRule' : 'arrow';
    el('path', { d, class: `edge ${cls}`, 'marker-end': o.noEnd ? null : `url(#${marker})`, 'marker-start': o.both ? `url(#${marker})` : null });
    for (const l of o.labels ?? (o.label ? [o.label] : [])) txt(svg, l.at[0], l.at[1], l.text, 'elabel', { 'text-anchor': l.anchor ?? 'middle' });
  };
  // A check that runs on every build, drawn on the hop it checks.
  const tick = (x, y) => {
    el('circle', { cx: x, cy: y, r: 6, class: 'mark' });
    el('path', { d: `M${x - 3},${y} l2,2.2 l4,-4.4`, class: 'mark-ink' });
  };

  // ---- left: domains and the Airflow lab
  txt(svg, 24, 278, 'domains', 'sub');
  [['sales', 288], ['returns', 318], ['marketing', 348], ['weather', 378]].forEach(([s, y]) => card(24, y, 100, 24, s));
  card(24, 408, 100, 24, '+ domain', null, { cls: 'behind', tcls: 'sub' });
  edge('M124,300 H132 V393 H140 M124,330 H132 M124,360 H132 M124,390 H132 M124,420 H132 V393', { cls: 'thin' });

  card(140, 124, 150, 44, 'alerts', { here: 'Prometheus', gcp: 'Cloud Monitoring' });

  frame(140, 196, 150, 314, { here: 'Airflow lab', gcp: 'Cloud Composer' });
  txt(svg, 278, 500, 'track one', 'sub', { 'text-anchor': 'end' });
  card(152, 214, 126, 44, 'dbt job', { here: 'pod on the cluster', gcp: 'Cloud Run Job' });
  card(152, 300, 126, 44, 'DAG', '<pipeline>_elt', { mono: true });
  card(152, 372, 126, 44, 'EL Factory', { here: 'Flask Deployment', gcp: 'Cloud Run' });

  // ---- centre top: the dbt project
  frame(315, 36, 460, 140, 'dbt project');
  card(327, 64, 138, 48, 'models', 'brz slv gld exp', { mono: true });
  card(479, 64, 158, 48, 'semantic YAML', 'each metric, once');
  card(651, 64, 112, 48, 'documentation', 'glossary, naming');
  card(327, 126, 436, 36, 'checks', null);
  txt(svg, 400, 148.5, 'freshness, discrepancy, contracts, docs, parity', 'mono dim');

  // ---- centre: the warehouse
  frame(315, 232, 460, 278, 'warehouse', { here: 'Postgres, or the BigQuery emulator', gcp: 'BigQuery' });
  card(327, 256, 428, 32, 'ops', null);
  txt(svg, 372, 276.5, 'readiness, deadlines, agent_queries', 'mono dim');

  region(448, 312, 307, 84, 'gov', 'semantic layer', 'agent_metrics');
  card(327, 332, 112, 48, 'bronze', 'raw');
  card(460, 332, 90, 48, 'silver', 'clean');
  card(562, 332, 120, 48, 'time spine', 'metrics, glossary');

  region(448, 412, 307, 84, 'raw', 'public', 'agent_sql');
  card(327, 432, 112, 48, { here: 'comments', gcp: 'descriptions' }, { here: 'persist_docs', gcp: 'Knowledge Catalog' });
  card(460, 432, 84, 48, 'gold', 'curated');
  card(568, 438, 120, 48, '', null, { cls: 'behind' });
  card(562, 432, 120, 48, 'exposed', 'views');
  el('circle', { cx: 688, cy: 486, r: 6.5, class: 'mark' });
  txt(svg, 688, 490, '=', 'mono', { 'text-anchor': 'middle' });

  edge('M439,356 H460');
  edge('M505,380 V432');
  edge('M544,456 H562');
  tick(448, 356); tick(505, 404); tick(553, 440);

  // ---- top right: the generator and what it writes
  card(808, 64, 132, 48, 'generator', 'build_catalog.py', { mono: true });
  card(956, 44, 136, 44, 'data agent context', 'verified queries', { cls: 'phantom' });
  card(956, 104, 136, 44, 'agent catalog', 'agent.json', { mono: true });
  card(1104, 44, 88, 44, 'data agent', 'BigQuery', { cls: 'phantom' });

  // ---- right: the agent
  frame(814, 232, 256, 156, 'workloads', { here: 'kind', gcp: 'Cloud Run' });
  el('rect', { x: 828, y: 256, width: 232, height: 116, rx: 2, class: 'card' });
  txt(svg, 840, 275, 'semantic agent', 'title');
  txt(svg, 950, 275, 'ADK', 'sub');
  txt(svg, 840, 291, 'list_metrics, describe_metric', 'mono dim');
  txt(svg, 840, 306, 'query_metrics', 'mono dim');
  card(840, 318, 150, 44, { here: 'MetricFlow', gcp: 'DataAgentToolset' }, 'query path', { cls: 'phantom', tcls: 'mono' });
  card(1120, 262, 72, 44, 'analyst', 'adk web');

  // ---- right, below: the eval
  frame(814, 404, 256, 106, 'eval', 'in-process');
  card(828, 428, 232, 48, 'text-to-SQL baseline', 'execute_sql', { mono: true });
  txt(svg, 828, 496, { here: 'adk eval scores both, OpenRouter :free', gcp: 'adk eval scores both, Gemini' }, 'sub');

  // ---- edges across regions
  edge('M290,322 H302 V272 H327');
  edge('M290,394 H306 V356 H327');
  edge('M290,236 H302 V200 H632', { label: { text: 'runs', at: [624, 194], anchor: 'end' } });
  edge('M640,176 V256', { label: { text: 'dbt build', at: [648, 214], anchor: 'start' } });
  edge('M327,146 H290');
  edge('M775,88 H808');
  edge('M940,88 H948 V66 H956');
  edge('M940,88 H948 V126 H956');
  edge('M1092,66 H1104');
  edge('M1024,148 V256', { cls: 'reads' });
  edge('M840,340 H755', { cls: 'reads gov' });
  edge('M828,272 H755', { both: true, labels: [{ text: 'freshness', at: [785, 266] }, { text: 'audit', at: [785, 286] }] });
  edge('M828,452 H755', { cls: 'reads raw' });
  edge('M1120,276 H1060', { label: { text: 'asks', at: [1078, 270], anchor: 'start' } });
  edge('M1060,296 H1120', { label: { text: 'answer', at: [1078, 312], anchor: 'start' } });

  // ---- legend
  const ly = 548;
  const li = (x, draw, label) => { draw(x); txt(svg, x + 40, ly + 4, label, 'sub'); };
  li(24, x => el('path', { d: `M${x},${ly} H${x + 30}`, class: 'edge', 'marker-end': 'url(#arrow)' }), 'writes, runs');
  li(150, x => el('path', { d: `M${x},${ly} H${x + 30}`, class: 'edge reads', 'marker-end': 'url(#arrow)' }), 'reads');
  li(250, x => el('path', { d: `M${x},${ly} H${x + 30}`, class: 'phantom' }), 'replaced or added at work');
  li(470, x => { tick(x + 15, ly); }, 'checked on every build');
  li(650, x => { el('circle', { cx: x + 15, cy: ly, r: 6.5, class: 'mark' }); txt(svg, x + 15, ly + 4, '=', 'mono', { 'text-anchor': 'middle' }); }, 'a legacy view, kept in parity');

  // ---- behaviour: Lab / On GCP
  const phantoms = [...svg.querySelectorAll('rect.phantom')];
  const setMode = gcp => {
    svg.querySelectorAll('text[data-gcp]').forEach(t => { t.textContent = gcp ? t.dataset.gcp : t.dataset.here; });
    fits.forEach(f => f());
    // On GCP, what the lab stands in for is the real thing: the chain lines go solid.
    phantoms.forEach(r => r.classList.toggle('phantom', !gcp));
    document.getElementById('here').setAttribute('aria-pressed', String(!gcp));
    document.getElementById('gcp').setAttribute('aria-pressed', String(gcp));
    try { localStorage.setItem('semantic-track-mode', gcp ? 'gcp' : 'here'); } catch (e) {}
  };
  document.getElementById('here').addEventListener('click', () => setMode(false));
  document.getElementById('gcp').addEventListener('click', () => setMode(true));

  const params = new URLSearchParams(location.search);
  if (params.has('static')) document.getElementById('bar').hidden = true;
  else {
    let mode = null; try { mode = localStorage.getItem('semantic-track-mode'); } catch (e) {}
    if (mode === 'gcp') setMode(true);
  }
  if (params.get('mode') === 'gcp') setMode(true);
});
</script>
</body>
</html>
