<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Semantic track</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one wide schematic (left: domains and the Airflow lab that lands them; centre: the dbt project
   above the warehouse it builds; right: the catalog it generates and the ADK agent that answers through it),
   with a Here / On GCP switch above it that relabels every stand-in with its GCP counterpart. */
:root {
  --bg: #0b0f1a;
  --panel: #121828;
  --panel-2: #192136;
  --line: #2b3454;
  --fg: #e9edf8;
  --muted: #8f98ba;
  --bronze: #c97f3f;
  --silver: #b4bdd0;
  --gold: #e9bb4d;
  --exposed: #4fd1b5;
  --semantic: #a78bfa;
  --agent: #fb7185;
  --gcp: #60a5fa;
  --ok: #34d399;
  --alert: #f87171;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f6fb; --panel: #ffffff; --panel-2: #eef1f9; --line: #cfd6e8; --fg: #151b2e; --muted: #5f6a8a;
    --bronze: #a9612a; --silver: #6d778f; --gold: #b8860b; --exposed: #0f8f76; --semantic: #7c3aed;
    --agent: #e11d48; --gcp: #2563eb; --ok: #059669; --alert: #dc2626;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f5f6fb; --panel: #ffffff; --panel-2: #eef1f9; --line: #cfd6e8; --fg: #151b2e; --muted: #5f6a8a;
  --bronze: #a9612a; --silver: #6d778f; --gold: #b8860b; --exposed: #0f8f76; --semantic: #7c3aed;
  --agent: #e11d48; --gcp: #2563eb; --ok: #059669; --alert: #dc2626;
  color-scheme: light;
}
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
.stage { max-width: 1200px; margin: 0 auto; display: grid; gap: 10px; }
.bar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; }
.bar[hidden] { display: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--panel); }
.seg button, .act {
  font: 500 12px/1 var(--sans); letter-spacing: .02em; color: var(--muted); background: transparent; border: 0;
  border-radius: 999px; padding: 7px 12px; cursor: pointer;
}
.seg button[aria-pressed="true"] { color: var(--fg); background: var(--panel-2); }
.seg button:focus-visible, .act:focus-visible { outline: 2px solid var(--semantic); outline-offset: 2px; }
.act { border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
.act:hover { border-color: var(--agent); }
figure { margin: 0; overflow-x: auto; }
svg { display: block; width: 100%; height: auto; min-width: 720px; font-family: var(--sans); }
.box { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.box.soft { fill: var(--panel-2); }
.frame { fill: none; stroke: var(--line); stroke-width: 1; }
.frame.dashed { stroke-dasharray: 4 4; }
.lbl { font-size: 11px; font-weight: 600; fill: var(--fg); }
.lbl.small { font-size: 9.5px; font-weight: 500; }
.sub { font-size: 9.5px; fill: var(--muted); font-weight: 500; }
.mono { font-family: var(--mono); font-size: 9.5px; fill: var(--fg); }
.mono.dim { fill: var(--muted); }
.edge { fill: none; stroke: var(--muted); stroke-width: 1.3; }
.edge.reads { stroke-dasharray: 3 3; }
.edge.thin { stroke-width: 1; }
.elabel { font-size: 9px; fill: var(--muted); }
.chip { fill: var(--panel-2); stroke: var(--line); }
.chip.tool { stroke: var(--agent); }
.pill { fill: var(--panel); stroke: var(--line); }
.ghost { fill: none; stroke: var(--muted); stroke-dasharray: 2 3; opacity: .8; }
svg .n, svg .e { transition: opacity .18s ease; }
svg.focus .n:not(.lit), svg.focus .e:not(.lit) { opacity: .22; }
.tracer { fill: var(--agent); filter: drop-shadow(0 0 4px var(--agent)); }
@media (prefers-reduced-motion: reduce) { svg .n, svg .e { transition: none; } }
</style>
</head>
<body>
<div class="stage">
  <div class="bar" id="bar">
    <button class="act" id="ask" type="button">Trace a question</button>
    <div class="seg" role="group" aria-label="Which names to show">
      <button type="button" id="here" aria-pressed="true">Here</button>
      <button type="button" id="gcp" aria-pressed="false">On GCP</button>
    </div>
  </div>
  <figure>
    <svg id="d" viewBox="0 0 1200 560" role="img" aria-label="The semantic track: domains land through the Airflow lab into a warehouse whose layers dbt builds; the dbt project's semantic YAML defines every metric once, generates the agent catalog and a BigQuery data agent's context, and an ADK agent answers questions through MetricFlow over the silver tier, quoting freshness from the ops ledger, while a text-to-SQL baseline reads the public tier and both are scored by adk eval."></svg>
  </figure>
</div>
<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('d');
  const el = (tag, attrs = {}, parent = svg) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) if (v !== undefined && v !== null) n.setAttribute(k, v);
    parent.appendChild(n); return n;
  };
  const txt = (parent, x, y, s, cls, attrs = {}) => {
    const t = el('text', { x, y, class: cls, ...attrs }, parent);
    if (typeof s === 'string') t.textContent = s; else { t.textContent = s.here; t.dataset.here = s.here; t.dataset.gcp = s.gcp; }
    return t;
  };
  const nodes = {};
  const edges = [];
  const node = (id, cls = '') => { const g = el('g', { class: `n ${cls}`, 'data-id': id }); nodes[id] = g; return g; };

  // defs: arrowheads
  const defs = el('defs');
  for (const [id, color] of [['arrow', 'var(--muted)'], ['arrowA', 'var(--agent)'], ['arrowS', 'var(--semantic)'], ['arrowE', 'var(--exposed)']]) {
    const m = el('marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs);
    el('path', { d: 'M1,1 L9,5 L1,9 z', fill: color }, m);
  }

  // ---- shapes
  const box = (g, x, y, w, h, cls = 'box', r = 6) => el('rect', { x, y, width: w, height: h, rx: r, class: cls }, g);
  const chip = (g, x, y, label, opts = {}) => {
    const w = opts.w ?? Math.round(label.length * 5.7 + 10);
    const h = opts.h ?? 16;
    el('rect', { x, y, width: w, height: h, rx: 8, class: `chip ${opts.cls ?? ''}` }, g);
    const t = txt(g, x + w / 2, y + h / 2 + 3.4, label, `mono ${opts.tcls ?? ''}`, { 'text-anchor': 'middle' });
    if (opts.gcp) { t.dataset.here = label; t.dataset.gcp = opts.gcp; }
    return w;
  };
  const edge = (id, d, ends, opts = {}) => {
    const p = el('path', { id, d, class: `e edge ${opts.cls ?? ''}`, 'data-ends': ends.join(' '),
      'marker-end': opts.noEnd ? null : `url(#${opts.marker ?? 'arrow'})`, 'marker-start': opts.both ? `url(#${opts.marker ?? 'arrow'})` : null });
    if (opts.stroke) p.style.stroke = opts.stroke;
    edges.push(p);
    if (opts.label) {
      const [lx, ly] = opts.label.at;
      txt(svg, lx, ly, opts.label.text, 'e elabel', { 'text-anchor': opts.label.anchor ?? 'middle', 'data-ends': ends.join(' ') });
    }
    return p;
  };
  const tick = (x, y) => { // discrepancy check on a hop
    const g = el('g', { class: 'n', 'data-id': 'checks' });
    el('circle', { cx: x, cy: y, r: 6, fill: 'var(--bg)', stroke: 'var(--ok)', 'stroke-width': 1.2 }, g);
    el('path', { d: `M${x - 3},${y} l2,2.2 l4,-4.4`, fill: 'none', stroke: 'var(--ok)', 'stroke-width': 1.4, 'stroke-linecap': 'round' }, g);
  };

  // ---- left: sources
  const S = node('sources');
  [['sales', 300], ['returns', 334], ['marketing', 368], ['weather', 402]].forEach(([s, y]) => {
    box(S, 28, y, 100, 26, 'pill', 13); txt(S, 78, y + 17, s, 'lbl small', { 'text-anchor': 'middle' });
  });
  box(S, 28, 436, 100, 26, 'pill', 13).style.strokeDasharray = '3 3';
  txt(S, 78, 453, '+ domain', 'sub', { 'text-anchor': 'middle' });
  edge('e-src', 'M128,313 H139 V375 H150 M128,347 H139 M128,381 H139 M128,415 H139 M128,449 H139 V375', ['sources', 'elf'], { cls: 'thin' });

  // ---- left: alerts
  const M = node('alerts');
  box(M, 150, 134, 135, 56);
  el('circle', { cx: 164, cy: 154, r: 4, fill: 'var(--alert)' }, M);
  txt(M, 174, 158, 'alerts', 'lbl');
  txt(M, 174, 171, { here: 'Prometheus', gcp: 'Cloud Monitoring' }, 'sub');
  txt(M, 174, 183, { here: 'Alertmanager', gcp: '' }, 'sub');

  // ---- left: the Airflow lab (track one)
  const A = node('airflow');
  box(A, 150, 200, 135, 290, 'frame dashed', 8);
  txt(A, 217, 480, { here: 'Airflow lab · track one', gcp: 'Cloud Composer' }, 'sub', { 'text-anchor': 'middle' });
  const card = (g, x, y, w, h, title, sub) => {
    box(g, x, y, w, h, 'box soft'); txt(g, x + w / 2, y + (sub ? 12 : h / 2 + 4), title, 'lbl small', { 'text-anchor': 'middle' });
    if (sub) txt(g, x + w / 2, y + 23, sub, 'mono dim', { 'text-anchor': 'middle' });
  };
  card(A, 162, 212, 111, 28, { here: 'dbt job', gcp: 'Cloud Run Job' });
  card(A, 162, 300, 111, 30, { here: 'DAG', gcp: 'DAG' }, '<pipeline>_elt');
  card(A, 162, 360, 111, 30, { here: 'EL Factory', gcp: 'Cloud Run' }, 'extract · load');

  // ---- centre top: dbt project
  const D = node('dbt');
  box(D, 315, 36, 460, 160, 'frame', 8);
  txt(D, 327, 56, 'dbt project', 'lbl');
  box(D, 327, 70, 138, 66, 'box soft'); txt(D, 335, 88, 'models', 'lbl small');
  [['brz', 'var(--bronze)'], ['slv', 'var(--silver)'], ['gld', 'var(--gold)'], ['exp', 'var(--exposed)']].forEach(([c, col], i) => {
    const x = 333 + i * 32; el('rect', { x, y: 104, width: 28, height: 16, rx: 8, fill: 'var(--panel)', stroke: col }, D);
    txt(D, x + 14, 115.4, c, 'mono', { 'text-anchor': 'middle' });
  });
  box(D, 479, 70, 158, 66, 'box soft').style.stroke = 'var(--semantic)';
  txt(D, 487, 88, 'semantic YAML', 'lbl small');
  el('rect', { x: 606, y: 77, width: 24, height: 14, rx: 7, fill: 'var(--semantic)' }, D);
  txt(D, 618, 87.5, '1×', 'mono', { 'text-anchor': 'middle', fill: 'var(--bg)' }).style.fill = 'var(--bg)';
  let cx = chip(D, 485, 104, 'semantic models', { cls: 'semantic' }); chip(D, 485 + cx + 4, 104, 'metrics');
  box(D, 651, 70, 112, 66, 'box soft'); txt(D, 659, 88, 'documentation', 'lbl small');
  cx = chip(D, 657, 104, 'glossary'); chip(D, 657 + cx + 4, 104, 'naming');
  let x = 327; for (const c of ['source freshness', 'discrepancy', 'contracts', 'docs standard', 'parity']) x += chip(D, x, 156, c, { h: 22 }) + 8;
  txt(D, 763, 171, 'checks', 'sub', { 'text-anchor': 'end' });

  // ---- centre: warehouse
  const W = node('warehouse');
  box(W, 315, 240, 460, 250, 'frame', 8);
  txt(W, 327, 262, 'warehouse', 'lbl');
  el('rect', { x: 395, y: 248, width: 60, height: 18, rx: 9, fill: 'var(--panel-2)', stroke: 'var(--line)' }, W);
  txt(W, 425, 260.5, { here: 'Postgres', gcp: 'BigQuery' }, 'mono', { 'text-anchor': 'middle' });
  const emu = el('g', { class: 'n gcp-hide', 'data-id': 'warehouse' }, W);
  el('rect', { x: 650, y: 248, width: 112, height: 18, rx: 9, class: 'ghost' }, emu);
  txt(emu, 706, 260.5, 'BigQuery emulator', 'mono dim', { 'text-anchor': 'middle' });

  // ops ledger strip
  const O = node('ops');
  box(O, 330, 285, 432, 26, 'box soft', 13);
  txt(O, 344, 302, 'ops', 'lbl small');
  x = 372; for (const c of ['readiness', 'deadlines', 'audit', 'parity report']) x += chip(O, x, 290, c) + 6;

  // row 1: protected tier + semantic zone
  const Z1 = node('semantic'); // zone around silver and the semantic schema
  el('rect', { x: 433, y: 318, width: 329, height: 76, rx: 8, class: 'frame dashed' }, Z1).style.stroke = 'var(--semantic)';
  txt(Z1, 710, 352, 'semantic layer', 'lbl', { 'text-anchor': 'middle' }).style.fill = 'var(--semantic)';
  txt(Z1, 710, 368, 'agent_metrics', 'mono dim', { 'text-anchor': 'middle' });
  const layer = (id, x, y, w, h, label, col, sub) => {
    const g = node(id); const r = box(g, x, y, w, h, 'box'); r.style.stroke = col;
    el('rect', { x, y, width: 4, height: h, rx: 2, fill: col }, g);
    txt(g, x + w / 2 + 2, y + (sub ? h / 2 - 2 : h / 2 + 4), label, 'lbl', { 'text-anchor': 'middle' });
    if (sub) txt(g, x + w / 2 + 2, y + h / 2 + 12, sub, 'mono dim', { 'text-anchor': 'middle' });
    return g;
  };
  layer('bronze', 330, 326, 88, 60, 'bronze', 'var(--bronze)', 'raw');
  layer('silver', 443, 326, 88, 60, 'silver', 'var(--silver)', 'clean');
  const T = node('timespine'); box(T, 546, 326, 108, 60, 'box soft');
  txt(T, 600, 350, 'time spine', 'lbl small', { 'text-anchor': 'middle' });
  txt(T, 600, 366, 'metrics · glossary', 'mono dim', { 'text-anchor': 'middle' });

  // row 2: public tier
  const Z2 = node('public');
  el('rect', { x: 433, y: 398, width: 329, height: 82, rx: 8, class: 'frame dashed' }, Z2).style.stroke = 'var(--exposed)';
  el('path', { d: 'M700,432 v-4 a4,4 0 0 1 8,0 v4 M697,432 h14 v9 h-14 z', fill: 'none', stroke: 'var(--exposed)', 'stroke-width': 1.3 }, Z2);
  txt(Z2, 721, 441, 'public', 'lbl', { 'text-anchor': 'start' }).style.fill = 'var(--exposed)';
  txt(Z2, 710, 458, 'agent_sql', 'mono dim', { 'text-anchor': 'middle' });
  const Dsc = node('descriptions'); box(Dsc, 330, 412, 88, 52, 'box soft');
  txt(Dsc, 374, 434, { here: 'comments', gcp: 'descriptions' }, 'lbl small', { 'text-anchor': 'middle' });
  txt(Dsc, 374, 449, { here: 'persist_docs', gcp: 'Knowledge Catalog' }, 'mono dim', { 'text-anchor': 'middle', 'font-size': '8.5' });
  layer('gold', 443, 412, 88, 52, 'gold', 'var(--gold)', 'business-ready');
  const Lg = node('legacy'); el('rect', { x: 552, y: 418, width: 108, height: 52, rx: 6, class: 'ghost' }, Lg);
  layer('exposed', 546, 412, 108, 52, 'exposed', 'var(--exposed)', 'views');
  const par = el('g', { class: 'n', 'data-id': 'legacy' });
  el('circle', { cx: 660, cy: 466, r: 6.5, fill: 'var(--bg)', stroke: 'var(--ok)', 'stroke-width': 1.2 }, par);
  txt(par, 660, 469.5, '=', 'mono', { 'text-anchor': 'middle' }).style.fill = 'var(--ok)';

  // hops inside the warehouse
  edge('e-b-s', 'M418,356 H443', ['bronze', 'silver']);
  edge('e-s-g', 'M487,386 V412', ['silver', 'gold']);
  edge('e-g-e', 'M531,438 H546', ['gold', 'exposed']);
  tick(430.5, 348); tick(495, 399); tick(538.5, 430);

  // ---- top right: generator and artefacts
  const G = node('generator');
  box(G, 825, 78, 80, 44); txt(G, 865, 96, 'catalog', 'lbl small', { 'text-anchor': 'middle' }); txt(G, 865, 110, 'generator', 'lbl small', { 'text-anchor': 'middle' });
  const A2 = node('context'); box(A2, 935, 52, 135, 34);
  txt(A2, 1002, 66, 'data agent context', 'lbl small', { 'text-anchor': 'middle' }); txt(A2, 1002, 79, 'verified queries', 'mono dim', { 'text-anchor': 'middle' });
  const A1 = node('catalog'); box(A1, 935, 112, 135, 34);
  txt(A1, 1002, 126, 'agent catalog', 'lbl small', { 'text-anchor': 'middle' }); txt(A1, 1002, 139, 'agent.json', 'mono dim', { 'text-anchor': 'middle' });
  const N = node('native'); const nr = el('rect', { x: 1100, y: 52, width: 90, height: 34, rx: 6, class: 'ghost gcp-solid' }, N);
  txt(N, 1145, 66, 'BigQuery', 'lbl small', { 'text-anchor': 'middle' }); txt(N, 1145, 79, 'data agent', 'lbl small', { 'text-anchor': 'middle' });

  // ---- right: the agent (workloads)
  const R = node('workloads');
  box(R, 805, 240, 295, 250, 'frame', 8);
  txt(R, 817, 258, 'workloads', 'lbl');
  el('rect', { x: 1025, y: 246, width: 62, height: 16, rx: 8, fill: 'var(--panel-2)', stroke: 'var(--line)' }, R);
  txt(R, 1056, 257.5, { here: 'kind', gcp: 'Cloud Run' }, 'mono', { 'text-anchor': 'middle' });
  const C1 = node('agent');
  box(C1, 818, 264, 269, 128).style.stroke = 'var(--agent)';
  txt(C1, 830, 281, 'semantic agent', 'lbl');
  el('rect', { x: 914, y: 269, width: 30, height: 15, rx: 7.5, fill: 'var(--agent)' }, C1);
  txt(C1, 929, 280, 'ADK', 'mono', { 'text-anchor': 'middle' }).style.fill = 'var(--bg)';
  chip(C1, 978, 268, 'OpenRouter :free', { gcp: 'Gemini', w: 99 });
  chip(C1, 830, 290, 'freshness', { cls: 'tool' });
  const MF = node('metricflow');
  box(MF, 830, 337, 92, 38, 'box soft').style.stroke = 'var(--semantic)';
  txt(MF, 876, 360, { here: 'MetricFlow', gcp: 'DataAgentToolset' }, 'mono', { 'text-anchor': 'middle' });
  [['list_metrics', 292], ['describe_metric', 314], ['query_metrics', 336]].forEach(([t, y]) => chip(C1, 935, y, t, { cls: 'tool', w: 100 }));
  edge('e-q-mf', 'M935,344 H922', ['agent', 'metricflow'], { cls: 'thin', stroke: 'var(--semantic)', marker: 'arrowS' });
  const C2 = node('baseline');
  box(C2, 818, 412, 269, 52, 'box');
  txt(C2, 830, 442, 'text-to-SQL baseline', 'lbl small');
  chip(C2, 985, 430, 'execute_sql', { cls: 'tool' });
  const EV = node('eval');
  chip(EV, 818, 470, 'adk eval');
  el('rect', { x: 884, y: 472, width: 60, height: 4, rx: 2, fill: 'var(--agent)' }, EV);
  el('rect', { x: 884, y: 480, width: 44, height: 4, rx: 2, fill: 'var(--muted)' }, EV);
  chip(EV, 962, 470, 'sessions · metadata DB', { gcp: 'sessions · Cloud SQL', w: 127 });

  // ---- far right: the person
  const P = node('person');
  el('circle', { cx: 1152, cy: 292, r: 9, fill: 'none', stroke: 'var(--fg)', 'stroke-width': 1.4 }, P);
  el('path', { d: 'M1136,326 a16,16 0 0 1 32,0', fill: 'none', stroke: 'var(--fg)', 'stroke-width': 1.4 }, P);
  el('path', { d: 'M1163,264 h20 a5,5 0 0 1 5,5 v10 a5,5 0 0 1 -5,5 h-10 l-6,5 v-5 h-4 a5,5 0 0 1 -5,-5 v-10 a5,5 0 0 1 5,-5 z', fill: 'var(--panel-2)', stroke: 'var(--line)' }, P);
  txt(P, 1173, 279, '?', 'lbl', { 'text-anchor': 'middle' });

  // ---- edges across regions
  edge('e-dag-ops', 'M285,315 H300 V298 H330', ['airflow', 'ops'], { label: { text: 'ready', at: [302, 290], anchor: 'start' } });
  edge('e-elf-brz', 'M285,375 H306 V356 H330', ['airflow', 'bronze'], { label: { text: 'lands', at: [302, 390], anchor: 'start' } });
  edge('e-job-build', 'M285,226 H538', ['airflow', 'dbt'], { label: { text: 'runs per stage', at: [410, 220] } });
  edge('e-build', 'M545,196 V240', ['dbt', 'warehouse'], { label: { text: 'dbt build · tests · comments', at: [552, 225], anchor: 'start' } });
  edge('e-alert', 'M327,167 H285', ['dbt', 'alerts'], { stroke: 'var(--alert)' });
  edge('e-manifests', 'M775,100 H825', ['dbt', 'generator'], { label: { text: 'manifests', at: [800, 93] } });
  edge('e-g-a2', 'M905,100 H920 V69 H935', ['generator', 'context']);
  edge('e-g-a1', 'M905,100 H920 V129 H935', ['generator', 'catalog']);
  edge('e-a2-n', 'M1070,69 H1100', ['context', 'native']);
  edge('e-a1-agent', 'M1002,146 V264', ['catalog', 'agent'], { label: { text: 'reads', at: [1008, 210], anchor: 'start' } });
  edge('e-mf-sem', 'M830,356 H762', ['metricflow', 'semantic'], { cls: 'reads', stroke: 'var(--semantic)', marker: 'arrowS' });
  edge('e-ops-agent', 'M818,298 H762', ['agent', 'ops'], { both: true, label: { text: 'audit', at: [790, 311] } });
  edge('e-sql-pub', 'M818,438 H762', ['baseline', 'public'], { cls: 'reads', stroke: 'var(--exposed)', marker: 'arrowE' });
  edge('e-ask', 'M1130,300 H1087', ['person', 'agent'], { stroke: 'var(--agent)', marker: 'arrowA', label: { text: 'asks', at: [1106, 294] } });
  edge('e-answer', 'M1087,346 H1130', ['agent', 'person'], { stroke: 'var(--agent)', marker: 'arrowA', label: { text: 'answer · freshness', at: [1106, 361] } });

  // ---- legend
  const L = el('g', { class: 'legend' });
  const li = (x, draw, label) => { draw(x); txt(L, x + 40, 532.5, label, 'elabel'); };
  li(28, x => el('path', { d: `M${x},529 H${x + 30}`, class: 'edge', 'marker-end': 'url(#arrow)' }, L), 'writes');
  li(118, x => el('path', { d: `M${x},529 H${x + 30}`, class: 'edge reads', 'marker-end': 'url(#arrow)' }, L), 'reads');
  li(208, x => el('rect', { x, y: 522, width: 30, height: 14, rx: 4, class: 'frame dashed' }, L), 'role zone');
  li(318, x => el('rect', { x, y: 522, width: 30, height: 14, rx: 4, class: 'ghost' }, L), 'legacy, in parity');
  li(438, x => { el('circle', { cx: x + 15, cy: 529, r: 6, fill: 'var(--bg)', stroke: 'var(--ok)', 'stroke-width': 1.2 }, L); el('path', { d: `M${x + 12},529 l2,2.2 l4,-4.4`, fill: 'none', stroke: 'var(--ok)', 'stroke-width': 1.4 }, L); }, 'checked on every build');

  // ---- behaviour: Here / On GCP
  const setMode = gcp => {
    svg.querySelectorAll('text[data-gcp]').forEach(t => { t.textContent = gcp ? t.dataset.gcp : t.dataset.here; });
    svg.querySelectorAll('.gcp-hide').forEach(g => { g.style.opacity = gcp ? 0 : 1; });
    nr.style.strokeDasharray = gcp ? 'none' : '';
    nr.style.stroke = gcp ? 'var(--gcp)' : '';
    document.getElementById('here').setAttribute('aria-pressed', String(!gcp));
    document.getElementById('gcp').setAttribute('aria-pressed', String(gcp));
    try { localStorage.setItem('semantic-track-mode', gcp ? 'gcp' : 'here'); } catch (e) {}
  };
  document.getElementById('here').addEventListener('click', () => setMode(false));
  document.getElementById('gcp').addEventListener('click', () => setMode(true));

  // ---- behaviour: hover highlights what a node talks to
  const related = id => {
    const ids = new Set([id]);
    svg.querySelectorAll(`[data-ends~="${id}"]`).forEach(e => e.dataset.ends.split(' ').forEach(i => ids.add(i)));
    return ids;
  };
  svg.querySelectorAll('.n').forEach(g => {
    g.addEventListener('mouseenter', () => {
      const ids = related(g.dataset.id);
      svg.classList.add('focus');
      svg.querySelectorAll('.n').forEach(n => n.classList.toggle('lit', ids.has(n.dataset.id)));
      svg.querySelectorAll('.e').forEach(e => e.classList.toggle('lit', e.dataset.ends.split(' ').includes(g.dataset.id)));
    });
    g.addEventListener('mouseleave', () => { svg.classList.remove('focus'); svg.querySelectorAll('.lit').forEach(n => n.classList.remove('lit')); });
  });

  // ---- behaviour: trace a question through the system
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const steps = [['e-ask', 1], ['e-q-mf', 1], ['e-mf-sem', 1], ['e-mf-sem', -1], ['e-ops-agent', 1], ['e-ops-agent', -1], ['e-answer', 1]];
  let running = false;
  const trace = () => {
    if (running) return; running = true;
    const dot = el('circle', { r: 4.5, class: 'tracer' });
    let i = 0;
    const run = () => {
      if (i >= steps.length) { dot.remove(); running = false; return; }
      const [id, dir] = steps[i++]; const p = document.getElementById(id); const len = p.getTotalLength();
      const dur = Math.max(260, len * 4.5); const t0 = performance.now();
      const frame = now => {
        const k = Math.min(1, (now - t0) / dur); const pt = p.getPointAtLength(dir > 0 ? k * len : (1 - k) * len);
        dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y);
        if (k < 1) requestAnimationFrame(frame); else run();
      };
      requestAnimationFrame(frame);
    };
    run();
  };
  document.getElementById('ask').addEventListener('click', trace);

  const params = new URLSearchParams(location.search);
  if (params.has('static')) { document.getElementById('bar').hidden = true; }
  else {
    let mode = null; try { mode = localStorage.getItem('semantic-track-mode'); } catch (e) {}
    if (mode === 'gcp') setMode(true);
    if (!reduced) setTimeout(trace, 900);
  }
  if (params.get('mode') === 'gcp') setMode(true);
})();
</script>
</body>
</html>
