<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Semantic agent, inside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap">
<style>
/* One level below assets/platform.html: the semantic agent's code (services/semantic-agent/src), in
   the order a question travels, top to bottom. Drawn with the draw-architecture kit (claude-dotfiles:
   its CSS, API and logos sit between the sheet: markers, refreshed by its bin/build.cjs and checked by its
   bin/check.cjs). On this sheet cobalt is what the agent reads as agent_metrics, vermilion what the
   text-to-SQL baseline reads as agent_sql; the chain line is what the work platform replaces; the hatched
   card is the model, the one part that is not code. */
/* sheet:css */
/* draw-architecture: the sheet's tokens and classes. bin/build.cjs inlines this file into each diagram
   between the sheet:css markers; edit it here, never in a copy. */
:root {
  --paper: #fbfbf9;
  --dot: #bebdb8;
  --card: #ffffff;
  --pkg: #ebeae5;
  --ink: #1b1b1d;
  --rule: #85858b;
  --hair: #cfcec9;
  --muted: #5d5d65;
  --cobalt: #2f4bc4;
  --vermilion: #b83d16;
  --wire: var(--ink);
  --sans: "Atkinson Hyperlegible Next", "Segoe UI", sans-serif;
  --mono: "Atkinson Hyperlegible Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: rgb(20, 21, 23); --dot: #56575d; --card: rgb(34, 35, 39); --pkg: #34353b; --ink: #ecebe7; --rule: #7b7b82; --hair: #3a3b40;
    --muted: #a6a6ae; --cobalt: #93a5ff; --vermilion: #ff8f6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: rgb(20, 21, 23); --dot: #56575d; --card: rgb(34, 35, 39); --pkg: #34353b; --ink: #ecebe7; --rule: #7b7b82; --hair: #3a3b40;
  --muted: #a6a6ae; --cobalt: #93a5ff; --vermilion: #ff8f6b;
  color-scheme: dark;
}
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
.stage { max-width: 1200px; margin: 0 auto; display: grid; gap: 12px; }
.bar { display: flex; justify-content: flex-end; }
.bar:empty, .bar[hidden] { display: none; }
.seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 2px; overflow: hidden; }
.seg button {
  font: 400 13px/1 var(--sans); color: var(--muted); background: var(--card); border: 0;
  padding: 8px 16px; cursor: pointer; min-height: 32px;
}
.seg button + button { border-left: 1px solid var(--ink); }
.seg button[aria-pressed="true"] { color: var(--paper); background: var(--ink); font-weight: 700; }
.seg button:hover:not([aria-pressed="true"]) { color: var(--ink); }
.seg button:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }
figure { margin: 0; overflow-x: auto; }
svg.sheet { display: block; width: 100%; height: auto; min-width: 720px; font-family: var(--sans); }

.frame { fill: none; stroke: var(--rule); stroke-width: 1; }
/* depth banding: second, fourth, ... levels screened with a dot pattern, a drafter's screen (flat grey is
   a package card's); the levels between back on paper */
.frame.band-tint { fill: url(#screen); }
.screen-bg { fill: var(--paper); }
.screen-dot { fill: var(--dot); }
.frame.band-paper { fill: var(--paper); }
.knock { fill: var(--paper); }
.knock.tint { fill: url(#screen); }
.card { fill: var(--card); stroke: var(--ink); stroke-width: 1; }
.card.pkg { fill: var(--pkg); }
.card.behind { stroke: var(--rule); }
.card.quiet { stroke: var(--rule); }
.outline { fill: none; stroke: var(--ink); stroke-width: 1; }
.phantom { fill: none; stroke: var(--ink); stroke-width: 1; stroke-dasharray: 14 3 2 3; }
.card.phantom { fill: var(--card); }
.hatch-line { stroke: var(--hair); stroke-width: 1.2; }
.region { fill: none; stroke-width: 1.2; stroke: var(--muted); }
.region.cobalt { stroke: var(--cobalt); }
.region.vermilion { stroke: var(--vermilion); }

/* the headline: the one line above the drawing, one step up the scale from a card's title, regular weight */
.headline { font-size: 17px; font-weight: 400; fill: var(--ink); }
.ftitle, .title { font-size: 13px; font-weight: 700; fill: var(--ink); }
.sub { font-size: 11px; fill: var(--muted); }
.mono { font-family: var(--mono); font-size: 11px; fill: var(--ink); }
.mono.dim { fill: var(--muted); }
.over { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.cobalt-text { fill: var(--cobalt); }
.vermilion-text { fill: var(--vermilion); }
.halo { paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }

.edge { fill: none; stroke: var(--wire); stroke-width: 1.2; }
.edge.thin { stroke: var(--rule); stroke-width: 1; }
.edge.reads { stroke-dasharray: 4 3; }
.edge.cobalt { stroke: var(--cobalt); }
.edge.vermilion { stroke: var(--vermilion); }
.elabel { font-size: 11px; fill: var(--muted); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; } /* the halo clears a screen's dots under the glyphs */
.elabel.mono { font-family: var(--mono); }
.mark { fill: var(--card); stroke: var(--ink); stroke-width: 1; }
.mark-ink { fill: none; stroke: var(--ink); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.step-dot { fill: var(--card); stroke: var(--ink); stroke-width: 1; }
.step-n { font-family: var(--mono); font-size: 11px; fill: var(--ink); }
.accent { display: none; }
.logo { color: var(--ink); }
/* a logo in its brand colours, or its one-ink copy in a theme where the colours do not read (registry) */
.logo .lm, .logo[data-light="mono"] .lc { display: none; }
.logo[data-light="mono"] .lm { display: inline; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .logo .lc { display: inline; }
  :root:not([data-theme="light"]) .logo .lm { display: none; }
  :root:not([data-theme="light"]) .logo[data-dark="mono"] .lc { display: none; }
  :root:not([data-theme="light"]) .logo[data-dark="mono"] .lm { display: inline; }
}
:root[data-theme="dark"] .logo .lc { display: inline; }
:root[data-theme="dark"] .logo .lm { display: none; }
:root[data-theme="dark"] .logo[data-dark="mono"] .lc { display: none; }
:root[data-theme="dark"] .logo[data-dark="mono"] .lm { display: inline; }


/* ---- the board style (Sheet(svg, {style: 'board'})): the same drawing, set as soft panels on a cool
   canvas. Outermost frames are white panels, the levels inside alternate with the canvas tone; cards are
   rounded with a hairline and a faint lift; a card's accent bar names its role; steps are filled badges.
   Geometry, type sizes and every check are the sheet style's. */
:root[data-style="board"] {
  --paper: #f2f4f7; --panel: #ffffff; --inset: #f2f4f7; --card: #ffffff; --pkg: #e8ebf0;
  --ink: #17203a; --wire: #5b6579; --rule: #c4cad4; --line: #d6dbe3; --hair: #dfe3e9; --muted: #565f72;
  --cobalt: #2f5bd8; --vermilion: #c2410c; --teal: #0e8a7d; --violet: #7c4ddb; --amber: #b7791f;
  --lift: rgba(16, 24, 40, 0.07);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root[data-style="board"]:not([data-theme="light"]) {
    --paper: #0e1116; --panel: #161a21; --inset: #0e1116; --card: #1d222b; --pkg: #2b313d;
    --ink: #e8ebf1; --wire: #9aa4b5; --rule: #444c5b; --line: #31384a; --hair: #2a303b; --muted: #a7b0bf;
    --cobalt: #8fa8ff; --vermilion: #ff8a5c; --teal: #3cc8b8; --violet: #b197fc; --amber: #f0b44c;
    --lift: rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-style="board"][data-theme="dark"] {
  --paper: #0e1116; --panel: #161a21; --inset: #0e1116; --card: #1d222b; --pkg: #2b313d;
  --ink: #e8ebf1; --wire: #9aa4b5; --rule: #444c5b; --line: #31384a; --hair: #2a303b; --muted: #a7b0bf;
  --cobalt: #8fa8ff; --vermilion: #ff8a5c; --teal: #3cc8b8; --violet: #b197fc; --amber: #f0b44c;
  --lift: rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}
:root[data-style="board"] .frame { rx: 12px; stroke: var(--line); }
:root[data-style="board"] .frame.band-open, :root[data-style="board"] .frame.band-paper { fill: var(--panel); }
:root[data-style="board"] .frame.band-tint { fill: var(--inset); }
:root[data-style="board"] .knock.k-open, :root[data-style="board"] .knock.k-even { fill: var(--panel); }
:root[data-style="board"] .knock.tint { fill: var(--inset); }
:root[data-style="board"] .card { rx: 8px; stroke: var(--line); filter: drop-shadow(0 1px 1.5px var(--lift)); }
:root[data-style="board"] .legend .card { filter: none; }
:root[data-style="board"] .legend .card { rx: 4px; }
:root[data-style="board"] .legend .region { stroke-dasharray: none; rx: 4px; }
:root[data-style="board"] .phantom { stroke: var(--wire); stroke-dasharray: 10 3 2 3; }
:root[data-style="board"] .card.phantom { stroke: var(--wire); }
:root[data-style="board"] .outline { rx: 10px; }
:root[data-style="board"] .region { rx: 12px; stroke-width: 1.5; stroke-dasharray: 6 4; }
:root[data-style="board"] .edge { stroke-width: 1.4; }
:root[data-style="board"] .elabel { stroke: none; }
:root[data-style="board"] .headline { font-size: 19px; font-weight: 700; }
:root[data-style="board"] .accent { display: inline; }
:root[data-style="board"] .accent.teal { fill: var(--teal); }
:root[data-style="board"] .accent.violet { fill: var(--violet); }
:root[data-style="board"] .accent.amber { fill: var(--amber); }
:root[data-style="board"] .step-dot { fill: var(--cobalt); stroke: none; }
:root[data-style="board"] .step-n { font-family: var(--sans); font-weight: 700; fill: var(--panel); }
:root[data-style="board"] .seg { border-color: var(--line); border-radius: 999px; }
:root[data-style="board"] .seg button + button { border-left-color: var(--line); }
/* /sheet:css */
</style>
</head>
<body>
<div class="stage">
  <figure>
    <svg class="sheet" id="d" viewBox="0 0 1200 784" role="img" aria-label="Inside the semantic agent, in the order a question travels. A caller asks ADK's Runner, which keeps sessions in the metadata DB outside the cluster and hands the question to the LlmAgent in agent.py. The agent calls the model through model.py; the model, hatched, is the only part that is not code: it chooses the tool and its arguments. The agent calls tools.py; query_metrics has metrics.py check the request against the catalog and MetricFlow's engine compile the SQL, read as agent_metrics from silver and semantic; every result passes through guard.py, ADK's after_tool_callback, outside the toolset: it attaches the freshness of the result's metrics from the readiness ledger, read as agent_metrics, then inserts one row into ops.agent_queries as agent_audit, and withholds the result if it cannot. Agents outside ADK, such as Claude or Gemini CLI, reach the same tools over MCP: an MCP client presents its bearer token to mcp_server.py, a process of its own that make agent-mcp runs with uv and the agent image leaves out, which calls tools.py and hands every data result to guard.py's guarded, the code ADK's callback runs, so its audit row names the agent the token names. An initContainer runs dbt parse and build_catalog.py into target/, which holds the catalog. A chain line marks the toolset the work platform replaces with DataAgentToolset. The eval runs the agent and a text-to-SQL baseline, which reads gold and exposed as agent_sql, on ADK's LocalEvalService."></svg>
  </figure>
</div>

/* sheet:js */
/* draw-architecture: the drawing API. bin/build.cjs inlines this file into each diagram between the
   sheet:js markers; edit it here, never in a copy. SKILL.md documents the calls. */
function Sheet(svg, opt = {}) {
  const NS = 'http://www.w3.org/2000/svg';
  // the one logo size on a sheet, in user units: 14 in the sheet style, 20 on the board, where colour
  // carries more of the picture
  const LOGO = opt.style === 'board' ? 20 : 14;
  const INSET = 8; // a card's logo slot: this far in from its right edge, centred on its first text row
  const modes = opt.modes ?? [];
  const ids = modes.map(m => m.id);
  let mode = ids[0] ?? null;
  const logos = opt.logos ?? {};
  const swaps = []; // run in creation order on every mode change
  const phantoms = []; // chain-line outlines that go solid in opt.solidIn
  const frames = []; // every frame, for the depth banding done() applies
  const knocks = []; // every knock-out, painted by done() to match what lies behind each half
  const edges = []; // every edge, for the bridges done() draws where two cross
  const HOP = 4; // a bridge's radius
  const HEAD = [24, 32]; // the headline's baseline start; the drawing starts at TOP or below
  const TOP = 64;
  const steps = []; // numbered step badges, raised above every edge by done()
  // The style: 'sheet' (ink on paper, the default) or 'board' (soft panels, accent bars, filled step
  // badges). Only the stylesheet changes: every call, coordinate and check is the same in both.
  const style = opt.style ?? 'sheet';
  if (!['sheet', 'board'].includes(style)) throw new Error(`draw-architecture: no style "${style}" (sheet or board)`);
  document.documentElement.dataset.style = style;

  const isModal = v => v !== null && typeof v === 'object' && !Array.isArray(v) && ids.some(i => i in v);
  const pick = v => (isModal(v) ? v[mode] : v);
  const el = (tag, attrs = {}, parent = svg) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) if (v !== undefined && v !== null) n.setAttribute(k, v);
    (parent ?? svg).appendChild(n);
    return n;
  };
  const text = (parent, x, y, s, cls, attrs = {}) => {
    const t = el('text', { x, y, class: cls, ...attrs }, parent);
    const set = () => { t.textContent = pick(s) ?? ''; };
    set();
    if (isModal(s)) swaps.push(set);
    return t;
  };
  const len = t => (t.textContent ? t.getBBox().width : 0); // the glyphs' box, wider than the advance in some fonts
  // A knock-out: the patch of a line a title sits on, in two halves (above and below the line), so each
  // half takes the fill of whatever surrounds it once done() knows the banding.
  const knock = (y, parent = svg, before = null) => {
    const g = document.createElementNS(NS, 'g');
    parent.insertBefore(g, before);
    const halves = [el('rect', { y: y - 8, height: 8, class: 'knock' }, g), el('rect', { y, height: 8, class: 'knock' }, g)];
    knocks.push(...halves);
    return { set: (x, w) => halves.forEach(r => { r.setAttribute('x', x); r.setAttribute('width', w); }) };
  };

  // A logo: a registry mark in a fixed 14-unit box, drawn only through a card's or a frame's slot.
  const logo = (parent, id, slot) => {
    const box = el('svg', { width: LOGO, height: LOGO, viewBox: '0 0 24 24', class: 'logo', 'data-slot': slot }, parent);
    const set = () => {
      const now = pick(id);
      if (now && !logos[now]) throw new Error(`draw-architecture: no logo "${now}" in the registry`);
      // both copies are drawn; the sheet's CSS shows the colour one, or the one-ink copy in a theme where
      // the registry measured the colours as not reading against the card
      box.innerHTML = now ? `<g class="lc">${logos[now].body}</g><g class="lm">${logos[now].mono}</g>` : '';
      if (now) Object.assign(box.dataset, { logo: now, light: logos[now].light, dark: logos[now].dark });
      else box.removeAttribute('data-logo');
      box.style.display = now ? '' : 'none';
    };
    set();
    if (isModal(id)) swaps.push(set);
    return { box, present: () => !!pick(id) };
  };

  const defs = el('defs');
  for (const [id, color] of [['ink', 'wire'], ['cobalt', 'cobalt'], ['vermilion', 'vermilion'], ['rule', 'rule']]) {
    const m = el('marker', { id: `arrow-${id}`, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs);
    el('path', { d: 'M1,1.5 L9,5 L1,8.5 z' }, m).style.fill = `var(--${color})`;
  }
  const hatch = el('pattern', { id: 'hatch', patternUnits: 'userSpaceOnUse', width: 7, height: 7, patternTransform: 'rotate(45)' }, defs);
  el('line', { x1: 0, y1: 0, x2: 0, y2: 7, class: 'hatch-line' }, hatch);
  // the depth screen: a fine dot on paper, tiled in the sheet's own units so every screened area and
  // every knock-out half on one lines up dot for dot
  const screen = el('pattern', { id: 'screen', patternUnits: 'userSpaceOnUse', width: 6, height: 6 }, defs);
  el('rect', { width: 6, height: 6, class: 'screen-bg' }, screen);
  el('circle', { cx: 3, cy: 3, r: 0.75, class: 'screen-dot' }, screen);

  // The headline: the one line above the drawing that says the question the sheet answers, or its
  // takeaway; drawn first, at the top left, so the drawing starts below it (the checker holds the rest).
  if (opt.headline !== undefined) text(svg, HEAD[0], HEAD[1], opt.headline, 'headline');

  // A frame: no fill; [logo] title and note knocked into its top line, or its bottom line with
  // edge: 'bottom' (a title block, for a frame that edges enter from above).
  const frame = ({ x, y: top, w, h, title, note, logo: id, edge: side = 'top' }) => {
    const y = side === 'bottom' ? top + h : top;
    frames.push({ x, y: top, w, h, rect: el('rect', { x, y: top, width: w, height: h, rx: 2, class: 'frame' }) });
    const k = knock(y);
    const g = el('g');
    const lg = id ? logo(g, id, 'frame') : null;
    const t = text(g, 0, y + 4.5, title, 'ftitle');
    const n = note ? text(g, 0, y + 4, note, 'sub') : null;
    const fit = () => {

      if (lg?.present()) { lg.box.setAttribute('x', cx); lg.box.setAttribute('y', y - LOGO / 2); cx += LOGO + 6; }
      t.setAttribute('x', cx); cx += len(t);

    };
    fit(); swaps.push(fit);
  };

  // A card: an optional overline (the package a grey card is), a title, then lines: a string is sans,
  // {mono: '...'} is mono; any text may be {<mode>: '...'}. The logo sits in the top-right slot.
  // accent: 'teal' | 'violet' | 'amber' marks the card's role with a bar on its left edge in the board
  // style (the legend says which role each hue is); the sheet style, two pencils only, draws no bar.
  const ACCENTS = ['teal', 'violet', 'amber'];
  const card = ({ x, y, w, h, title = '', lines = [], pkg, hatch: hatched, cls = '', tcls = 'title', logo: id, accent }) => {
    if (accent && !ACCENTS.includes(accent)) throw new Error(`draw-architecture: no accent "${accent}" (${ACCENTS.join(', ')})`);
    const g = el('g');
    const r = el('rect', { x, y, width: w, height: h, rx: 2, class: `card ${pkg ? 'pkg' : ''} ${cls}` }, g);
    if (accent) el('rect', { x: x + 1, y: y + 10, width: 3, height: h - 20, rx: 1.5, class: `accent ${accent}` }, g);
    if (cls.includes('phantom')) phantoms.push(r);
    if (hatched) el('rect', { x: x + 0.5, y: y + 0.5, width: w - 1, height: h - 1, fill: 'url(#hatch)' }, g);
    const halo = hatched ? ' halo' : '';
    let ty = lines.length || pkg ? y + 19 : y + h / 2 + 4.5;
    const row = pkg ? y + 13 : ty - 4.5; // the optical middle of the first text row
    if (pkg) { text(g, x + 12, y + 17, pkg, 'over' + halo); ty = y + 34; }
    text(g, x + 12, ty, title, tcls + halo);
    lines.forEach((line, i) => {
      const y1 = ty + 16 + i * 15;
      const mono = line !== null && typeof line === 'object' && 'mono' in line;
      text(g, x + 12, y1, mono ? line.mono : line, (mono ? 'mono dim' : 'sub') + halo);
    });
    // centred on the first text row, kept 6 inside the card's top (a board's larger logo on an overline)
    if (id) { const lg = logo(g, id, 'card'); lg.box.setAttribute('x', x + w - INSET - LOGO); lg.box.setAttribute('y', Math.max(row - LOGO / 2, y + 6)); }
    return r;
  };

  // A chain-line outline round a group of cards, its label knocked into the top line at the right.
  const phantom = ({ x, y, w, h, label }) => {
    const r = el('rect', { x, y, width: w, height: h, rx: 2, class: 'outline phantom' }); // solid in solidIn: 'outline' alone
    phantoms.push(r);
    if (label) {
      const k = knock(y);
      const t = text(svg, x + w - 16, y + 4.5, label, 'mono', { 'text-anchor': 'end' });
      const fit = () => { const l = len(t); k.set(x + w - 22 - l, l + 12); };
      fit(); swaps.push(fit);
    }

  };

  // A role or trust region: one coloured outline; its title left and its role right, knocked into its
  // top line, or its bottom line with edge: 'bottom' (when the top line sits close under a frame title).
  const region = ({ x, y: top, w, h, tone = '', title, role, edge: side = 'top' }) => {
    const y = side === 'bottom' ? top + h : top;
    el('rect', { x, y: top, width: w, height: h, rx: 2, class: `region ${tone}` });
    const g = el('g');
    const tc = tone ? ` ${tone}-text` : '';

    if (title) parts.push([text(g, x + 12, y + 4.5, title, 'title' + tc), 'start']);
    if (role) parts.push([text(g, x + w - 12, y + 4, role, 'mono' + tc, { 'text-anchor': 'end' }), 'end']);
    for (const [t, side] of parts) {
      const k = knock(y, svg, g);
      const fit = () => { const l = len(t); k.set(side === 'start' ? x + 6 : x + w - 18 - l, l + 12); };

  const edge = (d, o = {}) => {
    const tone = o.tone ?? (o.thin ? 'rule' : 'ink');

    const marker = `url(#arrow-${tone})`;
    edges.push({ d, path: el('path', { d, class: cls, 'marker-end': o.noEnd ? null : marker, 'marker-start': o.both ? marker : null }) });
    for (const l of o.labels ?? (o.label ? [o.label] : [])) {
      const t = text(svg, l.at[0], l.at[1], l.text, `elabel${l.mono ? ' mono' : ''}${o.tone ? ` ${o.tone}-text` : ''}`, { 'text-anchor': l.anchor ?? 'middle' });
      t.dataset.edgeLabel = '1';
    }
  };

  // Marks: a check that runs on every build, drawn on the hop it checks; an equality (parity) mark.
  const tick = (x, y, parent = svg) => {
    el('circle', { cx: x, cy: y, r: 6, class: 'mark' }, parent);
    el('path', { d: `M${x - 3},${y} l2,2.2 l4,-4.4`, class: 'mark-ink' }, parent);
  };
  const equal = (x, y, parent = svg) => {
    el('circle', { cx: x, cy: y, r: 6.5, class: 'mark' }, parent);
    text(parent, x, y + 4, '=', 'mono', { 'text-anchor': 'middle' });
  };
  // A numbered step on the sheet's main path, set on an edge: the numbers carry the order, so the edges
  // need no words. Drawn above every edge (done() raises it).
  const step = (x, y, n, parent = svg) => {
    const g = el('g', { class: 'step' }, parent);
    el('circle', { cx: x, cy: y, r: 9, class: 'step-dot' }, g);
    text(g, x, y + 4, String(n), 'step-n', { 'text-anchor': 'middle' });
    if (parent === svg) steps.push(g);

  };

  // A legend that lays itself out from (x, y), left to right, or top to bottom with {column: true} (in a
  // margin beside the sheet); each item is [kind, label].
  const legend = (x, y0, items, { column = false } = {}) => {
    let y = y0;
    const g = el('g', { class: 'legend' });
    const sw = {
      card: cx => el('rect', { x: cx, y: y - 8, width: 30, height: 16, rx: 2, class: 'card' }, g),
      pkg: cx => el('rect', { x: cx, y: y - 8, width: 30, height: 16, rx: 2, class: 'card pkg' }, g),
      hatch: cx => { el('rect', { x: cx, y: y - 8, width: 30, height: 16, rx: 2, class: 'card' }, g); el('rect', { x: cx + 0.5, y: y - 7.5, width: 29, height: 15, fill: 'url(#hatch)' }, g); },
      phantom: cx => el('path', { d: `M${cx},${y} H${cx + 30}`, class: 'phantom' }, g),
      calls: cx => el('path', { d: `M${cx},${y} H${cx + 30}`, class: 'edge', 'marker-end': 'url(#arrow-ink)' }, g),
      reads: cx => el('path', { d: `M${cx},${y} H${cx + 30}`, class: 'edge reads', 'marker-end': 'url(#arrow-ink)' }, g),

        el('rect', { x: cx, y: y - 8, width: 30, height: 16, rx: 2, class: 'card' }, g);
        el('rect', { x: cx + 3, y: y - 5, width: 3, height: 10, rx: 1.5, class: `accent ${a}` }, g);
      }])),

  };

  // The mode switch: buttons in `bar`, remembered per page, overridden by ?mode=<id>; ?static hides it.
  const setMode = m => {
    mode = m;
    swaps.forEach(f => f());
    phantoms.forEach(r => r.classList.toggle('phantom', m !== opt.solidIn));
    opt.bar?.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));

  };
  // Depth banding: a frame inside an odd number of frames (a second, fourth, ... level) is screened with
  // a fine dot pattern, the levels between stay paper, the outermost have no fill. Frames move beneath
  // everything, outermost first, and each knock-out half takes the fill of the frame it sits in.
  const inside = (a, b) => a !== b && a.x >= b.x && a.y >= b.y && a.x + a.w <= b.x + b.w && a.y + a.h <= b.y + b.h;
  const band = () => {
    for (const f of frames) f.depth = frames.filter(o => inside(f, o)).length;
    for (const f of frames) f.rect.classList.add(f.depth === 0 ? 'band-open' : f.depth % 2 ? 'band-tint' : 'band-paper');
    // each knock-out half is painted like the band it sits on: outside every frame, an outermost frame,
    // an odd level (screened) or an even one; the style decides the fill of each
    const first = svg.querySelector('defs')?.nextSibling ?? svg.firstChild;
    for (const f of [...frames].sort((a, b) => a.depth - b.depth)) svg.insertBefore(f.rect, first);
    for (const r of knocks) {
      const c = { x: +r.getAttribute('x') + 1, y: +r.getAttribute('y') + 4, w: 0, h: 0 };
      const home = frames.filter(f => inside(c, f) || (c.x >= f.x && c.x <= f.x + f.w && c.y > f.y && c.y < f.y + f.h)).sort((a, b) => b.depth - a.depth)[0];
      r.classList.toggle('tint', !!home && home.depth % 2 === 1);
      r.classList.toggle('k-open', !!home && home.depth === 0);
      r.classList.toggle('k-even', !!home && home.depth > 0 && home.depth % 2 === 0);
    }
  };

  // Bridges: where two edges cross at right angles, one hops over the other with a small arc, the way a
  // circuit drawing shows wires that do not join. The horizontal one hops, unless the crossing sits too
  // close to its ends, then the vertical one; a crossing neither can take is reported to the checker.
  const bridge = () => {
    const polys = edges.map(e => {
      const out = []; let cur = null, x = 0, y = 0;
      for (const [, c, a] of e.d.matchAll(/([MLHV])\s*([-\d.,\s]+)/gi)) {
        const n = a.trim().split(/[\s,]+/).map(Number);
        if (/m/i.test(c)) { x = n[0]; y = n[1]; cur = [[x, y]]; out.push(cur); continue; }
        if (/h/i.test(c)) x = n[0]; else if (/v/i.test(c)) y = n[0]; else { x = n[0]; y = n[1]; }
        cur.push([x, y]);
      }
      return out;
    });

    polys.forEach((ps, ei) => ps.forEach((p, pi) => p.slice(1).forEach((b, si) => {
      const a = p[si];
      const o = a[1] === b[1] ? 'h' : a[0] === b[0] ? 'v' : 'o';
      segs.push({ ei, pi, si, a, b, o, hops: [] });
    })));
    const between = (v, a, b, m) => v > Math.min(a, b) + m && v < Math.max(a, b) - m;
    let unbridged = 0;
    for (const s1 of segs) for (const s2 of segs) {
      if (s1.ei >= s2.ei || s1.o === s2.o || s1.o === 'o' || s2.o === 'o') continue;
      const [h, v] = s1.o === 'h' ? [s1, s2] : [s2, s1];
      const px = v.a[0], py = h.a[1];
      if (!between(px, h.a[0], h.b[0], 0.5) || !between(py, v.a[1], v.b[1], 0.5)) continue;
      if (between(px, h.a[0], h.b[0], HOP + 2)) h.hops.push(px);
      else if (between(py, v.a[1], v.b[1], HOP + 2)) v.hops.push(py);
      else unbridged++;
    }
    edges.forEach((e, ei) => {
      let d = '', hops = 0;
      polys[ei].forEach((p, pi) => {
        d += `M${p[0][0]},${p[0][1]}`;
        p.slice(1).forEach((b, si) => {
          const sg = segs.find(q => q.ei === ei && q.pi === pi && q.si === si);
          const a = p[si], dir = sg.o === 'h' ? Math.sign(b[0] - a[0]) : Math.sign(b[1] - a[1]);
          for (const at of [...sg.hops].sort((m, n) => (m - n) * dir)) {
            hops++;
            if (sg.o === 'h') d += ` L${at - HOP * dir},${a[1]} A${HOP},${HOP} 0 0 ${dir > 0 ? 1 : 0} ${at + HOP * dir},${a[1]}`;
            else d += ` L${a[0]},${at - HOP * dir} A${HOP},${HOP} 0 0 ${dir > 0 ? 1 : 0} ${a[0]},${at + HOP * dir}`;
          }
          d += ` L${b[0]},${b[1]}`;
        });
      });
      e.path.setAttribute('d', d);
      e.path.dataset.hops = hops;
    });
    svg.dataset.unbridged = unbridged;
  };

  // done({unmarked: {id: 'why'}}): a technology the sheet names without its logo, and why.
  const done = ({ unmarked = {} } = {}) => {
    band();
    bridge();
    for (const g of steps) svg.appendChild(g);
    const params = new URLSearchParams(location.search);
    if (opt.bar && modes.length > 1) {
      if (params.has('static')) opt.bar.hidden = true;
      const seg = document.createElement('div');
      seg.className = 'seg'; seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', opt.switchLabel ?? 'Which names to show');
      for (const m of modes) {
        const b = document.createElement('button');
        b.type = 'button'; b.dataset.mode = m.id; b.textContent = m.label; b.setAttribute('aria-pressed', String(m.id === mode));
        b.addEventListener('click', () => setMode(m.id));
        seg.appendChild(b);
      }
      opt.bar.appendChild(seg);
      let saved = null;
      try { saved = opt.storageKey ? localStorage.getItem(opt.storageKey) : null; } catch (e) { /* storage off */ }
      const want = params.get('mode') ?? saved;
      if (want && ids.includes(want) && want !== mode) setMode(want);
    }
    window.__sheet = { modes: ids, setMode, mode: () => mode, unmarked, logo: LOGO };
  };

  return { el, text, frame, card, phantom, region, edge, tick, equal, step, legend, done, setMode, LOGO, TOP, style };
}
