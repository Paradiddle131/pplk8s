<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Semantic agent, inside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap">
<style>
/* One level below assets/semantic-track.html: the semantic agent's code (services/semantic-agent/src),
   laid out in the order a question travels, top to bottom.

   The sheet is a draughtsman's: black ink on paper, frames without fill whose title sits in the top line,
   and two coloured pencils that each mean one thing: cobalt for what the agent reads as agent_metrics
   (the governed path), vermilion for what the text-to-SQL baseline reads as agent_sql. Meaning beyond
   that comes from drawing conventions, not colour: hatching marks the model, the one part that is not
   code; a chain (dash-dot) line, a phantom line in drafting, marks what the work platform replaces; a
   grey card is a package's code, a white one this repo's. Text is never smaller than 11 px, so the 2x
   export stays legible when a README scales it down. */
:root {
  --paper: #fbfbf9;
  --card: #ffffff;
  --pkg: #ebeae5;
  --ink: #1b1b1d;
  --rule: #85858b;
  --hair: #cfcec9;
  --muted: #5d5d65;
  --gov: #2f4bc4;
  --raw: #c3421a;
  --sans: "Atkinson Hyperlegible Next", "Segoe UI", sans-serif;
  --mono: "Atkinson Hyperlegible Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141517; --card: #1c1d20; --pkg: #2a2b2f; --ink: #ecebe7; --rule: #7b7b82; --hair: #3a3b40;
    --muted: #a6a6ae; --gov: #93a5ff; --raw: #ff8f6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141517; --card: #1c1d20; --pkg: #2a2b2f; --ink: #ecebe7; --rule: #7b7b82; --hair: #3a3b40;
  --muted: #a6a6ae; --gov: #93a5ff; --raw: #ff8f6b;
  color-scheme: dark;
}
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
.stage { max-width: 1200px; margin: 0 auto; }
figure { margin: 0; overflow-x: auto; }
svg { display: block; width: 100%; height: auto; min-width: 720px; font-family: var(--sans); }
.frame { fill: none; stroke: var(--rule); stroke-width: 1; }
.knock { fill: var(--paper); }
.card { fill: var(--card); stroke: var(--ink); stroke-width: 1; }
.card.pkg { fill: var(--pkg); stroke: none; }
.hatch-line { stroke: var(--hair); stroke-width: 1.2; }
.phantom { fill: none; stroke: var(--ink); stroke-width: 1; stroke-dasharray: 14 3 2 3; }
.role { fill: none; stroke-width: 1.2; }
.role.gov { stroke: var(--gov); }
.role.raw { stroke: var(--raw); }
.ftitle { font-size: 13px; font-weight: 700; fill: var(--ink); }
.title { font-size: 13px; font-weight: 700; fill: var(--ink); }
.sub { font-size: 11px; fill: var(--muted); }
.mono { font-family: var(--mono); font-size: 11px; fill: var(--ink); }
.mono.dim { fill: var(--muted); }
.over { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.halo { paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
.edge { fill: none; stroke: var(--ink); stroke-width: 1.2; }
.edge.reads { stroke-dasharray: 4 3; }
.edge.gov { stroke: var(--gov); }
.edge.raw { stroke: var(--raw); }
.elabel { font-size: 11px; fill: var(--muted); }
.elabel.mono { font-family: var(--mono); }
.elabel.gov { fill: var(--gov); }
.elabel.raw { fill: var(--raw); }
</style>
</head>
<body>
<div class="stage">
  <figure>
    <svg id="d" viewBox="0 0 1200 616" role="img" aria-label="Inside the semantic agent, in the order a question travels. A caller asks ADK's Runner, which keeps sessions in the metadata DB outside the cluster and hands the question to the LlmAgent in agent.py. The agent calls the model through model.py; the model, hatched, is the only part that is not code: it chooses the tool and its arguments. The agent calls tools.py; query_metrics has metrics.py check the request against the catalog and MetricFlow's engine compile the SQL, read as agent_metrics from silver and semantic; freshness.py reads the readiness ledger as agent_metrics. Every result passes through audit.py, ADK's after_tool_callback, which inserts one row into ops.agent_queries as agent_audit and withholds the result if it cannot. An initContainer runs dbt parse and build_catalog.py into target/, which holds the catalog. A chain line marks the toolset the work platform replaces with DataAgentToolset. The eval runs the agent and a text-to-SQL baseline, which reads gold and exposed as agent_sql, on ADK's LocalEvalService."></svg>
  </figure>
</div>
<script>
document.fonts.ready.then(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('d');
  const el = (tag, attrs = {}, parent = svg) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) if (v !== undefined && v !== null) n.setAttribute(k, v);
    parent.appendChild(n); return n;
  };
  const txt = (parent, x, y, s, cls, attrs = {}) => { const t = el('text', { x, y, class: cls, ...attrs }, parent); t.textContent = s; return t; };

  const defs = el('defs');
  for (const [id, cls] of [['arrow', ''], ['arrowGov', 'gov'], ['arrowRaw', 'raw']]) {
    const m = el('marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs);
    const p = el('path', { d: 'M1,1.5 L9,5 L1,8.5 z' }, m);
    p.style.fill = cls ? `var(--${cls})` : 'var(--ink)';
  }
  const hatch = el('pattern', { id: 'hatch', patternUnits: 'userSpaceOnUse', width: 7, height: 7, patternTransform: 'rotate(45)' }, defs);
  el('line', { x1: 0, y1: 0, x2: 0, y2: 7, class: 'hatch-line' }, hatch);

  // A frame: no fill, its title knocked into the top line, an optional note after it.
  const frame = (x, y, w, h, title, note) => {
    el('rect', { x, y, width: w, height: h, rx: 2, class: 'frame' });
    const g = el('g');
    const t = txt(g, x + 16, y + 4.5, title, 'ftitle');
    let end = x + 16 + t.getComputedTextLength();
    if (note) { const n = txt(g, end + 10, y + 4, note, 'mono dim'); end = end + 10 + n.getComputedTextLength(); }
    svg.insertBefore(el('rect', { x: x + 10, y: y - 8, width: end - x - 4, height: 16, class: 'knock' }), g);
  };
  // A card: an optional overline (the package a grey card is), a title, then lines; a string line is
  // sans, {m: '...'} is mono.
  const card = (x, y, w, h, title, lines = [], o = {}) => {
    const g = el('g');
    el('rect', { x, y, width: w, height: h, rx: 2, class: `card ${o.pkg ? 'pkg' : ''}` }, g);
    if (o.hatch) el('rect', { x: x + 0.5, y: y + 0.5, width: w - 1, height: h - 1, fill: 'url(#hatch)' }, g);
    const halo = o.hatch ? ' halo' : '';
    let ty = y + 19;
    if (o.pkg) { txt(g, x + 12, y + 17, o.pkg, 'over'); ty = y + 34; }
    txt(g, x + 12, ty, title, (o.tcls ?? 'title') + halo);
    lines.forEach((line, i) => {
      const y1 = ty + 16 + i * 15;
      if (typeof line === 'string') txt(g, x + 12, y1, line, 'sub' + halo); else txt(g, x + 12, y1, line.m, 'mono dim' + halo);
    });
    return g;
  };
  const edge = (d, o = {}) => {
    const cls = o.cls ?? '';
    const marker = cls.includes('gov') ? 'arrowGov' : cls.includes('raw') ? 'arrowRaw' : 'arrow';
    el('path', { d, class: `edge ${cls}`, 'marker-end': `url(#${marker})` });
    if (o.label) {
      const [lx, ly] = o.label.at;
      txt(svg, lx, ly, o.label.text, `elabel ${o.label.mono ? 'mono' : ''} ${cls.includes('gov') ? 'gov' : cls.includes('raw') ? 'raw' : ''}`, { 'text-anchor': o.label.anchor ?? 'middle' });
    }
  };

  // ---- the caller, outside the pod
  card(24, 74, 112, 52, 'caller', [{ m: 'adk web, curl' }]);
  edge('M136,92 H200', { label: { text: 'asks', at: [160, 86] } });
  edge('M200,112 H136', { label: { text: 'answer', at: [160, 128] } });

  // ---- the pod: three columns, top to bottom in the order a question travels
  frame(184, 32, 700, 412, 'semantic-agent pod', 'adk api_server');
  card(200, 68, 164, 72, 'Runner', [{ m: 'sessions, events' }], { pkg: 'google.adk' });
  card(396, 68, 220, 72, 'semantic_agent', [{ m: 'agent.py' }, { m: 'LlmAgent, 3 tools' }]);
  card(648, 68, 216, 72, 'model.py', [{ m: 'MODEL_BACKEND' }, { m: 'on_model_error_callback' }]);
  edge('M364,100 H396');
  edge('M616,100 H648');
  edge('M282,68 V48 H916', { label: { text: 'sessions', at: [760, 42] } });

  // the audit gate: every tool result passes through it on its way back to the agent
  card(456, 168, 160, 56, 'audit.py', ['no row, no result']);
  edge('M420,140 V252');
  edge('M536,252 V224');
  edge('M536,168 V140', { label: { text: 'after_tool_callback', at: [548, 158], anchor: 'start', mono: true } });
  edge('M616,196 H924', { label: { text: 'insert', at: [770, 190] } });

  // the toolset, which the work platform replaces
  el('rect', { x: 384, y: 240, width: 492, height: 184, rx: 2, class: 'phantom' });
  const pl = txt(svg, 860, 244.5, 'at work: DataAgentToolset', 'mono', { 'text-anchor': 'end' });
  const plw = pl.getComputedTextLength();
  svg.insertBefore(el('rect', { x: 860 - plw - 6, y: 236, width: plw + 12, height: 16, class: 'knock' }), pl);
  card(396, 256, 220, 80, 'tools.py', [{ m: 'list_metrics' }, { m: 'describe_metric' }, { m: 'query_metrics' }]);
  card(648, 256, 216, 56, 'freshness.py', ['the sentence the answer quotes']);
  card(396, 348, 220, 64, 'metrics.py', ['checks a request against', 'the catalog']);
  card(648, 348, 216, 64, 'MetricFlowEngine', ['compiles the SQL'], { pkg: 'metricflow' });
  edge('M616,284 H648');
  edge('M506,336 V348');
  edge('M616,380 H648');
  edge('M864,284 H924', { cls: 'reads gov' });
  edge('M864,380 H924', { cls: 'reads gov', label: { text: 'SQL', at: [897, 374] } });

  // the initContainer: the catalog the toolset reads, built for the database the pod reads
  frame(192, 168, 172, 260, 'initContainer');
  card(200, 188, 152, 64, 'dbt parse', [{ m: 'manifests' }], { pkg: 'dbt-core' });
  card(200, 272, 152, 52, 'build_catalog.py', ["MetricFlow's engine"]);
  card(200, 344, 152, 72, 'target/', [{ m: 'agent.json' }, { m: 'semantic_manifest' }]);
  edge('M276,252 V272');
  edge('M276,324 V344');
  edge('M352,380 H396');

  // ---- outside the cluster
  frame(900, 16, 276, 556, 'outside the cluster');
  card(916, 28, 244, 40, 'metadata DB', [], {});
  txt(svg, 1148, 47, 'agent_sessions', 'mono dim', { 'text-anchor': 'end' });
  card(916, 76, 244, 66, 'the model', [{ m: 'OpenRouter :free, Gemini' }, 'chooses the tool and its arguments'], { hatch: true });
  edge('M864,100 H916');

  frame(908, 160, 260, 404, 'warehouse', 'IAM at work');
  el('rect', { x: 916, y: 172, width: 244, height: 64, rx: 2, class: 'role' }).style.stroke = 'var(--muted)';
  card(924, 178, 228, 36, 'ops.agent_queries', [], { tcls: 'mono' });
  txt(svg, 1152, 228, 'agent_audit: insert only', 'mono dim', { 'text-anchor': 'end' });
  el('rect', { x: 916, y: 252, width: 244, height: 168, rx: 2, class: 'role gov' });
  card(924, 258, 228, 52, 'ops.readiness', [{ m: 'ops.product_deadlines' }], { tcls: 'mono' });
  card(924, 360, 228, 40, 'silver, semantic', [], { tcls: 'mono' });
  txt(svg, 1152, 338, 'agent_metrics: read-only', 'mono', { 'text-anchor': 'end' }).style.fill = 'var(--gov)';
  el('rect', { x: 916, y: 484, width: 244, height: 68, rx: 2, class: 'role raw' });
  card(924, 492, 228, 40, 'gold, exposed', [], { tcls: 'mono' });
  txt(svg, 1152, 546, 'agent_sql: read-only', 'mono', { 'text-anchor': 'end' }).style.fill = 'var(--raw)';

  // ---- the eval, in-process
  frame(24, 468, 860, 104, 'eval', 'make agent-eval, in-process');
  card(40, 492, 196, 64, 'evaluation.py', ['three custom metrics']);
  card(268, 492, 196, 64, 'LocalEvalService', ['runs both agents'], { pkg: 'google.adk' });
  card(496, 492, 260, 64, 'sql_baseline', ['reuses model.py, audit.py, the catalog']);
  edge('M236,524 H268');
  edge('M464,524 H496');
  edge('M384,492 V444', { label: { text: 'runs semantic_agent', at: [392, 460], anchor: 'start' } });
  edge('M756,512 H924', { cls: 'reads raw', label: { text: 'execute_sql', at: [836, 506], mono: true } });

  // ---- legend
  const ly = 596;
  const li = (x, draw, label) => { draw(x); txt(svg, x + 40, ly + 4, label, 'sub'); };
  li(24, x => el('rect', { x, y: ly - 8, width: 30, height: 16, rx: 2, class: 'card' }), "this repo's code");
  li(176, x => el('rect', { x, y: ly - 8, width: 30, height: 16, rx: 2, class: 'card pkg' }), 'a package');
  li(300, x => { el('rect', { x, y: ly - 8, width: 30, height: 16, rx: 2, class: 'card' }); el('rect', { x: x + 0.5, y: ly - 7.5, width: 29, height: 15, fill: 'url(#hatch)' }); }, 'the model: the only part that is not code');
  li(620, x => el('path', { d: `M${x},${ly} H${x + 30}`, class: 'phantom' }), 'replaced at work');
  li(780, x => el('path', { d: `M${x},${ly} H${x + 30}`, class: 'edge', 'marker-end': 'url(#arrow)' }), 'calls, writes');
  li(924, x => el('path', { d: `M${x},${ly} H${x + 30}`, class: 'edge reads', 'marker-end': 'url(#arrow)' }), 'reads');
});
</script>
</body>
</html>
