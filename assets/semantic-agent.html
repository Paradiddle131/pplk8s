<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Semantic agent, inside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* One level below assets/semantic-track.html: the semantic agent's code (services/semantic-agent/src) and
   what it reuses. The same chrome as the track diagram, with two additions: a card tinted like a zone
   is a package's code, not this repo's, and a tab on a card names the package it is or calls. A card
   with a blue dashed border is a seam the work platform swaps. The hook edges, in the metrics colour,
   are the extension points the packages offer; each card's second and third lines name them. */
:root {
  --bg: #f4f5f8;
  --zone: #eaedf2;
  --zone-2: #e6ebf4;
  --card: #ffffff;
  --line: #aab2c0;
  --hair: #cfd5df;
  --fg: #1a2030;
  --muted: #5b6577;
  --metrics: #0f766e;
  --sql: #b45309;
  --gcp: #1a56c4;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --zone: #171b23; --zone-2: #1d2636; --card: #1e242f; --line: #46505f; --hair: #2f3745;
    --fg: #e8ebf1; --muted: #9aa3b5; --metrics: #5fd3c4; --sql: #e8a94a; --gcp: #7aa7ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --zone: #171b23; --zone-2: #1d2636; --card: #1e242f; --line: #46505f; --hair: #2f3745;
  --fg: #e8ebf1; --muted: #9aa3b5; --metrics: #5fd3c4; --sql: #e8a94a; --gcp: #7aa7ff;
  color-scheme: dark;
}
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
.stage { max-width: 1200px; margin: 0 auto; }
figure { margin: 0; overflow-x: auto; }
svg { display: block; width: 100%; height: auto; min-width: 720px; font-family: var(--sans); }
.zone { fill: var(--zone); stroke: var(--hair); stroke-width: 1; }
.card { fill: var(--card); stroke: var(--line); stroke-width: 1; }
.card.pkg { fill: var(--zone-2); }
.card.ghost { fill: none; stroke: var(--muted); stroke-dasharray: 3 3; }
.card.seam { stroke: var(--gcp); stroke-width: 1.3; stroke-dasharray: 6 3; }
.tab { fill: var(--card); stroke: var(--line); stroke-width: 1; }
.tabtext { font-family: var(--mono); font-size: 8px; fill: var(--muted); }
.ztitle { font-size: 12px; font-weight: 600; fill: var(--fg); }
.title { font-size: 11.5px; font-weight: 600; fill: var(--fg); }
.sub { font-size: 9px; fill: var(--muted); }
.mono { font-family: var(--mono); font-size: 9.5px; fill: var(--fg); }
.mono.dim { font-size: 9px; fill: var(--muted); }
.mono.xs { font-size: 8.5px; }
.ico { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.edge { fill: none; stroke: var(--muted); stroke-width: 1.3; }
.edge.reads { stroke-dasharray: 3 3; }
.edge.hook { stroke: var(--metrics); }
.edge.sql { stroke: var(--sql); }
.elabel { font-size: 9px; fill: var(--muted); }
</style>
</head>
<body>
<div class="stage">
  <figure>
    <svg id="d" viewBox="0 0 1200 740" role="img" aria-label="Inside the semantic agent: at build time the dbt project's semantic YAML is parsed into manifests, from which build_catalog.py writes the agent catalog and a data agent's context with MetricFlow's engine, and the agent_warehouse macro creates the agent roles and the audit table; in the pod an ADK LlmAgent carries three function tools, a model seam and two callbacks; query_metrics checks every part of a request against the catalog, builds a MetricFlowQueryRequest and runs it on MetricFlow's engine as the agent_metrics role, freshness.py reads the readiness ledger, and audit.py inserts one row per query as agent_audit; the eval runs the agent and a text-to-SQL baseline on ADK's LocalEvalService with three custom metrics."></svg>
  </figure>
</div>
<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('d');
  const el = (tag, attrs = {}, parent = svg) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) if (v !== undefined && v !== null) n.setAttribute(k, v);
    parent.appendChild(n); return n;
  };
  const txt = (parent, x, y, s, cls, attrs = {}) => { const t = el('text', { x, y, class: cls, ...attrs }, parent); t.textContent = s; return t; };

  const defs = el('defs');
  for (const [id, color] of [['arrow', 'var(--muted)'], ['arrowM', 'var(--metrics)'], ['arrowS', 'var(--sql)']]) {
    const m = el('marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs);
    el('path', { d: 'M1,1 L9,5 L1,9 z', fill: color }, m);
  }

  const icons = {
    db: (g, x, y) => { el('ellipse', { cx: x + 7, cy: y + 3.5, rx: 6, ry: 2.6, class: 'ico' }, g); el('path', { d: `M${x + 1},${y + 3.5} V${y + 11} a6,2.6 0 0 0 12,0 V${y + 3.5}`, class: 'ico' }, g); },
    doc: (g, x, y) => { el('path', { d: `M${x + 2},${y + 1} h7 l3,3 v9 h-10 z M${x + 9},${y + 1} v3 h3 M${x + 4.5},${y + 7} h5 M${x + 4.5},${y + 10} h5`, class: 'ico' }, g); },
    check: (g, x, y) => { el('path', { d: `M${x + 2.5},${y + 7.5} l3,3 l6,-7`, class: 'ico' }, g); },
    chat: (g, x, y) => { el('path', { d: `M${x + 2},${y + 2} h10 v7 h-5.5 l-2.5,2.5 v-2.5 h-2 z`, class: 'ico' }, g); },
    box: (g, x, y) => { el('path', { d: `M${x + 2},${y + 4} l5,-2.5 l5,2.5 v6.5 l-5,2.5 l-5,-2.5 z M${x + 2},${y + 4} l5,2.5 l5,-2.5 M${x + 7},${y + 6.5} v6.5`, class: 'ico' }, g); },
  };

  const zone = (x, y, w, h, title, note) => {
    el('rect', { x, y, width: w, height: h, rx: 8, class: 'zone' });
    const t = txt(svg, x + 12, y + 20, title, 'ztitle');
    if (note) txt(svg, x + 12 + title.length * 7.2 + 8, y + 20, note, 'mono dim');
  };
  // A card: a title, up to two more lines (a string is sans, {m: '...'} is mono), an optional tab naming a package.
  const card = (x, y, w, h, title, lines = [], o = {}) => {
    const g = el('g');
    el('rect', { x, y, width: w, height: h, rx: 5, class: `card ${o.cls ?? ''}` }, g);
    let tx = x + 10;
    if (o.icon) { icons[o.icon](g, tx - 2, y + 8); tx += 18; }
    txt(g, tx, y + 17, title, o.tcls ?? 'title');
    lines.forEach((line, i) => {
      const y1 = y + 31 + i * 13;
      if (typeof line === 'string') txt(g, tx, y1, line, 'sub'); else txt(g, tx, y1, line.m, `mono dim ${line.cls ?? ''}`);
    });
    if (o.tab) {
      const tw = o.tab.length * 5 + 12;
      el('rect', { x: x + w - tw - 8, y: y - 8, width: tw, height: 15, rx: 7.5, class: 'tab' }, g);
      txt(g, x + w - 8 - tw / 2, y + 3, o.tab, 'tabtext', { 'text-anchor': 'middle' });
    }
    return g;
  };
  const edge = (d, o = {}) => {
    const p = el('path', { d, class: `edge ${o.cls ?? ''}`, 'marker-end': `url(#${o.marker ?? 'arrow'})` });
    if (o.label) { const [lx, ly] = o.label.at; txt(svg, lx, ly, o.label.text, o.label.cls ?? 'elabel', { 'text-anchor': o.label.anchor ?? 'middle' }); }
    return p;
  };

  // ---- build time: the dbt project
  zone(28, 36, 832, 170, 'dbt project', 'build time · make dbt-catalog · make agent-warehouse');
  card(40, 72, 172, 44, 'semantic YAML', ['models/silver · models/semantic'], { icon: 'doc' });
  card(232, 72, 170, 44, 'dbt parse', [{ m: 'manifest · semantic_manifest' }], { cls: 'pkg', tab: 'dbt-core' });
  card(424, 72, 180, 44, 'build_catalog.py', [{ m: 'explain() → SQL · dimensions' }], { tab: 'metricflow' });
  card(626, 58, 160, 30, 'data agent context', [], { tcls: 'title' });
  card(626, 96, 160, 30, 'agent.json', [], { tcls: 'mono' });
  card(40, 132, 362, 44, 'checks on parse', [{ m: 'check_standard · check_catalog · matches_metric' }], { icon: 'check' });
  card(424, 132, 180, 44, 'agent_warehouse', [{ m: 'macro · adapter.dispatch' }]);
  edge('M212,94 H232');
  edge('M402,94 H424');
  edge('M604,94 H614 V73 H626');
  edge('M604,94 H614 V111 H626');
  edge('M604,154 H902', { label: { text: 'dbt run-operation', at: [753, 148] } });

  // ---- run time: the agent pod
  zone(28, 226, 832, 340, 'semantic agent pod', 'adk api_server · initContainer: dbt parse → build_catalog.py, into target/');
  card(40, 270, 165, 52, 'ADK runtime', ['Runner · sessions · events'], { cls: 'pkg', tab: 'google.adk' });
  el('rect', { x: 40, y: 334, width: 165, height: 26, rx: 4, class: 'card ghost' });
  txt(svg, 122, 351, 'agent_sessions · metadata DB', 'mono dim xs', { 'text-anchor': 'middle' });
  edge('M120,322 V334');
  const ag = card(235, 270, 190, 86, 'semantic_agent', [{ m: 'agent.py · LlmAgent' }], { icon: 'chat', tab: 'google.adk' });
  [['model = build_model()', 316], ['tools = 3 × FunctionTool', 329], ['after_tool_callback', 342], ['on_model_error_callback', 355]].forEach(([s, y]) => {
    txt(ag, 263, y - 4, s, `mono ${s.includes('callback') ? '' : 'dim'}`).style.fill = s.includes('callback') ? 'var(--metrics)' : '';
  });
  card(465, 270, 170, 86, 'model.py', [{ m: 'LiteLlm | Gemini' }, 'retries · timeout', 'a failure → an answer'], { cls: 'seam', tab: 'google.adk' });
  card(665, 270, 180, 52, 'model API', [{ m: 'OpenRouter :free · Gemini' }], { cls: 'ghost' });
  card(40, 380, 165, 64, 'audit.py', [{ m: 'insert as agent_audit' }, 'unwritable → result withheld'], { cls: '' });
  card(235, 380, 190, 64, 'tools.py', [{ m: 'list_metrics · describe_metric' }, { m: 'query_metrics' }]);
  card(465, 380, 180, 64, 'metrics.py', [{ m: 'Catalog · MetricQuery' }, { m: '→ MetricFlowQueryRequest' }], { tab: 'metricflow' });
  card(665, 380, 180, 64, 'MetricFlowEngine', ['set up as the mf CLI does', { m: 'query() · explain()' }], { cls: 'pkg seam', tab: 'metricflow' });
  card(235, 470, 190, 52, 'freshness.py', ['ledger → one statement'], { icon: 'box' });

  edge('M205,296 H235');
  edge('M425,309 H465', { cls: 'hook', marker: 'arrowM' });
  edge('M425,348 H465', { cls: 'hook', marker: 'arrowM' });
  edge('M330,356 V380', { cls: 'hook', marker: 'arrowM' });
  edge('M235,335 H222 V370 H120 V380', { cls: 'hook', marker: 'arrowM' });
  edge('M635,296 H665');
  edge('M425,412 H465');
  edge('M645,412 H665', { cls: 'hook', marker: 'arrowM' });
  edge('M330,444 V470');
  edge('M845,412 H902', { cls: 'reads hook', marker: 'arrowM', label: { text: 'SQL', at: [873, 406] } });
  edge('M425,496 H902', { cls: 'reads hook', marker: 'arrowM' });
  edge('M120,444 V540 H902');

  // ---- the warehouse
  zone(890, 36, 282, 600, 'warehouse');
  icons.db(svg, 1140, 46);
  card(902, 132, 258, 44, 'roles', [{ m: 'agent_metrics · agent_sql · agent_audit' }], { cls: 'seam' });
  txt(svg, 902, 196, 'each agent gets a read-only role;', 'sub');
  txt(svg, 902, 208, 'the audit writer may only insert', 'sub');
  card(902, 392, 258, 40, 'silver · semantic', [{ m: 'read as agent_metrics' }]);
  card(902, 476, 258, 40, 'ops.readiness · product_deadlines', [{ m: 'read as agent_metrics' }]);
  card(902, 520, 258, 40, 'ops.agent_queries', [{ m: 'one row per query, as agent_audit' }]);
  card(902, 580, 258, 40, 'gold · exposed', [{ m: 'read as agent_sql' }]);

  // ---- the eval
  zone(28, 600, 832, 100, 'eval', 'make agent-eval · both agents in-process, same model, same questions');
  card(40, 636, 270, 52, 'evaluation.py', [{ m: 'answer_correct · metric_choice · freshness_quoted', cls: 'xs' }]);
  card(330, 636, 170, 52, 'LocalEvalService', ['runs both agents'], { cls: 'pkg', tab: 'google.adk' });
  card(520, 636, 230, 52, 'sql_baseline', [{ m: 'execute_sql · never deployed' }]);
  edge('M310,662 H330');
  edge('M500,662 H520');
  edge('M750,662 H875 V600 H902', { cls: 'reads sql', marker: 'arrowS' });

  // ---- legend
  const ly = 722;
  const li = (x, draw, label) => { draw(x); txt(svg, x + 40, ly + 3.5, label, 'elabel'); };
  li(28, x => el('rect', { x, y: ly - 7, width: 30, height: 14, rx: 3, class: 'card' }), 'this repo');
  li(110, x => el('rect', { x, y: ly - 7, width: 30, height: 14, rx: 3, class: 'card pkg' }), 'a package');
  li(200, x => el('rect', { x, y: ly - 7, width: 30, height: 14, rx: 3, class: 'card seam' }), 'swapped at work: Gemini, DataAgentToolset, IAM');
  li(480, x => el('path', { d: `M${x},${ly} H${x + 30}`, class: 'edge hook', 'marker-end': 'url(#arrowM)' }), 'a hook the package offers');
  li(650, x => el('path', { d: `M${x},${ly} H${x + 30}`, class: 'edge reads', 'marker-end': 'url(#arrow)' }), 'reads');
  li(730, x => el('path', { d: `M${x},${ly} H${x + 30}`, class: 'edge', 'marker-end': 'url(#arrow)' }), 'writes');
})();
</script>
</body>
</html>
