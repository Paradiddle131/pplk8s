    (ISO, from Monday) or ''month'', starting on period_start; for the whole period (slice ''total'') or, on days,
    for one value of one dimension (slice names it, slice_value holds it). Read a number from exactly one row and
    never SUM or AVG these columns over rows; for another span, each column''s description says how to combine the
    daily tables'' additive columns, or that it cannot.'
  config:
    meta:
      governed:
        kind: by_period
        home: leads
        metrics:
        - lead_to_booking_rate
        - leads_mtd
        - leads_wow_growth
  columns:
  - name: grain
    description: 'The period''s length: day, week (ISO, Monday to Sunday) or month.'
  - name: period_start
    description: The period's first day.
  - name: slice
    description: '''total'' for the whole period, else (days only) the dimension the row breaks the metrics down
      by: one of campaign__campaign_name, campaign__channel, campaign__market, lead__country.'
  - name: slice_value
    description: The value of the slice's dimension on this row; NULL on a total row.
  - name: lead_to_booking_rate
    description: 'Lead-to-booking rate: Share of leads that booked within 30 days of being created, counted on the
      lead''s creation day. Not additive: never SUM or AVG it over rows. No additive form: read it from one row
      only, at the grain and slice asked; a span that is not one day, ISO week or calendar month is not available
      here.'
  - name: leads_mtd
    description: 'Leads month to date: Leads from the first of the month up to and including each day (month to
      date); group by metric_time__day and read the day asked. Grouped by week or month it is the count up to that
      period''s last day. Not additive: never SUM or AVG it over rows. As of another day: SUM(leads) of governed.leads_daily
      from the first day of the month to the day asked.'
  - name: leads_wow_growth
    description: 'Leads week-over-week growth: Leads'' change from the week before, as a share of that week''s leads
      (0.10 is 10 % more); group by metric_time__week to compare whole weeks. Empty where either week has no leads.
      Not additive: never SUM or AVG it over rows. Over another span: ((SUM(leads) of governed.leads_daily) - (SUM(leads)
      of governed.leads_daily, 1 week earlier)) / (SUM(leads) of governed.leads_daily, 1 week earlier), each over
      the same span.'
- name: gov_leads_daily
  description: 'Governed leads metrics by day: one row per day (metric_time__day) and combination of campaign__campaign_name,
    campaign__channel, campaign__market, lead__country, every number computed by MetricFlow from the semantic layer''s
