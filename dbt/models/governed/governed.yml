  columns:
  - name: metric_time__day
    description: The day (UTC) the metrics on this row count, each metric's own time dimension.
  - name: campaign__campaign_name
    description: The campaign's name.
  - name: campaign__channel
    description: Marketing channel (search, social, display, email, partner).
  - name: campaign__market
    description: ISO-2 country the campaign targets.
  - name: lead__country
    description: ISO-2 country of the lead.
  - name: leads
    description: 'Leads: CRM leads created, on the day they were created. Additive: SUM it over any days and dimension
