- name: gov_orders_by_period
  description: 'Governed orders metrics that do not add up (ratios, distinct counts, averages, balances, running
    totals, conversion rates, growth), each computed by MetricFlow for one whole period: grain ''day'', ''week''
    (ISO, from Monday) or ''month'', starting on period_start; for the whole period (slice ''total'') or, on days,
    for one value of one dimension (slice names it, slice_value holds it). Read a number from exactly one row and
    never SUM or AVG these columns over rows; for another span, each column''s description says how to combine the
    daily tables'' additive columns, or that it cannot.'
  config:
    meta:
      governed:
        kind: by_period
        home: orders
        metrics:
        - average_order_value_eur
        - cancellation_rate
        - customers_distinct
        - median_order_value_eur
        - repeat_customers
        - repeat_revenue_share
        - revenue_eur_mtd
        - revenue_eur_wow_growth
  columns:
  - name: grain
    description: 'The period''s length: day, week (ISO, Monday to Sunday) or month.'
  - name: period_start
    description: The period's first day.
  - name: slice
    description: '''total'' for the whole period, else (days only) the dimension the row breaks the metrics down
      by: one of customer__country, order__currency, order__status.'
  - name: slice_value
    description: The value of the slice's dimension on this row; NULL on a total row.
  - name: average_order_value_eur
    description: 'Average order value (EUR): Average amount of a non-cancelled order (revenue over non-cancelled
      orders, over the whole period asked, never an average of daily averages). Not additive: never SUM or AVG it
      over rows. Over any other span or filter: SUM(revenue_eur) of governed.orders_daily divided by SUM(orders_total)
      of governed.orders_daily where order__status <> ''cancelled'', each over the same days and dimension values.'
  - name: cancellation_rate
    description: 'Cancellation rate: Share of orders cancelled. Not additive: never SUM or AVG it over rows. Over
      any other span or filter: SUM(orders_cancelled) of governed.orders_daily divided by SUM(orders_total) of governed.orders_daily,
      each over the same days and dimension values.'
  - name: customers_distinct
    description: 'Active customers: Distinct customers with at least one non-cancelled order. Not additive: never
      SUM or AVG it over rows. No additive form: read it from one row only, at the grain and slice asked; a span
      that is not one day, ISO week or calendar month is not available here.'
  - name: median_order_value_eur
    description: 'Median order value (EUR): BigQuery only: the median amount of a non-cancelled order, BigQuery''s
      approximate continuous percentile (APPROX_QUANTILES); Postgres has no rendering of it, so an agent on Postgres
      declines. Not additive: never SUM or AVG it over rows. No additive form: read it from one row only, at the
      grain and slice asked; a span that is not one day, ISO week or calendar month is not available here.'
  - name: repeat_customers
    description: 'Repeat customers: Distinct customers with a non-cancelled order in the period who have placed
      two or more orders in all (repeat customers). Not additive: never SUM or AVG it over rows. No additive form:
      read it from one row only, at the grain and slice asked; a span that is not one day, ISO week or calendar
      month is not available here.'
  - name: repeat_revenue_share
    description: 'Repeat-customer revenue share: Share of revenue that came from repeat customers (revenue from
      customers with two or more orders in all over revenue, over the whole period asked). Not additive: never SUM
      or AVG it over rows. Over any other span or filter: SUM(revenue_repeat_customers_eur) of governed.orders_daily
      divided by SUM(revenue_eur) of governed.orders_daily, each over the same days and dimension values.'
  - name: revenue_eur_mtd
    description: 'Revenue month to date (EUR): Revenue from the first of the month up to and including each day
      (month to date); group by metric_time__day and read the day asked. Grouped by week or month it is the total
      up to that period''s last day. Not additive: never SUM or AVG it over rows. As of another day: SUM(revenue_eur)
      of governed.orders_daily from the first day of the month to the day asked.'
  - name: revenue_eur_wow_growth
    description: 'Revenue week-over-week growth: Revenue''s change from the week before, as a share of that week''s
      revenue (0.10 is 10 % more); group by metric_time__week to compare whole weeks, by metric_time__day to compare
      a day with the same weekday a week earlier. Empty where either week has no revenue. Not additive: never SUM
      or AVG it over rows. Over another span: ((SUM(revenue_eur) of governed.orders_daily) - (SUM(revenue_eur) of
      governed.orders_daily, 1 week earlier)) / (SUM(revenue_eur) of governed.orders_daily, 1 week earlier), each
      over the same span.'
- name: gov_orders_daily
  description: 'Governed orders metrics by day: one row per day (metric_time__day) and combination of customer__country,
    order__currency, order__status, every number computed by MetricFlow from the semantic layer''s definitions.
    Every metric column is additive: SUM it over any days and dimension values, and never re-derive a metric from
    other tables.'
  config:
    meta:
      governed:
        kind: daily
        home: orders
        metrics:
        - net_revenue_eur
        - orders_cancelled
        - orders_total
        - revenue_eur
        - revenue_repeat_customers_eur
  columns:
  - name: metric_time__day
    description: The day (UTC) the metrics on this row count, each metric's own time dimension.
  - name: customer__country
    description: ISO-2 country code of the customer (NL, TR, GB, DE, FR, US).
  - name: order__currency
    description: ISO-4217 code of the order amount.
  - name: order__status
    description: placed, shipped or cancelled.
  - name: net_revenue_eur
    description: 'Net revenue (EUR): Revenue minus partner returns (finance''s net sales). Additive: SUM it over
      any days and dimension values.'
  - name: orders_cancelled
    description: 'Cancelled orders: Orders with status cancelled. Additive: SUM it over any days and dimension values.'
  - name: orders_total
    description: 'Orders: All orders placed, cancelled included. Additive: SUM it over any days and dimension values.'
  - name: revenue_eur
    description: 'Revenue (EUR): Sum of amount for non-cancelled orders (the one definition of revenue). Additive:
      SUM it over any days and dimension values.'
  - name: revenue_repeat_customers_eur
    description: 'Revenue from repeat customers (EUR): Revenue (non-cancelled orders) from repeat customers, those
      who have placed two or more orders in all. Additive: SUM it over any days and dimension values.'
- name: gov_outreach_messages_by_period
