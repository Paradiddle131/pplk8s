version: 2

sources:
  - name: ds_source
    description: >
      Append-only landing tables written by EL Factory lite.
      Every table carries the metadata columns _run_id, _interval_start, _interval_end, _page, _source_uri, _loaded_at.
      The same natural key can appear in several runs; the latest load (greatest _loaded_at, _run_id) wins in silver.
    schema: ds_source
    # Source freshness (#130, semantic/PLAN.md SL-12): _loaded_at is when EL Factory landed a row, so its
    # maximum is when the source last flowed. The default suits the daily `<pipeline>_elt` DAGs (00:00 UTC):
    # a missed run warns, and the error matches the products' 36-hour deadline (ops.product_deadlines).
    # A table with another cadence sets its own. `dbt source freshness` runs on a CronJob in workloads
    # (platform/k8s/workloads/source-freshness-cronjob.yaml) and its on-run-end hook writes ops.source_freshness.
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 36, period: hour}
    tables:
      - name: synthetic_customers
        description: Full customer snapshot per run (synthetic).
        columns:
          - name: customer_id
            tests: [not_null]
          - name: country
            description: ISO-2 country code.
      - name: synthetic_orders
        description: Orders for the run's interval (synthetic).
        columns:
          - name: order_id
            tests: [not_null]
          - name: status
            description: placed, shipped or cancelled.
      - name: synthetic_campaigns
        description: Full ad-campaign snapshot per run (synthetic marketing, PLAN.md D38).
        columns:
          - name: campaign_id
            tests: [not_null]
      - name: synthetic_ad_spend
        description: One row per campaign per day of the run's interval (synthetic).
        columns:
          - name: campaign_id
            tests: [not_null]
          - name: spend_date
            tests: [not_null]
      - name: synthetic_leads
        description: CRM leads created in the run's interval (synthetic).
        columns:
          - name: lead_id
            tests: [not_null]
      - name: synthetic_bookings
        description: Bookings made in the run's interval, each from one lead (synthetic).
        columns:
          - name: booking_id
            tests: [not_null]
      - name: synthetic_customer_actions
        description: >
          Site and CRM actions received in the run's interval (synthetic): append-only, extracted by received_ts,
          so an event can arrive a day after its event_ts.
        columns:
          - name: event_id
            tests: [not_null]
      - name: synthetic_partners
        description: Full partner snapshot per run (synthetic partner outreach, semantic/PLAN.md SL-16).
        columns:
          - name: partner_id
            tests: [not_null]
      - name: synthetic_partner_contacts
        description: >
          Every partner contact as it stood at the end of the run's interval (synthetic): consent, an opt-out
          once it has happened, and updated_ts when either changed. Name, email and phone are personal data.
        columns:
          - name: contact_id
            tests: [not_null]
      - name: synthetic_outreach_messages
        description: Messages the outreach automation sent in the run's interval (synthetic), by sent_ts.
        columns:
          - name: message_id
            tests: [not_null]
      - name: synthetic_outreach_replies
        description: >
          Replies received in the run's interval (synthetic), by replied_ts; a reply arrives up to a few days
          after its message, so a run can land none.
        config:
          # A quiet day lands no reply; two quiet days in a row are normal, three are a stop.
          freshness:
            warn_after: {count: 48, period: hour}
            error_after: {count: 72, period: hour}
        columns:
          - name: reply_id
            tests: [not_null]
      - name: synthetic_applications
        description: >
          Every candidate who had applied by the end of the run's interval, in the hiring stage they were in then and
          since when (stage_ts); the source keeps no stage history (synthetic recruitment, semantic/PLAN.md SL-17).
        columns:
          - name: candidate_id
            tests: [not_null]
      - name: partner_returns
        description: >
          Partner return lines loaded from landed NDJSON files (EL Factory POST /load).
          File tables carry _run_id, _source_uri, _generation, _loaded_at instead of the interval and page columns.
        config:
          # Partners drop files on business days, so a weekend is quiet; three days without one is a stop.
          freshness:
            warn_after: {count: 48, period: hour}
            error_after: {count: 72, period: hour}
        columns:
          - name: return_id
            tests: [not_null]
      - name: open_meteo_hourly_weather
        description: Hourly weather observations per location from the public Open-Meteo archive API.
        config:
          freshness: null # loaded by hand (PLAN.md Phase 1); no DAG lands it on a schedule, so it cannot stop flowing
        columns:
          - name: location
            tests: [not_null]
          - name: observed_at
            tests: [not_null]
      - name: tlc_yellow
        description: >
          NYC TLC yellow taxi trip files, one Parquet file per data month, landed chunk by chunk (PLAN.md D34).
          Every published column under its lower-cased name, added and widened as months drift; file tables
          carry _run_id, _source_uri, _etag, _chunk, _loaded_at. EL Factory creates the table on the first load.
        config: &tlc_freshness
          # tlc_monthly loads a month on the 1st; a skipped month warns, two error. A month TLC has not yet
          # published is the alert of #89, not this one: freshness says our loads stopped, not the publisher.
          freshness:
            warn_after: {count: 35, period: day}
            error_after: {count: 62, period: day}
      - name: tlc_green
        description: NYC TLC green taxi trip files; same landing contract as tlc_yellow.
        config: *tlc_freshness

  - name: ops
    description: Operational ledgers EL Factory writes next to the landing tables.
    schema: ops
    tables:
      - name: file_versions
        description: >
          One row per completed file version (source_uri, etag), written with its last chunk (D34);
          silver reads only the latest completed version of each month (D36).
