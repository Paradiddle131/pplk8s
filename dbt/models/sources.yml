version: 2

sources:
  - name: ds_source
    description: >
      Append-only landing tables written by EL Factory lite.
      Every table carries the metadata columns _run_id, _interval_start, _interval_end, _page, _source_uri, _loaded_at.
      The same natural key can appear in several runs; the latest load (greatest _loaded_at, _run_id) wins in silver.
    schema: ds_source
    tables:
      - name: synthetic_customers
        description: Full customer snapshot per run (synthetic).
        columns:
          - name: customer_id
            tests: [not_null]
          - name: country
            description: ISO-2 country code.
      - name: synthetic_orders
        description: Orders for the run's interval (synthetic).
        columns:
          - name: order_id
            tests: [not_null]
          - name: status
            description: placed, shipped or cancelled.
      - name: synthetic_campaigns
        description: Full ad-campaign snapshot per run (synthetic marketing, PLAN.md D38).
        columns:
          - name: campaign_id
            tests: [not_null]
      - name: synthetic_ad_spend
        description: One row per campaign per day of the run's interval (synthetic).
        columns:
          - name: campaign_id
            tests: [not_null]
          - name: spend_date
            tests: [not_null]
      - name: synthetic_leads
        description: CRM leads created in the run's interval (synthetic).
        columns:
          - name: lead_id
            tests: [not_null]
      - name: synthetic_bookings
        description: Bookings made in the run's interval, each from one lead (synthetic).
        columns:
          - name: booking_id
            tests: [not_null]
      - name: partner_returns
        description: >
          Partner return lines loaded from landed NDJSON files (EL Factory POST /load).
          File tables carry _run_id, _source_uri, _generation, _loaded_at instead of the interval and page columns.
        columns:
          - name: return_id
            tests: [not_null]
      - name: open_meteo_hourly_weather
        description: Hourly weather observations per location from the public Open-Meteo archive API.
        columns:
          - name: location
            tests: [not_null]
          - name: observed_at
            tests: [not_null]
      - name: tlc_yellow
        description: >
          NYC TLC yellow taxi trip files, one Parquet file per data month, landed chunk by chunk (PLAN.md D34).
          Every published column under its lower-cased name, added and widened as months drift; file tables
          carry _run_id, _source_uri, _etag, _chunk, _loaded_at. EL Factory creates the table on the first load.
      - name: tlc_green
        description: NYC TLC green taxi trip files; same landing contract as tlc_yellow.

  - name: ops
    description: Operational ledgers EL Factory writes next to the landing tables.
    schema: ops
    tables:
      - name: file_versions
        description: >
          One row per completed file version (source_uri, etag), written with its last chunk (D34);
          silver reads only the latest completed version of each month (D36).
