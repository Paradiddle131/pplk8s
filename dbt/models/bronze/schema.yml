version: 2

models:
  - name: brz_synthetic_customers
    description: Customers as landed, cast only. Alias bronze.synthetic_customers. Keeps every run, so customer_id is not unique here.
    columns:
      - name: customer_id
        description: Natural key; repeated across runs.
        tests: [not_null]
      - name: _run_id
        tests: [not_null]

  - name: brz_synthetic_orders
    description: Orders as landed, cast only. Alias bronze.synthetic_orders. Keeps every run, so order_id can repeat across runs.
    tests:
      - unique_combination:
          arguments:
            columns: ['_run_id', 'order_id']
    columns:
      - name: order_id
        description: Natural key; repeated across runs.
        tests: [not_null]
      - name: status
        description: placed, shipped or cancelled.
        tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'cancelled']
      - name: _run_id
        tests: [not_null]

  - name: brz_open_meteo_hourly_weather
    description: Hourly weather as landed, cast only. Alias bronze.open_meteo_hourly_weather.
    tests:
      - unique_combination:
          arguments:
            columns: ['_run_id', 'location', 'observed_at']
    columns:
      - name: location
        tests: [not_null]
      - name: observed_at
        tests: [not_null]

  - name: brz_partner_returns
    description: Partner return lines, one row per line of every landed file. Alias bronze.partner_returns.
    columns:
      - name: return_id
        tests: [not_null]
      - name: _generation
        description: GCS object generation the row was loaded from.
        tests: [not_null]

  - name: brz_tlc_yellow_trips
    description: >
      Yellow taxi trips as landed, every file version and chunk, canonical names and types; columns a month or
      the trip type lacks are NULL. Alias bronze.tlc_yellow_trips. No tests: rows repeat across file versions.
    columns:
      - name: data_month
        description: YYYY-MM of the source file name, the month the file covers.

  - name: brz_tlc_green_trips
    description: Green taxi trips as landed; same shape as brz_tlc_yellow_trips. Alias bronze.tlc_green_trips.
    columns:
      - name: hail_type
        description: Green's own trip_type column (1 = street hail, 2 = dispatch), renamed so trip_type can name yellow or green.

  - name: brz_synthetic_campaigns
    description: Ad campaigns as landed, cast only. Alias bronze.synthetic_campaigns. Keeps every run, so campaign_id repeats.
    columns:
      - name: campaign_id
        tests: [not_null]
      - name: _run_id
        tests: [not_null]

  - name: brz_synthetic_ad_spend
    description: Daily ad spend per campaign as landed, cast only. Alias bronze.synthetic_ad_spend.
    tests:
      - unique_combination:
          arguments:
            columns: ['_run_id', 'spend_date', 'campaign_id']
    columns:
      - name: spend_date
        tests: [not_null]
      - name: campaign_id
        tests: [not_null]

  - name: brz_synthetic_leads
    description: CRM leads as landed, cast only. Alias bronze.synthetic_leads.
    tests:
      - unique_combination:
          arguments:
            columns: ['_run_id', 'lead_id']
    columns:
      - name: lead_id
        tests: [not_null]

  - name: brz_synthetic_bookings
    description: Bookings as landed, cast only. Alias bronze.synthetic_bookings.
    tests:
      - unique_combination:
          arguments:
            columns: ['_run_id', 'booking_id']
    columns:
      - name: booking_id
        tests: [not_null]

  - name: brz_synthetic_customer_actions
    description: >
      Site and CRM actions as landed, cast only; append-only and extracted by received_ts, so an event can
      land a day after its event_ts and a redelivered event repeats. Alias bronze.synthetic_customer_actions.
    tests:
      - unique_combination:
          arguments:
            columns: ['_run_id', 'event_id']
    columns:
      - name: event_id
        tests: [not_null]
      - name: event_ts
        tests: [not_null]

  # Partner outreach (semantic/PLAN.md SL-16): partners, their contacts' snapshots, messages and replies.
  - name: brz_synthetic_partners
    description: Partners as landed, cast only; a full snapshot per run. Alias bronze.synthetic_partners.
    columns:
      - name: partner_id
        tests: [not_null]

  - name: brz_synthetic_partner_contacts
    description: >
      Partner contacts as landed, cast only; each run lands a snapshot of every contact as it stood at the end of
      the run's interval, so a backfill lands an older state after a newer one. Name, email and phone are personal
      data. Alias bronze.synthetic_partner_contacts.
    tests:
      - unique_combination:
          arguments:
            columns: ['_run_id', 'contact_id']
    columns:
      - name: contact_id
        tests: [not_null]
      - name: updated_ts
        tests: [not_null]
      - name: contact_name
        config:
          meta: {pii: true}
      - name: email
        config:
          meta: {pii: true}
      - name: phone
        config:
          meta: {pii: true}

  - name: brz_synthetic_outreach_messages
    description: Outreach messages as landed, cast only. Alias bronze.synthetic_outreach_messages.
    columns:
      - name: message_id
        tests: [not_null]

  - name: brz_synthetic_outreach_replies
    description: Replies to outreach messages as landed, cast only. Alias bronze.synthetic_outreach_replies.
    columns:
      - name: reply_id
        tests: [not_null]

  # Recruitment (semantic/PLAN.md SL-17): candidates in their current stage, one extract per run.
  - name: brz_synthetic_applications
    description: >
      Candidates as landed, cast only; each run lands every candidate in the stage they were in at the end of the
      run's interval, so a backfill lands an older stage after a newer one. Alias bronze.synthetic_applications.
    tests:
      - unique_combination:
          arguments:
            columns: ['_run_id', 'candidate_id']
    columns:
      - name: candidate_id
        tests: [not_null]
      - name: stage
        tests: [not_null]
      - name: stage_ts
        tests: [not_null]

  - name: brz_synthetic_call_transcripts
    description: >
      Call transcripts as landed, cast only; one row per call and run. Alias bronze.synthetic_call_transcripts.
    columns:
      - name: transcript_id
        tests: [not_null]
      - name: transcript
        tests: [not_null]
