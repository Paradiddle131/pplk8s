version: 2

models:
  - name: exp_sales_by_country_daily
    description: Sales per order_date and customer country. Alias exposed.sales_by_country_daily.
    tests:
      - unique_combination:
          arguments:
            columns: ['order_date', 'country']
    columns:
      - name: order_date
        tests: [not_null]
      - name: country
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NL', 'TR', 'GB', 'DE', 'FR', 'US']
      - name: orders
        description: All orders for that country and day, cancelled included.
      - name: revenue_eur
        description: Sum of amount for non-cancelled orders.

  - name: exp_daily_sales_with_weather
    description: Daily sales left-joined to Amsterdam daily weather. Alias exposed.daily_sales_with_weather.
    columns:
      - name: order_date
        description: Natural key.
        tests: [not_null, unique]

  - name: exp_net_sales_daily
    description: Daily revenue net of partner returns, one row per order_date of gold.daily_sales. Alias exposed.net_sales_daily.
    columns:
      - name: order_date
        description: Natural key.
        tests: [not_null, unique]
      - name: net_revenue_eur
        description: revenue_eur minus returns_eur.
        tests: [not_null]

  - name: exp_tlc_daily_trips_by_borough
    description: Daily trips, passengers and revenue per pickup borough and trip type. Alias exposed.tlc_daily_trips_by_borough.
    tests:
      - unique_combination:
          arguments:
            columns: ['pickup_date', 'data_month', 'trip_type', 'borough']
