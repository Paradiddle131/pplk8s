version: 2

# Every column carries its contract type (gold and exposed enforce contracts, dbt_project.yml), spelled
# so Postgres and BigQuery both accept it: date, numeric, bigint and integer (BigQuery's INT64 aliases);
# a string is `text` on Postgres and `string` on BigQuery, written once as the `text` anchor below.
# The tlc models stay Postgres-only (semantic/PLAN.md SL-6), so their float columns say `float`.
models:
  - name: exp_sales_by_country_daily
    description: Sales per order_date and customer country. Alias exposed.sales_by_country_daily.
    tests:
      - unique_combination:
          arguments:
            columns: ['order_date', 'country']
    columns:
      - name: order_date
        description: UTC date the orders were placed.
        data_type: date
        tests: [not_null]
      - name: country
        description: ISO-3166 alpha-2 country of the customer.
        data_type: &text "{{ 'string' if target.type == 'bigquery' else 'text' }}"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NL', 'TR', 'GB', 'DE', 'FR', 'US']
      - name: orders
        description: All orders for that country and day, cancelled included.
        data_type: bigint
      - name: revenue_eur
        description: Sum of amount for non-cancelled orders.
        data_type: numeric

  - name: exp_daily_sales_with_weather
    description: Daily sales left-joined to Amsterdam daily weather. Alias exposed.daily_sales_with_weather.
    columns:
      - name: order_date
        description: Natural key.
        data_type: date
        tests: [not_null, unique]
      - name: orders_total
        description: All orders that day, cancelled included.
        data_type: bigint
      - name: orders_cancelled
        description: Cancelled orders that day.
        data_type: bigint
      - name: revenue_eur
        description: Sum of amount for non-cancelled orders.
        data_type: numeric
      - name: customers_distinct
        description: Distinct customers with at least one non-cancelled order that day.
        data_type: bigint
      - name: amsterdam_avg_temperature_c
        description: Amsterdam's mean hourly temperature that UTC day, in degrees Celsius; NULL without observations.
        data_type: numeric
      - name: amsterdam_total_precipitation_mm
        description: Amsterdam's precipitation that UTC day, in millimetres; NULL without observations.
        data_type: numeric

  - name: exp_net_sales_daily
    description: >-
      Daily revenue net of partner returns, one row per UTC day with orders (gold.daily_sales) or returns
      (silver.returns); a day with returns only has revenue 0. Alias exposed.net_sales_daily.
    columns:
      - name: order_date
        description: Natural key, the UTC day; it keeps its name on a day with returns only, for its consumers.
        data_type: date
        tests: [not_null, unique]
      - name: revenue_eur
        description: Sum of amount for non-cancelled orders; 0 on a day without orders.
        data_type: numeric
      - name: returns_count
        description: Partner returns recorded that day.
        data_type: bigint
        # The returns metrics are silver's returns by return_date, and every return day has a row here,
        # so a return lost or doubled on its way fails these hops (#150).
        tests:
          - matches_metric:
              name: hop_metric_returns_count_to_exp_net_sales_daily
              arguments:
                metric: returns_count
                time_column: order_date
      - name: returns_eur
        description: Sum of partner return amounts recorded that day.
        data_type: numeric
        tests:
          - matches_metric:
              name: hop_metric_returns_eur_to_exp_net_sales_daily
              arguments:
                metric: returns_eur
                time_column: order_date
      - name: net_revenue_eur
        description: revenue_eur minus returns_eur.
        data_type: numeric
        tests: [not_null]

  - name: exp_tlc_daily_trips_by_borough
    description: Daily trips, passengers and revenue per pickup borough and trip type. Alias exposed.tlc_daily_trips_by_borough.
    tests:
      - unique_combination:
          arguments:
            columns: ['pickup_date', 'data_month', 'trip_type', 'borough']
    columns:
      - name: pickup_date
        description: Local date of the pickup.
        data_type: date
      - name: data_month
        description: The TLC data month (YYYY-MM) the trips were published in.
        data_type: *text
      - name: trip_type
        description: yellow or green.
        data_type: *text
      - name: borough
        description: Pickup borough from the taxi zone lookup; Unknown for zones it lacks.
        data_type: *text
      - name: trips
        description: Number of trips.
        data_type: numeric
      - name: passengers
        description: Sum of the passenger counts.
        data_type: numeric
      - name: total_amount_usd
        description: Sum of the total amounts charged, in USD.
        data_type: float

  - name: exp_channel_performance_daily
    description: Daily cost per lead and per booking per channel. Per-day ratios; over a period use the metrics cost_per_lead_eur and cost_per_booking_eur. Alias exposed.channel_performance_daily.
    tests:
      - unique_combination:
          arguments:
            columns: ['activity_date', 'channel']
    columns:
      - name: activity_date
        description: UTC day.
        data_type: date
        tests: [not_null]
      - name: channel
        description: Marketing channel.
        data_type: *text
        tests: [not_null]
      - name: ad_spend_eur
        description: Ad spend that day, EUR.
        data_type: numeric
      - name: leads
        description: Leads created that day.
        data_type: bigint
      - name: bookings
        description: Bookings made that day.
        data_type: bigint
      - name: cost_per_lead_eur
        description: ad_spend_eur / leads for that day; NULL without leads.
        data_type: numeric
      - name: cost_per_booking_eur
        description: ad_spend_eur / bookings for that day; NULL without bookings.
        data_type: numeric

  # The outreach automation's activation list (semantic/PLAN.md SL-16): an exposed model whose consumer is an
  # automation, not an agent, and which carries personal data, so it is protected and stays out of the agent
  # catalog; scripts/check_standard.py requires exactly that of a gold or exposed model with a meta.pii column.
  - name: exp_outreach_activation
    description: >
      Partner contacts the outreach automation may contact next, with their details: every contact who consented,
      has not opted out, and was not messaged in the cooldown (outreach_cooldown_days, 7) before as_of, the newest
      message sent. Alias exposed.outreach_activation.
    config:
      access: protected
    columns:
      - name: contact_id
        description: Natural key.
        data_type: *text
        tests: [not_null, unique]
      - name: partner_id
        description: The contact's partner.
        data_type: integer
        tests: [not_null]
      - name: partner_name
        description: The partner's name.
        data_type: *text
      - name: contact_name
        description: The contact's full name.
        data_type: *text
        config:
          meta: {pii: true}
      - name: email
        description: The contact's email address.
        data_type: *text
        config:
          meta: {pii: true}
      - name: phone
        description: The contact's phone number.
        data_type: *text
        config:
          meta: {pii: true}
      - name: preferred_channel
        description: email, phone or sms.
        data_type: *text
      - name: last_contacted_at
        description: When the contact was last messaged; NULL if never.
        data_type: &timestamptz "{{ 'timestamp' if target.type == 'bigquery' else 'timestamp with time zone' }}"
      - name: as_of
        description: The newest message sent, which the cooldown counts back from.
        data_type: *timestamptz
