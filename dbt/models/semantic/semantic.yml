version: 2

# The semantic layer (semantic/PLAN.md SL-1), in dbt's latest YAML spec: the semantic models and their
# simple metrics live on the silver models (models/silver/schema.yml); this file holds the time spine,
# the metrics and glossary tables, and the metrics that combine other metrics. Every calculated field of the gold and
# exposed models is defined once as a metric (R1).
# The hand-written gold and exposed aggregates stay as the parity oracle (tests/e2e/semantic-check.sh).
# Every metric carries a description and a label: scripts/check_standard.py fails the stage otherwise,
# because they become the agent catalog and the warehouse comments (SL-3).

models:
  - name: metricflow_time_spine
    description: One row per calendar day from 2024-01-01 to 2027-12-31, MetricFlow's time spine. Alias semantic.time_spine.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: The calendar day.
        granularity: day
        tests: [not_null, unique]

  - name: semantic_metrics
    description: One row per metric of the semantic layer, with its words; the warehouse copy of the agent catalog's metrics (semantic/PLAN.md SL-3). Alias semantic.metrics.
    columns:
      - name: metric_name
        description: The metric's name, as the mf CLI and the agent's query_metrics take it.
        tests: [not_null, unique]
      - name: label
        description: The metric's display name.
        tests: [not_null]
      - name: description
        description: What the metric counts or sums, and what it leaves out.
        tests: [not_null]
      - name: metric_type
        description: MetricFlow metric type (simple, ratio, derived, cumulative or conversion).
      - name: semantic_models
        description: Comma-separated semantic models the metric reads.
      - name: pipelines
        description: Comma-separated pipeline tags that own those models; ops.readiness by these tags gives the metric's freshness.

  - name: semantic_glossary
    description: One row per glossary term, a business term that is not a metric, with the metrics and dimensions it maps to; the warehouse copy of the agent catalog's glossary (semantic/PLAN.md SL-3). Alias semantic.glossary.
    columns:
      - name: term
        description: The business term, as people ask for it.
        tests: [not_null, unique]
      - name: description
        description: What the term means and how it differs from terms it is confused with.
        tests: [not_null]
      - name: synonyms
        description: Comma-separated other words for the term.
      - name: metrics
        description: Comma-separated metrics the term maps to, as the mf CLI and the agent's query_metrics take them.
      - name: dimensions
        description: Comma-separated dimensions the term maps to, as `<entity>__<dimension>`.
      - name: model_name
        description: The dbt model whose YAML defines the term.

# Metrics over other metrics, whether over one semantic model or several (models/silver/schema.yml says why).
metrics:
  - name: cancellation_rate
    description: Share of orders cancelled.
    label: Cancellation rate
    type: ratio
    numerator: orders_cancelled
    denominator: orders_total
  - name: net_revenue_eur
    description: Revenue minus partner returns (finance's net sales).
    label: Net revenue (EUR)
    type: derived
    # Either side is NULL on a day it has no rows (models/silver/schema.yml).
    expr: coalesce(revenue_eur, 0) - coalesce(returns_eur, 0)
    input_metrics:
      - name: revenue_eur
      - name: returns_eur
  - name: cost_per_lead_eur
    description: Ad spend divided by leads over the whole period asked (total spend over total leads, never an average of daily ratios); the one definition of cost per lead.
    label: Cost per lead (EUR)
    type: ratio
    numerator: ad_spend_eur
    denominator: leads
  - name: cost_per_booking_eur
    description: Ad spend divided by bookings over the whole period asked (total spend over total bookings, never an average of daily ratios); the one definition of cost per conversion.
    label: Cost per booking (EUR)
    type: ratio
    numerator: ad_spend_eur
    denominator: bookings
  - name: lead_to_booking_rate
    description: Share of leads that booked within 30 days of being created, counted on the lead's creation day.
    label: Lead-to-booking rate
    type: conversion
    entity: lead
    calculation: conversion_rate
    base_metric: leads
    conversion_metric: bookings
    window: 30 days
  - name: objection_rate
    description: >-
      Model-derived: share of labelled calls in which the customer raised an objection (calls with an objection over
      calls labelled, over the whole period asked), labelled by gemini-3.5-flash (in the lab, recorded from an
      OpenRouter free model) under prompt v1; objection labels agree with the golden set at kappa 0.6 or more.
    label: Objection rate
    type: ratio
    numerator: calls_with_objection
    denominator: calls_labelled
  - name: positive_sentiment_share
    description: >-
      Model-derived: share of labelled calls the customer ended in a positive mood (positive calls over calls labelled,
      over the whole period asked), labelled by gemini-3.5-flash (in the lab, recorded from an OpenRouter free model)
      under prompt v1; sentiment labels agree with the golden set at kappa 0.5 or more.
    label: Positive-sentiment share
    type: ratio
    numerator: positive_calls
    denominator: calls_labelled
  - name: reply_rate
    description: Share of outreach messages that got a reply, counted on the day the message was sent, so a day's rate rises as late replies arrive (messages replied over messages sent for the whole period asked, never replies over messages of the same day); the one definition of reply rate and response rate.
    label: Reply rate
    type: ratio
    numerator: messages_replied
    denominator: messages_sent
  - name: engaged_customers_7d
    description: Distinct customers with any site or CRM action in the 7 days ending on the day (that day and the 6 before); weekly engaged customers.
    label: Engaged customers (7 days)
    type: cumulative
    input_metric: acting_customers
    window: 7 days
  - name: engaged_customers_28d
    description: Distinct customers with any site or CRM action in the 28 days ending on the day (that day and the 27 before); monthly engaged customers.
    label: Engaged customers (28 days)
    type: cumulative
    input_metric: acting_customers
    window: 28 days
  # The site funnel (SL-15). MetricFlow 0.15 drops a filter on a conversion metric's conversion side, so the
  # step metrics count `case when action_type = ... then session_id end` instead of filtering, and a base
  # takes its step's filter on the input. At day grain a window of N days counts a conversion whose day is
  # fewer than N days after the base's: 2 days is the same day or the next, so a session crossing midnight converts.
  - name: view_to_cart_rate
    description: Share of site sessions with a page view that added to cart on the page view's day or the day after, counted on the page view's day.
    label: View-to-cart rate
    type: conversion
    entity: session
    calculation: conversion_rate
    base_metric: site_sessions
    conversion_metric: cart_sessions
    window: 2 days
  - name: cart_to_checkout_rate
    description: Share of site sessions with an add to cart that checked out on the add to cart's day or the day after, counted on the add to cart's day.
    label: Cart-to-checkout rate
    type: conversion
    entity: session
    calculation: conversion_rate
    base_metric:
      name: cart_sessions
      filter: "{{ Dimension('customer_action__action_type') }} = 'add_to_cart'"
    conversion_metric: checkout_sessions
    window: 2 days
  # Period over period and to date, over dbt/dev/fixture_weeks.sql. A week-over-week growth compares
  # the metric with itself one week earlier (offset_window), so it means a week's change when grouped by
  # metric_time__week; a month-to-date total runs from the first of the month (grain_to_date) and, grouped by a
  # coarser grain, takes the period's last day (period_agg: last), so by month it is the month's total.
  - name: revenue_eur_wow_growth
    description: >-
      Revenue's change from the week before, as a share of that week's revenue (0.10 is 10 % more); group by
      metric_time__week to compare whole weeks, by metric_time__day to compare a day with the same weekday a week
      earlier. Empty where either week has no revenue.
    label: Revenue week-over-week growth
    type: derived
    expr: (revenue_eur - revenue_eur_prior_week) / nullif(revenue_eur_prior_week, 0)
    input_metrics:
      - name: revenue_eur
      - name: revenue_eur
        offset_window: 1 week
        alias: revenue_eur_prior_week
  - name: bookings_wow_growth
    description: >-
      Bookings' change from the week before, as a share of that week's bookings (0.10 is 10 % more); group by
      metric_time__week to compare whole weeks. Empty where either week has no bookings.
    label: Bookings week-over-week growth
    type: derived
    expr: (bookings - bookings_prior_week) * 1.0 / nullif(bookings_prior_week, 0)
    input_metrics:
      - name: bookings
      - name: bookings
        offset_window: 1 week
        alias: bookings_prior_week
  - name: leads_wow_growth
    description: >-
      Leads' change from the week before, as a share of that week's leads (0.10 is 10 % more); group by
      metric_time__week to compare whole weeks. Empty where either week has no leads.
    label: Leads week-over-week growth
    type: derived
    expr: (leads - leads_prior_week) * 1.0 / nullif(leads_prior_week, 0)
    input_metrics:
      - name: leads
      - name: leads
        offset_window: 1 week
        alias: leads_prior_week
  - name: revenue_eur_mtd
    description: >-
      Revenue from the first of the month up to and including each day (month to date); group by metric_time__day
      and read the day asked. Grouped by week or month it is the total up to that period's last day.
    label: Revenue month to date (EUR)
    type: cumulative
    input_metric: revenue_eur
    grain_to_date: month
    period_agg: last
  - name: bookings_mtd
    description: >-
      Bookings from the first of the month up to and including each day (month to date); group by metric_time__day
      and read the day asked. Grouped by week or month it is the count up to that period's last day.
    label: Bookings month to date
    type: cumulative
    input_metric: bookings
    grain_to_date: month
    period_agg: last
  - name: leads_mtd
    description: >-
      Leads from the first of the month up to and including each day (month to date); group by metric_time__day and
      read the day asked. Grouped by week or month it is the count up to that period's last day.
    label: Leads month to date
    type: cumulative
    input_metric: leads
    grain_to_date: month
    period_agg: last
  # Customers (signups on silver.customers): the running total over all time, and the share of signups that
  # place an order within 30 days, at day grain the signup day and the 29 after it.
  - name: customers_to_date
    description: >-
      All customers who had signed up by each day, a running total over all time; grouped by week or month it is
      the count on that period's last day.
    label: Customers to date
    type: cumulative
    input_metric: signups
    period_agg: last
  - name: signup_to_first_order_rate
    description: >-
      Share of customers who placed their first order within 30 days of signing up (the signup day and the 29
      after it), counted on the signup day; by signup month, the share of that cohort.
    label: Signup-to-first-order rate
    type: conversion
    entity: customer
    calculation: conversion_rate
    base_metric: signups
    conversion_metric: orders_total
    window: 30 days
  - name: repeat_revenue_share
    description: >-
      Share of revenue that came from repeat customers (revenue from customers with two or more orders in all over
      revenue, over the whole period asked).
    label: Repeat-customer revenue share
    type: ratio
    numerator: revenue_repeat_customers_eur
    denominator: revenue_eur
