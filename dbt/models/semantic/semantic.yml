version: 2

# The semantic layer (semantic/PLAN.md SL-1), in dbt's latest YAML spec: the semantic models and their
# simple metrics live on the silver models (models/silver/schema.yml); this file holds the time spine,
# the metrics and glossary tables, and the metrics that combine other metrics. Every calculated field of the gold and
# exposed models is defined once as a metric (R1).
# The hand-written gold and exposed aggregates stay as the parity oracle (tests/e2e/semantic-check.sh).
# Every metric carries a description and a label: scripts/check_standard.py fails the stage otherwise,
# because they become the agent catalog and the warehouse comments (SL-3).

models:
  - name: metricflow_time_spine
    description: One row per calendar day from 2024-01-01 to 2027-12-31, MetricFlow's time spine. Alias semantic.time_spine.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: The calendar day.
        granularity: day
        tests: [not_null, unique]

  - name: semantic_metrics
    description: One row per metric of the semantic layer, with its words; the warehouse copy of the agent catalog's metrics (semantic/PLAN.md SL-3). Alias semantic.metrics.
    columns:
      - name: metric_name
        description: The metric's name, as the mf CLI and the agent's query_metrics take it.
        tests: [not_null, unique]
      - name: label
        description: The metric's display name.
        tests: [not_null]
      - name: description
        description: What the metric counts or sums, and what it leaves out.
        tests: [not_null]
      - name: metric_type
        description: MetricFlow metric type (simple, ratio, derived, cumulative or conversion).
      - name: semantic_models
        description: Comma-separated semantic models the metric reads.
      - name: pipelines
        description: Comma-separated pipeline tags that own those models; ops.readiness by these tags gives the metric's freshness.

  - name: semantic_glossary
    description: One row per glossary term, a business term that is not a metric, with the metrics and dimensions it maps to; the warehouse copy of the agent catalog's glossary (semantic/PLAN.md SL-3). Alias semantic.glossary.
    columns:
      - name: term
        description: The business term, as people ask for it.
        tests: [not_null, unique]
      - name: description
        description: What the term means and how it differs from terms it is confused with.
        tests: [not_null]
      - name: synonyms
        description: Comma-separated other words for the term.
      - name: metrics
        description: Comma-separated metrics the term maps to, as the mf CLI and the agent's query_metrics take them.
      - name: dimensions
        description: Comma-separated dimensions the term maps to, as `<entity>__<dimension>`.
      - name: model_name
        description: The dbt model whose YAML defines the term.

# Metrics over other metrics, whether over one semantic model or several (models/silver/schema.yml says why).
metrics:
  - name: cancellation_rate
    description: Share of orders cancelled.
    label: Cancellation rate
    type: ratio
    numerator: orders_cancelled
    denominator: orders_total
  - name: net_revenue_eur
    description: Revenue minus partner returns (finance's net sales).
    label: Net revenue (EUR)
    type: derived
    # Either side is NULL on a day it has no rows (models/silver/schema.yml).
    expr: coalesce(revenue_eur, 0) - coalesce(returns_eur, 0)
    input_metrics:
      - name: revenue_eur
      - name: returns_eur
  - name: cost_per_lead_eur
    description: Ad spend divided by leads over the whole period asked (total spend over total leads, never an average of daily ratios); the one definition of cost per lead.
    label: Cost per lead (EUR)
    type: ratio
    numerator: ad_spend_eur
    denominator: leads
  - name: cost_per_booking_eur
    description: Ad spend divided by bookings over the whole period asked (total spend over total bookings, never an average of daily ratios); the one definition of cost per conversion.
    label: Cost per booking (EUR)
    type: ratio
    numerator: ad_spend_eur
    denominator: bookings
  - name: lead_to_booking_rate
    description: Share of leads that booked within 30 days of being created, counted on the lead's creation day.
    label: Lead-to-booking rate
    type: conversion
    entity: lead
    calculation: conversion_rate
    base_metric: leads
    conversion_metric: bookings
    window: 30 days
  - name: objection_rate
    description: >-
      Model-derived: share of labelled calls in which the customer raised an objection (calls with an objection over
      calls labelled, over the whole period asked), labelled by gemini-3.5-flash (in the lab, recorded from an
      OpenRouter free model) under prompt v1; objection labels agree with the golden set at kappa 0.6 or more.
    label: Objection rate
    type: ratio
    numerator: calls_with_objection
    denominator: calls_labelled
  - name: positive_sentiment_share
    description: >-
      Model-derived: share of labelled calls the customer ended in a positive mood (positive calls over calls labelled,
      over the whole period asked), labelled by gemini-3.5-flash (in the lab, recorded from an OpenRouter free model)
      under prompt v1; sentiment labels agree with the golden set at kappa 0.5 or more.
    label: Positive-sentiment share
    type: ratio
    numerator: positive_calls
    denominator: calls_labelled
