version: 2

# Every column carries its contract type (gold and exposed enforce contracts, dbt_project.yml), spelled
# so Postgres and BigQuery both accept it: date, numeric, bigint and integer (BigQuery's INT64 aliases);
# a string is `text` on Postgres and `string` on BigQuery, written once as the `text` anchor below.
# The tlc models stay Postgres-only (semantic/PLAN.md SL-6), so their float columns say `float`.
models:
  - name: gld_daily_sales
    description: One row per order_date (UTC). Alias gold.daily_sales.
    columns:
      - name: order_date
        description: Natural key.
        data_type: date
        tests: [not_null, unique]
      - name: orders_total
        description: All orders that day, cancelled included.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_orders_total_to_gld_daily_sales
              arguments:
                metric: orders_total
                time_column: order_date
      - name: orders_cancelled
        description: Cancelled orders that day.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_orders_cancelled_to_gld_daily_sales
              arguments:
                metric: orders_cancelled
                time_column: order_date
      - name: revenue_eur
        description: Sum of amount for non-cancelled orders.
        data_type: numeric
        tests:
          - matches_metric:
              name: hop_metric_revenue_eur_to_gld_daily_sales
              arguments:
                metric: revenue_eur
                time_column: order_date
      - name: customers_distinct
        description: Distinct customers with at least one non-cancelled order that day.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_customers_distinct_to_gld_daily_sales
              arguments:
                metric: customers_distinct
                time_column: order_date

  - name: gld_customer_lifetime
    description: One row per customer. Alias gold.customer_lifetime.
    columns:
      - name: customer_id
        description: Natural key.
        data_type: integer
        tests: [not_null, unique]
      - name: name
        description: Customer name.
        data_type: &text "{{ 'string' if target.type == 'bigquery' else 'text' }}"
      - name: country
        description: ISO-3166 alpha-2 country of the customer.
        data_type: *text
      - name: first_order_date
        description: UTC date of the customer's first order, cancelled included; NULL without orders.
        data_type: date
      - name: last_order_date
        description: UTC date of the customer's latest order, cancelled included; NULL without orders.
        data_type: date
      - name: orders
        description: All orders, cancelled included.
        data_type: bigint
      - name: lifetime_value_eur
        description: Sum of amount for non-cancelled orders.
        data_type: numeric

  - name: gld_daily_weather
    description: One row per (location, UTC date). Alias gold.daily_weather.
    tests:
      - unique_combination:
          arguments:
            columns: ['location', 'date']
    columns:
      - name: location
        description: Weather location name, e.g. Amsterdam.
        data_type: *text
        tests: [not_null]
      - name: date
        description: UTC date of the observations.
        data_type: date
        tests: [not_null]
      - name: avg_temperature_c
        description: Mean of the hourly temperatures that day, in degrees Celsius, two decimals.
        data_type: numeric
      - name: min_temperature_c
        description: Lowest hourly temperature that day, in degrees Celsius.
        data_type: numeric
      - name: max_temperature_c
        description: Highest hourly temperature that day, in degrees Celsius.
        data_type: numeric
      - name: total_precipitation_mm
        description: Sum of the hourly precipitation that day, in millimetres.
        data_type: numeric

  - name: gld_tlc_daily_trips
    description: >
      One row per (data_month, trip_type, pickup_date, pickup_location_id), one month replaced per build.
      Alias gold.tlc_daily_trips.
    tests:
      - unique_combination:
          arguments:
            columns: ['data_month', 'trip_type', 'pickup_date', 'pickup_location_id']
    columns:
      - name: data_month
        description: The TLC data month (YYYY-MM) the trips were published in; one month is replaced per build.
        data_type: *text
      - name: trip_type
        description: yellow or green.
        data_type: *text
      - name: pickup_date
        description: Local date of the pickup.
        data_type: date
      - name: pickup_location_id
        description: TLC taxi zone id of the pickup (bronze.tlc_taxi_zones).
        data_type: integer
      - name: trips
        description: Number of trips.
        data_type: bigint
      - name: passengers
        description: Sum of the passenger counts.
        data_type: numeric
      - name: trip_distance_mi
        description: Sum of the trip distances, in miles.
        data_type: float
      - name: fare_amount_usd
        description: Sum of the metered fares, in USD.
        data_type: float
      - name: tip_amount_usd
        description: Sum of the tips, in USD.
        data_type: float
      - name: total_amount_usd
        description: Sum of the total amounts charged, in USD.
        data_type: float

  - name: gld_marketing_daily
    description: One row per (activity_date, channel) with any ad spend, lead or booking. Alias gold.marketing_daily.
    tests:
      - unique_combination:
          arguments:
            columns: ['activity_date', 'channel']
    columns:
      - name: activity_date
        description: UTC day of the spend, of the lead's creation, or of the booking.
        data_type: date
        tests: [not_null]
      - name: channel
        description: Marketing channel (search, social, display, email, partner); unknown for bookings whose lead is not loaded.
        data_type: *text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['search', 'social', 'display', 'email', 'partner', 'unknown']
      - name: ad_spend_eur
        description: Ad spend that day on the channel's campaigns, EUR.
        data_type: numeric
        tests:
          - matches_metric:
              name: hop_metric_ad_spend_eur_to_gld_marketing_daily
              arguments:
                metric: ad_spend_eur
                time_column: activity_date
      - name: ad_clicks
        description: Ad clicks that day on the channel's campaigns.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_ad_clicks_to_gld_marketing_daily
              arguments:
                metric: ad_clicks
                time_column: activity_date
      - name: ad_impressions
        description: Ad impressions that day on the channel's campaigns.
        data_type: bigint
      - name: leads
        description: CRM leads created that day from the channel's campaigns.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_leads_to_gld_marketing_daily
              arguments:
                metric: leads
                time_column: activity_date
      - name: bookings
        description: Bookings made that day by leads from the channel's campaigns.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_bookings_to_gld_marketing_daily
              arguments:
                metric: bookings
                time_column: activity_date
      - name: booking_value_eur
        description: Value of those bookings, EUR.
        data_type: numeric
        tests:
          - matches_metric:
              name: hop_metric_booking_value_eur_to_gld_marketing_daily
              arguments:
                metric: booking_value_eur
                time_column: activity_date

  - name: gld_call_signals_daily
    description: >
      One row per (call_date, topic) with any call labelled under the current prompt version. Model-derived: the topic,
      objection and sentiment come from a language model's labels, scored against a golden set
      (silver.call_label_agreement). Alias gold.call_signals_daily.
    tests:
      - unique_combination:
          arguments:
            columns: ['call_date', 'topic']
    columns:
      - name: call_date
        description: UTC day of the call.
        data_type: date
        tests: [not_null]
      - name: topic
        description: What the customer called about (delivery, pricing, returns, product), as the model labelled it.
        data_type: *text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['delivery', 'pricing', 'returns', 'product']
      - name: calls_labelled
        description: Calls on the topic that day labelled under the current prompt version.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_calls_labelled_to_gld_call_signals_daily
              arguments:
                metric: calls_labelled
                time_column: call_date
      - name: calls_with_objection
        description: Of those, calls in which the customer raised an objection (price, timing or a competitor).
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_calls_with_objection_to_gld_call_signals_daily
              arguments:
                metric: calls_with_objection
                time_column: call_date
      - name: positive_calls
        description: Of those, calls the customer ended in a positive mood.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_positive_calls_to_gld_call_signals_daily
              arguments:
                metric: positive_calls
                time_column: call_date

  - name: gld_lead_conversion_daily
    description: One row per day a CRM lead was created, with the leads of that day and those that booked within 30 days of being created. A per-day rate; over a period use the metric lead_to_booking_rate. Alias gold.lead_conversion_daily.
    columns:
      - name: created_date
        description: Natural key; the UTC day the leads were created.
        data_type: date
        tests: [not_null, unique]
      - name: leads
        description: CRM leads created that day, over all channels.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_leads_to_gld_lead_conversion_daily
              arguments:
                metric: leads
                time_column: created_date
      - name: booked_leads
        description: Of those leads, the ones that booked on their creation day or in the 29 days after.
        data_type: bigint
      - name: lead_to_booking_rate
        description: Share of that day's leads that booked within 30 days of being created.
        data_type: numeric
        tests:
          - matches_metric:
              name: hop_metric_lead_to_booking_rate_to_gld_lead_conversion_daily
              arguments:
                metric: lead_to_booking_rate
                time_column: created_date

  - name: gld_customer_actions_daily
    description: One row per (activity_date, action_type) with any site or CRM action; an action that arrived late counts on the day it happened. Alias gold.customer_actions_daily.
    tests:
      - unique_combination:
          arguments:
            columns: ['activity_date', 'action_type']
    columns:
      - name: activity_date
        description: UTC day the actions happened.
        data_type: date
        tests: [not_null]
      - name: action_type
        description: page_view, add_to_cart or checkout on the site; email_open or support_contact in the CRM.
        data_type: *text
        tests: [not_null]
      - name: channel
        description: Where the action happened, site or crm.
        data_type: *text
      - name: actions
        description: Actions of the type that day.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_customer_actions_to_gld_customer_actions_daily
              arguments:
                metric: customer_actions
                time_column: activity_date
      - name: customers
        description: Distinct customers with an action of the type that day.
        data_type: bigint

  - name: gld_customer_engagement_daily
    description: One row per day with any site or CRM action, with engaged customers over the trailing 7 and 28 days and the site funnel's sessions and step rates. Per-day rates; over a period use the metrics view_to_cart_rate and cart_to_checkout_rate. Alias gold.customer_engagement_daily.
    columns:
      - name: activity_date
        description: Natural key; the UTC day.
        data_type: date
        tests: [not_null, unique]
      - name: engaged_customers_7d
        description: Distinct customers with any action that day or in the 6 days before.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_engaged_customers_7d_to_gld_customer_engagement_daily
              arguments:
                metric: engaged_customers_7d
                time_column: activity_date
      - name: engaged_customers_28d
        description: Distinct customers with any action that day or in the 27 days before.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_engaged_customers_28d_to_gld_customer_engagement_daily
              arguments:
                metric: engaged_customers_28d
                time_column: activity_date
      - name: site_sessions
        description: Site sessions with a page view that day.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_site_sessions_to_gld_customer_engagement_daily
              arguments:
                metric: site_sessions
                time_column: activity_date
      - name: cart_sessions
        description: Site sessions with an add to cart that day.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_cart_sessions_to_gld_customer_engagement_daily
              arguments:
                metric: cart_sessions
                time_column: activity_date
      - name: checkout_sessions
        description: Site sessions with a checkout that day.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_checkout_sessions_to_gld_customer_engagement_daily
              arguments:
                metric: checkout_sessions
                time_column: activity_date
      - name: view_to_cart_rate
        description: Share of that day's page-view sessions that added to cart that day or the next; NULL without page views.
        data_type: numeric
        tests:
          - matches_metric:
              name: hop_metric_view_to_cart_rate_to_gld_customer_engagement_daily
              arguments:
                metric: view_to_cart_rate
                time_column: activity_date
      - name: cart_to_checkout_rate
        description: Share of that day's add-to-cart sessions that checked out that day or the next; NULL without adds to cart.
        data_type: numeric
        tests:
          - matches_metric:
              name: hop_metric_cart_to_checkout_rate_to_gld_customer_engagement_daily
              arguments:
                metric: cart_to_checkout_rate
                time_column: activity_date

  - name: gld_partner_outreach_daily
    description: One row per day with any outreach message sent or reply received. Per-day rate; over a period use the metric reply_rate. Alias gold.partner_outreach_daily.
    columns:
      - name: outreach_date
        description: Natural key; the UTC day a message was sent or a reply arrived.
        data_type: date
        tests: [not_null, unique]
      - name: messages_sent
        description: Outreach messages sent that day.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_messages_sent_to_gld_partner_outreach_daily
              arguments:
                metric: messages_sent
                time_column: outreach_date
      - name: messages_replied
        description: Messages sent that day that have a reply, whenever it arrived.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_messages_replied_to_gld_partner_outreach_daily
              arguments:
                metric: messages_replied
                time_column: outreach_date
      - name: replies
        description: Replies that arrived that day.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_replies_to_gld_partner_outreach_daily
              arguments:
                metric: replies
                time_column: outreach_date
      - name: partners_engaged
        description: Distinct partners with a reply that arrived that day.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_partners_engaged_to_gld_partner_outreach_daily
              arguments:
                metric: partners_engaged
                time_column: outreach_date
      - name: reply_rate
        description: messages_replied / messages_sent for that day's messages; NULL on a day without messages.
        data_type: numeric

  - name: gld_recruitment_daily
    description: One row per day with any application or hire. Per-day average; over a period use the metric time_to_hire_days. Alias gold.recruitment_daily.
    columns:
      - name: recruitment_date
        description: Natural key; the UTC day a candidate applied or was hired.
        data_type: date
        tests: [not_null, unique]
      - name: applications
        description: Candidates who applied that day.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_applications_to_gld_recruitment_daily
              arguments:
                metric: applications
                time_column: recruitment_date
      - name: hires
        description: Candidates hired that day.
        data_type: bigint
        tests:
          - matches_metric:
              name: hop_metric_hires_to_gld_recruitment_daily
              arguments:
                metric: hires
                time_column: recruitment_date
      - name: time_to_hire_days
        description: Average days from applying to being hired of that day's hires; NULL on a day without hires.
        data_type: numeric
        tests:
          - matches_metric:
              name: hop_metric_time_to_hire_days_to_gld_recruitment_daily
              arguments:
                metric: time_to_hire_days
                time_column: recruitment_date

  - name: gld_candidates_in_stage_daily
    description: >
      One row per day and hiring stage with any candidate in it at the end of the day, from the stage history. Ask
      per day; summing days double-counts candidates. Alias gold.candidates_in_stage_daily.
    tests:
      - unique_combination:
          arguments:
            columns: ['stage_date', 'stage']
    columns:
      - name: stage_date
        description: The UTC day.
        data_type: date
        tests: [not_null]
      - name: stage
        description: applied, screen, interview, offer, hired or rejected.
        data_type: *text
        tests: [not_null]
      - name: candidates
        description: Candidates in the stage at the end of the day.
        data_type: bigint
