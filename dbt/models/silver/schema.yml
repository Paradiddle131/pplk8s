version: 2

# The semantic layer (semantic/PLAN.md SL-1) lives on these models in dbt's latest YAML spec: a model's
# `semantic_model` makes it a MetricFlow semantic model, its columns carry the entities and dimensions,
# and its `metrics` are the simple metrics over it. Metrics over other metrics (ratio, derived, conversion) are in
# models/semantic/semantic.yml, even over one model's: dbt-core 1.12.6's partial parse duplicates one declared on a
# model after any edit of that model's entry here.
# A dimension's description is its column's: it reaches the agent catalog (SL-3).
# No metric sets `fill_nulls_with`: dbt-core 1.12.6 drops it in this spec (#137), so a simple metric reads NULL,
# not 0, in a day or group where it has no rows, and a derived metric coalesces the inputs it adds or subtracts.
# Business terms that are not metrics live in `config.meta.glossary` on the model that holds the concept: a term,
# what it means, its synonyms, and the metrics and dimensions it maps to (docs/agent-ready-warehouse.md). They
# reach the agent catalog, the data agent's glossary and semantic.glossary; check_catalog.py fails on a term
# that names an unknown metric or dimension, or repeats a metric.
# Each model's `hop_bronze_to_<model>` test reconciles it with bronze's latest load of each key (SL-9).

models:
  # Customers carry no metric of their own: the customer entity lets every orders metric group and
  # filter by the customer's country and signup cohort (customer__signup_date__month).
  - name: slv_customers
    description: One row per customer, latest load wins. Alias silver.customers.
    config:
      meta:
        glossary:
          - term: Signup cohort
            description: >-
              The customers who signed up in the same calendar month. A metric by cohort groups by the month
              its customer signed up, not the month the order was placed.
            synonyms: [cohort, acquisition cohort]
            metrics: [orders_total, revenue_eur, customers_distinct]
            dimensions: [customer__signup_date]
          - term: Customer country
            description: >-
              The customer's ISO-2 country. It is not the market a campaign targets nor a lead's country, so
              revenue or orders by country group by it.
            synonyms: [country]
            metrics: [orders_total, revenue_eur, customers_distinct]
            dimensions: [customer__country]
    semantic_model:
      enabled: true
      name: customers
    tests:
      - latest_load_reconciles:
          name: hop_bronze_to_slv_customers
          arguments:
            bronze: ref('brz_synthetic_customers')
            keys: [customer_id]
            tie_breaker: _run_id
          config:
            tags: [silver, sales]
    columns:
      - name: customer_id
        description: Natural key.
        tests: [not_null, unique]
        entity:
          type: primary
          name: customer
      - name: country
        description: ISO-2 country code of the customer (NL, TR, GB, DE, FR, US).
        tests:
          - accepted_values:
              arguments:
                values: ['NL', 'TR', 'GB', 'DE', 'FR', 'US']
        dimension:
          type: categorical
      - name: signup_date
        description: UTC date the customer signed up; group by its month for signup cohorts.
        dimension:
          type: time
        granularity: day

  - name: slv_orders
    description: One row per order, latest load wins. order_date is order_ts in UTC. Alias silver.orders.
    config:
      meta:
        glossary:
          - term: Order status
            description: >-
              Where an order stands: placed, shipped or cancelled. A cancelled order counts in orders and the
              cancellation rate, never in revenue or active customers.
            synonyms: [cancelled order, shipped order, placed order]
            metrics: [orders_total, orders_cancelled, cancellation_rate, revenue_eur, customers_distinct]
            dimensions: [order__status]
    semantic_model:
      enabled: true
      name: orders
    agg_time_dimension: order_date
    tests:
      - latest_load_reconciles:
          name: hop_bronze_to_slv_orders
          arguments:
            bronze: ref('brz_synthetic_orders')
            keys: [order_id]
            tie_breaker: _run_id
            amount: amount
          config:
            tags: [silver, sales]
    columns:
      - name: order_id
        description: Natural key.
        tests: [not_null, unique]
        entity:
          type: primary
          name: order
      - name: customer_id
        description: Must exist in slv_customers.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_customers')
                field: customer_id
        entity:
          type: foreign
          name: customer
      - name: order_date
        description: UTC date the order was placed.
        tests: [not_null]
        dimension:
          type: time
        granularity: day
      - name: status
        description: placed, shipped or cancelled.
        tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'cancelled']
        dimension:
          type: categorical
      - name: amount
        tests: [not_null]
      - name: currency
        description: ISO-4217 code of the order amount.
        dimension:
          type: categorical
    metrics:
      - name: orders_total
        description: All orders placed, cancelled included.
        label: Orders
        type: simple
        agg: count
        expr: order_id
      - name: orders_cancelled
        description: Orders with status cancelled.
        label: Cancelled orders
        type: simple
        agg: count
        expr: order_id
        filter: "{{ Dimension('order__status') }} = 'cancelled'"
      - name: revenue_eur
        description: Sum of amount for non-cancelled orders (the one definition of revenue).
        label: Revenue (EUR)
        type: simple
        agg: sum
        expr: amount
        filter: "{{ Dimension('order__status') }} <> 'cancelled'"
      - name: customers_distinct
        description: Distinct customers with at least one non-cancelled order.
        label: Active customers
        type: simple
        agg: count_distinct
        expr: customer_id
        filter: "{{ Dimension('order__status') }} <> 'cancelled'"

  - name: slv_hourly_weather
    description: One row per (location, observed_at), latest load wins. Alias silver.hourly_weather.
    tests:
      - unique_combination:
          arguments:
            columns: ['location', 'observed_at']
      - latest_load_reconciles:
          name: hop_bronze_to_slv_hourly_weather
          arguments:
            bronze: ref('brz_open_meteo_hourly_weather')
            keys: [location, observed_at]
            tie_breaker: _run_id
          config:
            tags: [silver, sales]
    columns:
      - name: location
        tests: [not_null]
      - name: observed_at
        tests: [not_null]

  - name: slv_returns
    description: Latest row per return_id across landed files. Alias silver.returns.
    config:
      meta:
        glossary:
          - term: Partner return
            description: >-
              An order a partner reports as returned, with the amount and the partner's reason, on the UTC day
              it was recorded. Returns lower net revenue; revenue itself keeps the order.
            synonyms: [return]
            metrics: [returns_eur, returns_count, net_revenue_eur]
            dimensions: [return__reason]
    semantic_model:
      enabled: true
      name: returns
    agg_time_dimension: return_date
    tests:
      - latest_load_reconciles:
          name: hop_bronze_to_slv_returns
          arguments:
            bronze: ref('brz_partner_returns')
            keys: [return_id]
            tie_breaker: _generation
            amount: amount
          config:
            tags: [silver, returns]
    columns:
      - name: return_id
        description: Natural key.
        tests: [not_null, unique]
        entity:
          type: primary
          name: return
      - name: order_id
        description: The returned order.
        entity:
          type: foreign
          name: order
      - name: return_date
        description: UTC date the return was recorded (returned_at in UTC).
        tests: [not_null]
        dimension:
          type: time
        granularity: day
      - name: reason
        description: The partner's return reason.
        dimension:
          type: categorical
    metrics:
      - name: returns_eur
        description: Sum of partner return amounts.
        label: Returns (EUR)
        type: simple
        agg: sum
        expr: amount
      - name: returns_count
        description: Number of partner returns.
        label: Returns
        type: simple
        agg: count
        expr: return_id

  - name: slv_tlc_trips
    description: >
      Clean yellow and green trips of the latest completed file version of each data month, one month replaced
      per build (delete+insert on data_month). Alias silver.tlc_trips.
    columns:
      - name: trip_type
        tests:
          - accepted_values:
              arguments:
                values: ['yellow', 'green']
      - name: data_month
        tests: [not_null]
      - name: pickup_at
        description: NYC local time, inside data_month.
        tests: [not_null]

  - name: slv_tlc_trips_quarantine
    description: >
      Trips of the same file versions that broke a rule (D36), with the first rule broken. Alias
      silver.tlc_trips_quarantine. Warns above 2 % of a month quarantined, fails above 10 %.
    tests:
      - quarantine_share:
          name: tlc_quarantine_share_warn
          arguments:
            clean: ref('slv_tlc_trips')
            max_share: 0.02
          config:
            severity: warn
      - quarantine_share:
          name: tlc_quarantine_share_error
          arguments:
            clean: ref('slv_tlc_trips')
            max_share: 0.10
    columns:
      - name: data_month
        tests: [not_null]
      - name: quarantine_reason
        tests:
          - accepted_values:
              arguments:
                values: ['negative_amount', 'pickup_outside_month', 'dropoff_before_pickup', 'over_24_hours']

  # Marketing (semantic/PLAN.md SL-8): campaigns, their daily spend, the leads they bring and the
  # bookings those leads make, all reachable by the campaign entity.
  - name: slv_campaigns
    description: One row per ad campaign, latest load wins. Alias silver.campaigns.
    config:
      meta:
        glossary:
          - term: Channel
            description: >-
              The marketing channel a campaign runs on: search, social, display, email or partner. Leads and
              bookings take their campaign's channel; a booking whose lead is not loaded yet has none.
            synonyms: [marketing channel, acquisition channel]
            metrics: [ad_spend_eur, leads, bookings, cost_per_lead_eur, cost_per_booking_eur]
            dimensions: [campaign__channel]
          - term: Market
            description: >-
              The ISO-2 country a campaign targets. It can differ from a lead's own country and a customer's
              country, so spend, leads and bookings by market group by the campaign, not the person.
            synonyms: [target market, campaign country]
            metrics: [ad_spend_eur, leads, bookings]
            dimensions: [campaign__market]
    semantic_model:
      enabled: true
      name: campaigns
    tests:
      - latest_load_reconciles:
          name: hop_bronze_to_slv_campaigns
          arguments:
            bronze: ref('brz_synthetic_campaigns')
            keys: [campaign_id]
            tie_breaker: _run_id
          config:
            tags: [silver, marketing]
    columns:
      - name: campaign_id
        description: Natural key.
        tests: [not_null, unique]
        entity:
          type: primary
          name: campaign
      - name: channel
        description: Marketing channel (search, social, display, email, partner).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['search', 'social', 'display', 'email', 'partner']
        dimension:
          type: categorical
      - name: market
        description: ISO-2 country the campaign targets.
        dimension:
          type: categorical
      - name: name
        description: The campaign's name.
        dimension:
          type: categorical
          name: campaign_name

  - name: slv_ad_spend
    description: One row per (spend_date, campaign), latest load wins. Alias silver.ad_spend.
    semantic_model:
      enabled: true
      name: ad_spend
    agg_time_dimension: spend_date
    # One row per (spend_date, campaign) has no single-column key; MetricFlow needs a primary entity.
    primary_entity: ad_spend_day
    tests:
      - unique_combination:
          arguments:
            columns: ['spend_date', 'campaign_id']
      - latest_load_reconciles:
          name: hop_bronze_to_slv_ad_spend
          arguments:
            bronze: ref('brz_synthetic_ad_spend')
            keys: [spend_date, campaign_id]
            tie_breaker: _run_id
            amount: spend
          config:
            tags: [silver, marketing]
    columns:
      - name: spend_date
        description: UTC day of the spend.
        tests: [not_null]
        dimension:
          type: time
        granularity: day
      - name: campaign_id
        description: Must exist in slv_campaigns.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_campaigns')
                field: campaign_id
        entity:
          type: foreign
          name: campaign
      - name: spend
        description: Spend that day in EUR.
        tests: [not_null]
    metrics:
      - name: ad_spend_eur
        description: Ad spend across campaigns, in EUR.
        label: Ad spend (EUR)
        type: simple
        agg: sum
        expr: spend
      - name: ad_clicks
        description: Clicks on ads across campaigns.
        label: Ad clicks
        type: simple
        agg: sum
        expr: clicks

  - name: slv_leads
    description: One row per CRM lead, latest load wins. created_date is created_ts in UTC. Alias silver.leads.
    semantic_model:
      enabled: true
      name: leads
    agg_time_dimension: created_date
    tests:
      - latest_load_reconciles:
          name: hop_bronze_to_slv_leads
          arguments:
            bronze: ref('brz_synthetic_leads')
            keys: [lead_id]
            tie_breaker: _run_id
          config:
            tags: [silver, marketing]
    columns:
      - name: lead_id
        description: Natural key.
        tests: [not_null, unique]
        entity:
          type: primary
          name: lead
      - name: campaign_id
        description: The campaign the lead came from; must exist in slv_campaigns.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_campaigns')
                field: campaign_id
        entity:
          type: foreign
          name: campaign
      - name: created_date
        description: UTC date the lead was created.
        tests: [not_null]
        dimension:
          type: time
        granularity: day
      - name: country
        description: ISO-2 country of the lead.
        dimension:
          type: categorical
    metrics:
      - name: leads
        description: CRM leads created, on the day they were created.
        label: Leads
        type: simple
        agg: count
        expr: 1

  - name: slv_bookings
    description: >
      One row per booking, latest load wins, with its lead's campaign. booked_date is booked_ts in UTC.
      A booking whose lead is not loaded yet (leads arrive per interval, a booking up to three weeks
      later) keeps a NULL campaign_id, so it groups under an empty channel; its lead tests warn rather
      than fail. Alias silver.bookings.
    config:
      meta:
        glossary:
          - term: Conversion
            description: >-
              A lead that books. Bookings count conversions on the day they are made; the lead-to-booking rate
              counts a lead as converted when it books within 30 days of being created; cost per conversion is
              cost per booking.
            synonyms: [converted lead, booked lead]
            metrics: [bookings, lead_to_booking_rate, cost_per_booking_eur]
    semantic_model:
      enabled: true
      name: bookings
    agg_time_dimension: booked_date
    tests:
      - latest_load_reconciles:
          name: hop_bronze_to_slv_bookings
          arguments:
            bronze: ref('brz_synthetic_bookings')
            keys: [booking_id]
            tie_breaker: _run_id
            amount: amount
          config:
            tags: [silver, marketing]
    columns:
      - name: booking_id
        description: Natural key.
        tests: [not_null, unique]
        entity:
          type: primary
          name: booking
      - name: lead_id
        description: The lead that booked; each lead books at most once.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('slv_leads')
                field: lead_id
              config:
                severity: warn
        entity:
          type: foreign
          name: lead
      - name: campaign_id
        description: The lead's campaign; NULL while the lead is not loaded.
        tests:
          - not_null:
              config:
                severity: warn
        entity:
          type: foreign
          name: campaign
      - name: booked_date
        description: UTC date the booking was made.
        tests: [not_null]
        dimension:
          type: time
        granularity: day
      - name: amount
        description: Booking value in EUR.
        tests: [not_null]
    metrics:
      - name: bookings
        description: Bookings made by leads, on the day they were made.
        label: Bookings
        type: simple
        agg: count
        expr: 1
      - name: booking_value_eur
        description: Value of the bookings made, in EUR.
        label: Booking value (EUR)
        type: simple
        agg: sum
        expr: amount
