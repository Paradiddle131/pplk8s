# Connection profile used by the dbt image (DBT_PROFILES_DIR=/dbt).
# Every value is overridable by environment variable; the defaults target the lab's Compose warehouse.
pplk8s:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"  # bigquery: compile-only; bigquery_emulator; gcp: the lab project
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'warehouse') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER', 'warehouse') }}"
      password: "{{ env_var('DBT_PASSWORD', 'warehouse') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'warehouse') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'public') }}"
      threads: 4
    # Compile-only (semantic/PLAN.md R7, S5): the same project and semantic YAML on BigQuery's
    # adapter, for `dbt parse` and MetricFlow's offline SQL; nothing here runs against GCP.
    bigquery:
      type: bigquery
      # A placeholder token lets dbt build its client offline; a compile without introspection
      # never sends it. At work: `method: oauth` (application default credentials).
      method: oauth-secrets
      token: "{{ env_var('BQ_TOKEN', 'compile-only') }}"
      project: "{{ env_var('BQ_PROJECT', 'pplk8s-lab') }}"
      dataset: "{{ env_var('DBT_SCHEMA', 'public') }}"
      location: "{{ env_var('BQ_LOCATION', 'EU') }}"
      threads: 4
    # The same adapter against the BigQuery emulator (semantic/PLAN.md SL-7): runs, not only
    # compiles. The emulator takes any token; one thread, as it serialises jobs anyway, and no job
    # retries, so an unsupported statement fails at once instead of after the adapter's backoff.
    bigquery_emulator:
      type: bigquery
      method: oauth-secrets
      token: emulator
      project: pplk8s-lab
      dataset: "{{ env_var('DBT_SCHEMA', 'public') }}"
      location: US
      api_endpoint: "{{ env_var('BQ_API_ENDPOINT', 'http://localhost:9050') }}"
      threads: 1
      job_retries: 0
    # The lab project on real BigQuery (semantic/PLAN.md SL-13, SL-19; #206): application default credentials,
    # or the access token in GCP_ACCESS_TOKEN where a proxy injects the real one (cloud sessions); the project
    # from GCP_PROJECT, which it refuses without. Every job is capped at 1 GiB billed (BigQuery fails a job
    # that would bill more, before it runs) and 5 minutes, and carries dbt's query comment as job labels
    # (dbt_project.yml `query-comment`), so the Data Access log and INFORMATION_SCHEMA.JOBS name the run.
    gcp:
      type: bigquery
      method: "{{ 'oauth-secrets' if env_var('GCP_ACCESS_TOKEN', '') else 'oauth' }}"
      token: "{{ env_var('GCP_ACCESS_TOKEN', '') }}"
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: "{{ env_var('DBT_SCHEMA', 'public') }}"
      location: US
      maximum_bytes_billed: 1073741824
      job_execution_timeout_seconds: 300
      threads: 4
