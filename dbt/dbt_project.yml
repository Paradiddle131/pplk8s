name: pplk8s
version: "0.1.0"
config-version: 2

profile: pplk8s

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"

# A test runs under indirect selection only when all of its parents are selected.
# Without this, `build --select silver` would also run the gold reconciliation test before gold exists.
flags:
  indirect_selection: cautious
clean-targets: ["target", "dbt_packages"]

models:
  pplk8s:
    bronze:
      +schema: bronze
      +tags: [bronze]
      +materialized: view
    silver:
      +schema: silver
      +tags: [silver]
      +materialized: table
    gold:
      +schema: gold
      +tags: [gold]
      +materialized: table
    exposed:
      +schema: exposed
      +tags: [exposed]
      +materialized: view

# Seeds sit in a layer folder so `--select <layer>` (fqn) builds them with that layer's models.
seeds:
  pplk8s:
    bronze:
      +schema: bronze
      +tags: [bronze]
      tlc_taxi_zones:
        +tags: [tlc]
        +column_types:
          location_id: integer
          borough: text
          zone: text
          service_zone: text
