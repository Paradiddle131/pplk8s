# promtool unit tests for SourceStale and SourceFreshnessNotChecked (#130), run by `make rules-test`
# (tests/monitoring/rules-test.sh), which writes each PrometheusRule manifest's spec to
# <manifest>.rules.yaml beside this file first.
rule_files:
  - airflow-rules.rules.yaml

evaluation_interval: 1m

tests:
  # The hourly check at t=0 finds both tables fresh (orders loaded at -1 h). The check at 60m finds
  # orders past its error_after: the exporter's series moves from status pass to status error (the row's
  # old label set goes stale), and SourceStale fires once the 2 m `for:` has passed, valued at the age of
  # its newest row. customers stays quiet. At 120m the check finds orders fresh again (a load at 110m)
  # and the alert clears.
  - interval: 1m
    input_series:
      - series: 'ops_source_freshness_checked_timestamp_seconds{source="ds_source", table="synthetic_orders", status="pass", target="warehouse"}'
        values: '0x59 stale _x59 7200x60'
      - series: 'ops_source_freshness_checked_timestamp_seconds{source="ds_source", table="synthetic_orders", status="error", target="warehouse"}'
        values: '_x60 3600x59 stale'
      - series: 'ops_source_max_loaded_at_seconds{source="ds_source", table="synthetic_orders", target="warehouse"}'
        values: '-3600x119 6600x60'
      - series: 'ops_source_freshness_checked_timestamp_seconds{source="ds_source", table="synthetic_customers", status="pass", target="warehouse"}'
        values: '0x59 3600x60 7200x60'
      - series: 'ops_source_max_loaded_at_seconds{source="ds_source", table="synthetic_customers", target="warehouse"}'
        values: '-600x180'
    alert_rule_test:
      - eval_time: 30m
        alertname: SourceStale
        exp_alerts: []
      - eval_time: 61m
        alertname: SourceStale
        exp_alerts: [] # pending, not firing
      - eval_time: 63m
        alertname: SourceStale
        exp_alerts:
          - exp_labels: {source: ds_source, table: synthetic_orders, status: error, severity: warning}
            exp_annotations:
              summary: "ds_source.synthetic_orders stopped flowing: its newest row landed 2h 3m 0s ago."
              runbook: docs/runbook.md#13-a-source-stops-flowing
      - eval_time: 122m
        alertname: SourceStale
        exp_alerts: []
      - eval_time: 122m
        alertname: SourceFreshnessNotChecked
        exp_alerts: []

  # A table the check could not read (dropped, or never created) records `runtime error` and no load.
  - interval: 1m
    input_series:
      - series: 'ops_source_freshness_checked_timestamp_seconds{source="ds_source", table="tlc_green", status="runtime error", target="warehouse"}'
        values: '0x10'
      - series: 'ops_source_max_loaded_at_seconds{source="ds_source", table="tlc_green", target="warehouse"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: SourceStale
        exp_alerts:
          - exp_labels: {source: ds_source, table: tlc_green, status: runtime error, severity: warning}
            exp_annotations:
              summary: "ds_source.tlc_green could not be checked for freshness."
              runbook: docs/runbook.md#13-a-source-stops-flowing

  # The CronJob stops: the last check at t=0 stays the newest, quiet until two hours have passed, firing
  # 2 m later, valued at the age of the last check.
  - interval: 1m
    input_series:
      - series: 'ops_source_freshness_checked_timestamp_seconds{source="ds_source", table="synthetic_orders", status="pass", target="warehouse"}'
        values: '0x180'
    alert_rule_test:
      - eval_time: 119m
        alertname: SourceFreshnessNotChecked
        exp_alerts: []
      - eval_time: 123m
        alertname: SourceFreshnessNotChecked
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "dbt source freshness last recorded a result 2h 3m 0s ago; SourceStale is blind."
              runbook: docs/runbook.md#13-a-source-stops-flowing
